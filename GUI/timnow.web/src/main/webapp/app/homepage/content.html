
<div class="content-section news" ng-if="lastNews">
    <section class="form-heading form-border">
        <a ng-if="isAuthorized('Home Page','Storico News')" ui-sref="root.news" class="nav-back">tutte le news</a>
        <h1 ng-if="isAuthorized('Home Page','News')">Le News</h1>
    </section>
    <section ng-if="isAuthorized('Home Page','News')" class="user-content user-wrapper">
        <h4>{{lastNews.title}}</h4>
        <span class="subtitle small detail">Data inserimento: {{lastNews.insertDate}} - Data aggiornamento: {{lastNews.updateDate}}</span>
        <p>{{lastNews.content}}</p>
    </section>
</div>
<div class="clear"></div>

<!-------------------------         LIST MENU SECTION       START ----------------------------- -->
<section class="menu-container">
    <div class="row menu">
        <div ng-if="isAuthorized('Ordini','Nuovo Ordine')" class="{{classTab}} menu-grids" ng-click="$state.go('root.ordini.new', {init : true})">
            <div class="menu-icons">
                <img src="assets/css/i/add.png" class="img-responsive" alt="" />
            </div>
            <!-- <a ui-sref="root.ordini.nuovo">NUOVO<br>ORDINE</a> -->
            <a>NUOVO<br>ORDINE</a>
        </div>
        <div ng-if="isAuthorized('Asset','Lista Asset')" class="{{classTab}} menu-grids" ng-click="$state.go('root.consistenze.asset.lista')">
            <div class="menu-icons">
                <img src="assets/css/i/list.png" class="img-responsive" alt="" />
            </div>
            <!-- <a href="#" ui-sref="root.ordini.lista">LISTA<br>ASSET</a> -->
            <a>LISTA<br>ASSET
            </a>
        </div>
        <div ng-if="isAuthorized('File e Notifiche','Upload File Ordini e Richieste')" class="{{classTab}} menu-grids" ng-click="$state.go('root.notifiche.upload')">
            <div class="menu-icons">
                <img src="assets/css/i/upload_file.png" class="img-responsive" alt="" />
            </div>
            <!-- <a href="#">UPLOAD FILE <br>ORDINE E RICHIESTE</a> -->
            <a>UPLOAD FILE <br>ORDINE E RICHIESTE</a>
        </div>
        <div ng-if="isAuthorized('File e Notifiche','Stato File Ordini e Richieste')" class="{{classTab}} menu-grids" ng-click="$state.go('root.notifiche.stato')">
            <div class="menu-icons">
                <img src="assets/css/i/icona-semaforo-hp.png" class="img-responsive" alt="" />
            </div>
            <a>STATO FILE <br>ORDINE E RICHIESTE</a>
        </div>
    </div>
</section>
<!-------------------------      LIST MENU  SECTION       END ----------------------------- -->
