<!-- R1F-21-0411 -->
<style>
.container-filtri {
	clear: both;
	padding-top: 20px;
}
</style>

<div class="content-section">
    <section class="form-heading">
        <h1>Creazione Report</h1>
    </section>
    <section class="user-content">
        <form class="form-horizontal" name="creazioneReportForm" novalidate>
            <div class="form-group" ng-class="{ 'has-error' : creazioneReportForm.nomeReport.$invalid && creazioneReportForm.$submitted }">
                <label class="control-label col-sm-2">Nome Report<sup>*</sup></label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" name="nomeReport" ng-model="report.nomeReport" maxlength="100" required />
                    <div role="alert">
                    	<span class="help-block help-width" ng-if="creazioneReportForm.nomeReport.$invalid && creazioneReportForm.$submitted">Compila questo campo</span>
                    </div>
                </div>
            </div>
            <div class="form-group">
                <label class="control-label col-sm-2">Tipo Lista<sup>*</sup></label>
                <div class="col-sm-10">
                	<select class="selectmenu SB-width form-control" name="tipoLista" ng-model="report.tipoLista" required>
                		<option value=""></option>
						<option value="TUTTI">TUTTI</option>
						<option value="SOSPESO">SOSPESO</option>
						<option value="ACCODATO">ACCODATO</option>
						<option value="OPERASPECIALE">OPERA SPECIALE</option>
						<option value="DONATING">DONATING</option>						
						<option value="ASSET">ASSET</option>
					</select>
					<div role="alert">
						<span class="help-block help-width" ng-if="creazioneReportForm.nomeReport.$invalid && creazioneReportForm.$submitted">Compila questo campo</span>
					</div>
                </div>
            </div>

			<div class="container-filtri" ng-if="report.tipoLista != 'DONATING'">
				<now-advanced-search dati-to-search="report.strutturaCondition"
					titolo=""
					flag-hashing="'Y'"
					always-open="true" callback="creaReport()"
					save-disabled="true"
					cod-funzione="tipoLista" />
			</div>
			
			<div class="container-filtri" ng-if="report.tipoLista == 'DONATING'">
				<div class="form-group">
                	<label class="control-label col-sm-2">Codice Ordine TI</label>
                	<div class="col-sm-10">
                    	<input type="text" class="form-control" name="codice-ordine" ng-model="report.codOrdineTi" />
                	</div>
            	</div>
	            <div class="form-group">
	                <label class="control-label col-sm-2">Nome File Notifica</label>
	                <div class="col-sm-10">
	                    <input type="text" class="form-control" name="nome-file" ng-model="report.nomeFileNotifica" />
	                </div>
	            </div>
	            <div class="form-group">
	                <label class="control-label col-sm-2">ID Risorsa</label>
	                <div class="col-sm-10">
	                    <input type="text" class="form-control" name="id-risorsa" ng-model="report.idRisorsa" />
	                </div>
	            </div>
	            <div class="form-group">
	                <label class="control-label col-sm-2">Codice Sessione</label>
	                <div class="col-sm-10">
	                    <input type="text" class="form-control" name="codice-sessione" ng-model="report.codiceSessione" />
	                </div>
	            </div>
	            <div class="form-group">
                	<div class="col-sm-offset-2 col-sm-10">
                    	<button type="submit" class="btn btn-disabled" ng-disabled="!(report.codOrdineTi || report.nomeFileNotifica || report.idRisorsa || report.codiceSessione)" ng-click="creaReport()">Ricerca</button>    
                    	<button type="button" class="btn btn-disabled" ng-click="clearFiltriOrdiniDonating()">Annulla</button>
                	</div>
            	</div>
			</div>	
			
			<div class="row mandatory-row">
				<div
					class="col-xs-12 col-sm-12 col-md-12 col-lg-12 form-horizontal mandatory-field">
					<i>*Campo obbligatorio</i>
				</div>
			</div>			
		</form>
    </section>
</div>
