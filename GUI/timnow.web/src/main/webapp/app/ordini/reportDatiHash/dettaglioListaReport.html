<!-- R1F-21-0411 -->
<div class="content-section">
	<section class="form-heading">
		<h1>Dettaglio Report</h1>
	</section>	
	<section class="form-heading">
				<now-export-file 
				ng-if="dettaglioListaReport.length > 0 && tipoLista != 'DONATING'"
				export-callback="iniziaExport"
				vista="(tipoLista == 'ASSET') ? $root.VIEW.ASSET : $root.VIEW.ORDINI">
	</section>	
	<section class="form-heading">
		<div class="button-list">
			<button ng-click="loadDettaglioListaReport()">
				<span class="glyphicon glyphicon-refresh" aria-hidden="true"></span>
				Aggiorna Lista
			</button>
		</div>
		<div class="button-list" style="float: left;">
			<button ng-click="back()">
				<span class="glyphicon glyphicon-chevron-left" aria-hidden="true"></span>
				Indietro
			</button>
		</div>
	</section>
	<div style="clear: both">
		<now-table dati="dettaglioListaReport"
			custom-header="headerDettaglioListaReport" tipologia="'record nel report'"
			show-spinner="!datiLoaded" is-large-with-h-scroll="true"
			row-selection-callback="getDettaglio"> </now-table>
	</div>
</div>
