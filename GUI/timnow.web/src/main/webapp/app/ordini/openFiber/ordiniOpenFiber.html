<!-- RU_1492 -->
<div class="content-section">
	<section class="form-heading">
		<h1>Lista Ordini OpenFiber</h1>
	</section>
	<now-export-file ng-if="orders.length>0" export-callback="iniziaExport"
		vista="$root.VIEW.ORDINI_OPENFIBER"> </now-export-file>
	<div style="clear: both">
		<now-advanced-search dati-to-search="paramToSearch"
			title="ricerca avanzata" titolo="tipologia"
			always-open="enableRicercaOrdini" callback="getSearchAdvanced()"
			cod-funzione="tipologiaRicerca"> </now-advanced-search>
		<div ng-if="!enableRicercaOrdini">
			<now-table dati="orders" custom-header="headerList"
				tipologia="tipologia" show-spinner="datiLoaded"
				is-large-with-h-scroll="true"
				row-selection-callback="getDettaglioOrdini"> </now-table>
		</div>
		<div ng-if="enableRicercaOrdini">Si invita l'utente ad utilizzare la Ricerca Avanzata per recuperare gli ordini di interesse.</div>
	</div>
</div>
