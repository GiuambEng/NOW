<!-- RU_1058 -->
<ng-form name="caratteristica" novalidate>
	<section class="form-process">
		<div class="row">		
			<div class="col-xs-12 paddL0 form-horizontal">
				<div class="form-group">
					<label class="col-xs-3 control-label">Codice TD KIT</label>
					<label class="col-xs-7">{{customizedOffer.offerTopDetails.CODICETDKIT.dft}}</label>
				</div>									
				<div class="form-group"
					ng-class="{ 'has-error' : configurazioneOffertaForm.caratteristica.caratteristicaVP.$invalid && configurazioneOffertaForm.$submitted }">
					<label class="col-xs-3 control-label">Caratteristica VP<sup>*</sup></label>
					<div class="col-xs-7">
						<select class="selectmenu SB-width form-control" name="caratteristicaVP" required ng-model="customizedOffer.offerTopDetails.CARATTERISTICAVP.dft">
							<option value=""></option>
							<option ng-repeat="item in arrayCaratteristicaVP" value="{{item}}">{{item}}</option>
						</select> 
						<div role="alert">      
							<span ng-if="configurazioneOffertaForm.caratteristica.caratteristicaVP.$error.required && configurazioneOffertaForm.$submitted"
								class="help-block help-width">Campo obbligatorio</span>                              			
		                	<span  ng-if="campiModificati['CARATTERISTICAVP']"                               	      			
		                    	class="help-block help-width">Valore da asset: {{_caratteristicaVp}}</span>
		     			</div>
					</div>
				</div>
				<div class="form-group"
					ng-class="{ 'has-error' : configurazioneOffertaForm.caratteristica.mcr.$invalid && configurazioneOffertaForm.$submitted }">
					<label class="col-xs-3 control-label">MCR<sup>*</sup></label>
					<div class="col-xs-7">
						<select class="selectmenu SB-width form-control" required name="mcr" ng-model="customizedOffer.offerTopDetails.BANDAMCR.dft"
							ng-options="item for item in arrayMCR">
							<!-- option value=""></option>
							<option ng-repeat="item in arrayMCR" value="{{item}}">{{item}}</option-->
						</select> 
						<div role="alert">     
							<span ng-if="configurazioneOffertaForm.caratteristica.mcr.$error.required && configurazioneOffertaForm.$submitted"
								class="help-block help-width">Campo obbligatorio</span>                                 			
		     				<span  ng-if="campiModificati['BANDAMCR']"                               	      			
		     	      			class="help-block help-width">Valore da asset: {{_mcr}}</span>
		     			</div>
					</div>
				</div>
				<div class="form-group"
					ng-class="{ 'has-error' : configurazioneOffertaForm.caratteristica.pcr.$invalid && configurazioneOffertaForm.$submitted }">
					<label class="col-xs-3 control-label">PCR<sup>*</sup></label>
					<div class="col-xs-7">
						<select class="selectmenu SB-width form-control" required name="pcr" ng-model="customizedOffer.offerTopDetails.BANDAPCR.dft"
							ng-options="item for item in arrayPCR">
							<!-- option value=""></option>
							<option ng-repeat="item in arrayPCR" value="{{item}}">{{item}}</option-->
						</select> 
						<div role="alert">
							<span ng-if="configurazioneOffertaForm.caratteristica.pcr.$error.required && configurazioneOffertaForm.$submitted"
								class="help-block help-width">Campo obbligatorio</span>                                       			
		     				<span  ng-if="campiModificati['BANDAPCR']"                               	      			
		     	      			class="help-block help-width">Valore da asset: {{_pcr}}</span>
		     			</div>
					</div>
				</div>
				<div class="form-group"
					ng-class="{ 'has-error' : configurazioneOffertaForm.caratteristica.vpi.$invalid && configurazioneOffertaForm.$submitted }">
					<label class="col-xs-3 control-label">VPI</label>
					<div class="col-xs-7">
						<input type="text" class="form-control SB-width" name="vpi" ng-model="customizedOffer.offerTopDetails.VPI.dft" ng-pattern="regexVPI">
						<div role="alert">
		     	      		<span ng-if="configurazioneOffertaForm.caratteristica.vpi.$error.pattern"
								class="help-block help-width">Inserire un valore tra 10 e 255</span>
							<span  ng-if="campiModificati['VPI']"                               	      			
		     	      			class="help-block help-width">Valore da asset: {{_vpi}}</span>
		     			</div>
					</div>
				</div>
			</div>
		</div>
	</section>
</ng-form>
