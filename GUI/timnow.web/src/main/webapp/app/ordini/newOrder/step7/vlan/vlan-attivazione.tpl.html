<!-- RU_1058 -->
<div ng-controller="vlanAttivazioneStep7">
	<ng-form class="form-container" name="dettaglioForm">
		<section class="form-process">
			<div class="row">
				<!-- SPALLA SINISTRA -->
				<div class="col-xs-12 form-horizontal paddL0">
					<!-- RU_1166 -->
					<div class="form-group" ng-if="showSuperMacroArea">
						<label class="col-xs-3 control-label">SuperMacroArea</label>
						<div class="col-xs-7 selected-item">
							<select class="selectmenu SB-width form-control"
								name="superMacroArea" ng-model="customizedOffer.offerTopDetails.SUPERMACROAREA.dft"
								ng-options="item for item in arraySuperMacroArea track by item">
								<option value=""></option>
							</select>
						</div>
					</div>
					<!-- RU_1502 -->
					<div class="form-group" ng-if="showFlagDRG && RU_1502">
						<label class="col-xs-3 control-label">Flag DRG</label>
						<div class="col-xs-7 selected-item">
							<select class="selectmenu SB-width form-control"
								name="flagDrg"	ng-model="data.step7.flagDRG">
								<option value></option>
								<option value="Y">SI</option>
								<option value="N">NO</option>
							</select>
						</div>
					</div>	
					
					<div class="form-group" ng-if="showCcLib">
						<label class="col-xs-3 control-label">CC_LIB</label>
						<div class="col-xs-7 selected-item">
							<select class="selectmenu SB-width form-control"
								name="ccLib" ng-model="customizedOffer.offerTopDetails.TIPOLOGIACLUSTERVLAN.dft"
								ng-options="item for item in arrayCCLib track by item">
								<option value=""></option>
							</select>
						</div>
					</div>					
					<div class="form-group"
						ng-class="{ 'has-error' : dettaglioForm.codiceTdKit.$invalid && !dettaglioForm.codiceTdKit.$pristine }">
						<label class="col-xs-3 control-label">Codice TD KIT<sup>*</sup>
							<span ng-if="loadingCodiceTDKit" us-spinner="{radius:5, width:1, length: 5}"></span>
						</label>
						<div class="col-xs-7 selected-item">
							<!-- SM_9825 -->
							<input type="text"
	                               class="form-control SB-width"
	                               ng-model="customizedOffer.offerTopDetails.CODICETDKIT.dft"
	                               name="codiceTdKit"
								   required
	                               disabled>
							<a ng-href="#" class="openpopup" ng-click="configureCodiceTDKit($event)">
	                            <img src="assets/css/i/form_arrow.png" alt="form">
	                        </a>
	                        <div role="alert">
								<span
									ng-if="dettaglioForm.codiceTdKit.$error.required && !dettaglioForm.codiceTdKit.$pristine"
									class="help-block help-width">Seleziona questo campo</span>
							</div>
						</div>
					</div>					
					<!-- RU??? -->					
					<div class="form-group"
						ng-class="{ 'has-error' : dettaglioForm.macroArea.$invalid && !dettaglioForm.macroArea.$pristine }">
						<label class="col-xs-3 control-label">MacroArea<sup>*</sup>
							<span ng-if="loadingMacroArea" us-spinner="{radius:5, width:1, length: 5}"></span>
						</label>
						<div class="col-xs-7 selected-item">
							<select class="selectmenu SB-width form-control"
								name="macroArea" ng-model="data.step7.macroAreaJson" required>
								<option value=""></option>
								<option ng-repeat="item in arrayMacroArea" value="{{item}}">{{item.descrizioneArea}}</option>
							</select>
							<div role="alert">
								<span
									ng-if="dettaglioForm.macroArea.$error.required && !dettaglioForm.macroArea.$pristine"
									class="help-block help-width">Seleziona questo campo</span>
							</div>
						</div>
					</div>
					
					<div class="form-group"
						ng-class="{ 'has-error' : dettaglioForm.area.$invalid && !dettaglioForm.area.$pristine }">
						<label class="col-xs-3 control-label">Area<sup>*</sup>
							<span ng-if="loadingArea" us-spinner="{radius:5, width:1, length: 5}"></span>
						</label>
						<div class="col-xs-7 selected-item">
							<select class="selectmenu SB-width form-control"
								name="area"	ng-model="data.step7.areaJson"
								required>
								<option value=""></option>
								<option ng-repeat="item in arrayArea" value="{{item}}">{{item.area}}</option>
							</select>
							<div role="alert">
								<span
									ng-if="dettaglioForm.area.$error.required && !dettaglioForm.area.$pristine"
									class="help-block help-width">Seleziona questo campo</span>
							</div>
						</div>
					</div>
					<div class="form-group"
						ng-class="{ 'has-error' : dettaglioForm.clliCentrale.$invalid && !dettaglioForm.clliCentrale.$pristine }">
						<label class="col-xs-3 control-label">CLLI Centrale<sup>*</sup>
							<span ng-if="loadingCodiceClli" us-spinner="{radius:5, width:1, length: 5}"></span>
						</label>
						<div class="col-xs-7 selected-item">
							<select class="selectmenu SB-width form-control"
								name="clliCentrale"	ng-model="customizedOffer.offerTopDetails.CODICECLLI.dft"
								required>
								<option value=""></option>
								<option ng-repeat="item in arrayClliCentrale" value="{{item}}">{{item}}</option>
							</select>
							<div role="alert">
								<span
									ng-if="dettaglioForm.clliCentrale.$error.required && !dettaglioForm.clliCentrale.$pristine"
									class="help-block help-width">Seleziona questo campo</span>
							</div>
						</div>
					</div>
					<div class="form-group"
						ng-class="{ 'has-error' : dettaglioForm.idVlanOlo.$invalid && !dettaglioForm.idVlanOlo.$pristine }">
						<label class="col-xs-3 control-label">IDVLANOLO<sup>*</sup></label>
			            <div class="col-xs-7">
			                 <input type="number" class="form-control SB-width"
			                        name="idVlanOlo"
			                        ng-model="customizedOffer.offerTopDetails.IDENTIFICATIVOVLANOLO.dft"
			                        ng-pattern="rangeIdentificativoVlan"
			                        required>
			                  <div role="alert">
			                  	<span ng-if="dettaglioForm.idVlanOlo.$invalid && dettaglioForm.$submitted" class="help-block help-width">Compila questo campo</span>
			                  	<span ng-if="dettaglioForm.idVlanOlo.$error.pattern" class="help-block help-width">Inserire un valore compreso tra 2 e 4000</span>
			                  </div>
			           </div>
					</div>
					<div class="form-group" ng-if="showFtthOnly">
						<label class="col-xs-3 control-label">FTTH_Only</label>
						<div class="col-xs-7 selected-item">
							<select class="selectmenu SB-width form-control"
								name="ftthOnly"	ng-model="customizedOffer.offerTopDetails.FTTHONLY.dft">
								<option value=""></option>
								<option value="Y">SI</option>
							</select>
						</div>
					</div>
					<div class="form-group" ng-if="showCAR">
						<label class="col-xs-3 control-label">CAR<sup ng-if="isCARRequired">*</sup>
							<span ng-if="loadingCAR" us-spinner="{radius:5, width:1, length: 5}"></span>
						</label>
						<div class="col-xs-7 selected-item">
							<input type="text"
	                               class="form-control SB-width"
	                               ng-model="customizedOffer.offerTopDetails.IDENTIFICATIVOCAR.dft"
	                               name="car"
	                               ng-required="isCARRequired"
	                               disabled>
	                          <a ng-href="#" class="openpopup" ng-click="configureCAR($event)" ng-if="enableCAR">
	                            <img src="assets/css/i/form_arrow.png" alt="form">
	                          </a>
	                          <div role="alert">
								<span
									ng-if="dettaglioForm.car.$error.required && !dettaglioForm.car.$pristine"
									class="help-block help-width">Seleziona questo campo</span>
							  </div>
						</div>
					</div>
					<div class="form-group" ng-if="showIntermediateAgentDhcpOption82">
						<label class="col-xs-3 control-label">INTERMEDIATE_AGENT_DHCP OPTION 82</label>
						<div class="col-xs-7 selected-item">
							<select class="selectmenu SB-width form-control"
								name="intermediateAgentDhcpOption82" ng-model="customizedOffer.offerTopDetails.INTERMEDIATEAGENTDHCPOPTION82.dft">
								<option value=""></option>
								<option value="Y">SI</option>
							</select>
						</div>
					</div>
				</div>
			</div>
		</section>
		<div class="col-xs-12 madatory-field paddL0">
	    	<i>*Campo obbligatorio</i>
	    </div>
	    <section class="form-button">
				<button class="btn btn-disabled" type="button"
					ng-click="confermaAnnulla()">Annulla</button>
				<button class="btn btn-disabled" type="button"
					ng-click="goTo()">Indietro</button>
				<button ng-if="isAuthorized('Ordini','Ordini in Bozza') && !bozza.nomeBozza" class="btn blue-btn" type="button" ng-click="salvaBozza()">Salva in Bozza</button>
				<button
					ng-if="isAuthorized('Ordini','Ordini in Bozza') && bozza.nomeBozza"
					class="btn blue-btn" type="button" ng-click="salvaBozza('aggiorna')">Aggiorna
					Bozza</button>
				<button class="btn blue-btn" type="button" ng-disabled="!dettaglioForm.$valid" ng-click="submitFormVlan($event)">Avanti</button>	
		</section>
	</ng-form>
</div>
