<!-- RU_1058 -->
<ng-form name="carForm" novalidate ng-controller="vlanVariazioneStep4">
	<section class="form-process">		
		<div class="row">
			<div class="col-xs-12 paddL0 form-horizontal">
				<div class="form-group">
					<label class="col-xs-3 control-label">Codice TD KIT</label>
					<label class="col-xs-7 selected-item">{{_codiceTDKIT}}</label>
				</div>
				<div class="form-group">
					<label class="col-xs-3 control-label">Famiglia VLAN</label>
					<label class="col-xs-7 selected-item">{{_famigliaVlan}}</label>
				</div>
				<!-- SM_9794 -->
				<div class="form-group" ng-repeat="cos in _COS" ng-if="_famigliaVlan == 'VLAN MonoCoS Banda Condivisa'">
					<label class="col-xs-3 control-label">CoS</label>
					<label class="col-xs-7 selected-item">{{cos.dft}}</label>
				</div>
				<div class="form-group" ng-if="showSuperMacroArea">
					<label class="col-xs-3 control-label">SuperMacroArea</label>
					<div class="col-xs-7 selected-item">
						<select class="selectmenu SB-width form-control"
							name="superMacroArea"	ng-model="customizedOffer.offerTopDetails.SUPERMACROAREA.dft"
							ng-options="item for item in arraySuperMacroArea track by item">
							<option value=""></option>
						</select>
						<div role="alert">
			               	<span ng-if="campiModificati['SUPERMACROAREA']" class="help-block help-width">Valore precedente: {{_superMacroArea}}</span>
			            </div>
					</div>
				</div>
				<!-- RU_1502 -->
				<div class="form-group" ng-if="showFlagDRG && RU_1502">
					<label class="col-xs-3 control-label">Flag DRG</label>
					<div class="col-xs-7 selected-item">
						<select class="selectmenu SB-width form-control"
							name="flagDrg"	ng-model="data.step4.flagDRG">
							<option value></option>
							<option value="Y">SI</option>
							<option value="N">NO</option>
						</select>
					</div>
				</div>
				
				<!-- SM_9825 -->
				<div class="form-group" ng-if="showCcLib">
					<label class="col-xs-3 control-label">CC_LIB</label>
					<div class="col-xs-7 selected-item">
						<select class="selectmenu SB-width form-control"
							name="ccLib" ng-model="customizedOffer.offerTopDetails.TIPOLOGIACLUSTERVLAN.dft">
							<option value=""></option>
							<option value="CC">CC</option>
							<option value="LIB">LIB</option>
						</select>
						<div role="alert">
		                  	<span ng-if="campiModificati['TIPOLOGIACLUSTERVLAN']" class="help-block help-width">Valore precedente: {{_ccLib}}</span>
		                </div>
					</div>
				</div>
				<div class="form-group" ng-if="showCAR" ng-class="{ 'has-error' : configurazioneOffertaForm.carForm.car.$invalid && configurazioneOffertaForm.$submitted }">
					<label class="col-xs-3 control-label">CAR<sup>*</sup></label>
					<div class="col-xs-7 selected-item">
						<input type="text"
		                       class="form-control SB-width"
		                       ng-model="customizedOffer.offerTopDetails.IDENTIFICATIVOCAR.dft"
		                       name="car"
		                       disabled
		                       required>
		                <a ng-href="#" class="openpopup" ng-click="configureCAR($event)" ng-if="enableCAR">
		                   <img src="assets/css/i/form_arrow.png" alt="form">
		                </a>
		                <div role="alert">
							<span
								ng-if="configurazioneOffertaForm.carForm.car.$error.required && configurazioneOffertaForm.$submitted"
								class="help-block help-width">Seleziona questo campo</span>
							<span ng-if="campiModificati['IDENTIFICATIVOCAR']" class="help-block help-width">Valore precedente: {{_CAR}}</span>
						</div>
					</div>
				</div>
			</div>
		</div>
	</section>	
</ng-form>
