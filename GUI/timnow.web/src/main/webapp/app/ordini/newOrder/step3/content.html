<div class="content-section" ng-controller="newOrderStep3">
    <section class="form-heading">
        <h1>Nuovo Ordine - <span class="capitalize" >{{ data.step1.causale_ordine }}</span></h1>
    </section>
    <div class="process-steps-wrapper">
        <div class="process-steps-label">
            <span class="steps">Intestazione<br>ordine</span>
            <span class="steps">Dati<br>ordine</span>
            <span class="steps" ng-if="data.step1.causale_ordine != 'variazione'">Scelta<br>dell'offerta</span>
            <span class="steps" ng-if="data.step1.causale_ordine == 'variazione'">Scelta<br>della variazione</span>
            <span class="steps" ng-if="data.step1.causale_ordine != 'variazione'">Configurazione<br>offerta</span>
            <span class="steps" ng-if="data.step1.causale_ordine == 'variazione'">Configurazione<br>variazione</span>
            <span class="steps" ng-if="data.step1.causale_ordine != 'variazione' || eightStepToVar">Dati<br>riferimenti</span>
            <span class="steps" ng-if="data.step1.causale_ordine != 'variazione' || eightStepToVar">Dati<br>cliente finale</span>
            <span class="steps">Dettaglio<br>ordine</span>
            <span class="steps">Riepilogo<br>ordine</span>
        </div>
        <div class="process-steps step-8">
            <span><a ng-click="goTo('root.ordini.new.step1')"><em class="processed"></em></a></span><span class="line blue">&nbsp;</span>
            <span><a ng-if="formData.stepReached >= 2" ng-click="goTo('root.ordini.new.step2')"><em class="processed"></em></a><em ng-if="formData.stepReached < 2" class="inactive">2</em></span><span class="line blue">&nbsp;</span>
            <span><em class="active">3</em></span><span class="line" ng-class="{ 'blue': formData.stepReached >= 4, 'grey': formData.stepReached < 4 }">&nbsp;</span>
            <span>
	            <a ng-if="formData.stepReached >= 4 && (!loadStep3 && !errColl)"  ng-click="goTo('root.ordini.new.attivazione-configurazione')"><em class="processed"></em></a>
	            <a ng-if="formData.stepReached >= 4 && (!loadStep3 && errColl)" ><em class="processed"></em></a>
	            <span ng-show="loadStep3"><img src="assets/i/loading.gif" style="width:28px;"/></span>
	            <em ng-if="formData.stepReached < 4 && !loadStep3" class="inactive">4</em></span> 
            	<span class="line" ng-class="{ 'blue': formData.stepReached >= 5, 'grey': formData.stepReached < 5 }">&nbsp;</span>
            <span ng-if="data.step1.causale_ordine != 'variazione' || eightStepToVar"><a ng-if="formData.stepReached >= 5 && data.step5" ng-click="goTo('root.ordini.new.step5')"><em class="processed"></em></a>
            <a ng-if="formData.stepReached >= 5 && !data.step5" disabled><em class="processed"></em></a>
            <em ng-if="formData.stepReached < 5" class="inactive">5</em></span>
            <span ng-if="data.step1.causale_ordine != 'variazione' || eightStepToVar" class="line" ng-class="{ 'blue': formData.stepReached >= 6, 'grey': formData.stepReached < 6 }">&nbsp;</span>
            <span ng-if="data.step1.causale_ordine != 'variazione' || eightStepToVar"><a ng-if="formData.stepReached >= 6 && data.step6" ng-click="goTo('root.ordini.new.step6')"><em class="processed"></em></a>
                  <a ng-if="formData.stepReached >= 6 && !data.step6" disabled><em class="processed"></em></a>
            <em ng-if="formData.stepReached < 6" class="inactive">6</em></span>
            <span ng-if="data.step1.causale_ordine != 'variazione' || eightStepToVar" class="line" ng-class="{ 'blue': formData.stepReached >= 7, 'grey': formData.stepReached < 7 }">&nbsp;</span>
            <span ng-if="data.step1.causale_ordine != 'variazione' || eightStepToVar"><a ng-if="formData.stepReached >= 7 && data.step7" ng-click="goTo('root.ordini.new.step7')"><em class="processed"></em></a>
            	  <a ng-if="formData.stepReached >= 7 && !data.step7" disabled><em class="processed"></em></a><em ng-if="formData.stepReached < 7" class="inactive">7</em></span>
            	  <span ng-if="data.step1.causale_ordine != 'variazione' || eightStepToVar" class="line" ng-class="{ 'blue': formData.stepReached >= 8, 'grey': formData.stepReached < 8 }">&nbsp;</span>
            <span ng-if="data.step1.causale_ordine != 'variazione' || eightStepToVar"><a ng-if="formData.stepReached >= 8 && data.step8" ng-click="goTo('root.ordini.new.step8')"><em class="processed"></em></a>
            	  <a ng-if="formData.stepReached >= 8 && !data.step8" disabled><em class="processed"></em></a>
            <em ng-if="formData.stepReached < 8" class="inactive">8</em></span>
            <span ng-if="(data.step1.causale_ordine == 'variazione') && !eightStepToVar"><a ng-if="formData.stepReached >= 7 && data.step7" ng-click="goTo('root.ordini.new.step7')"><em class="processed"></em></a>
            	  <a ng-if="formData.stepReached >= 7 && !data.step7" disabled><em class="processed"></em></a><em ng-if="formData.stepReached < 7" class="inactive">5</em></span>
            	  <span ng-if="(data.step1.causale_ordine == 'variazione') && !eightStepToVar" class="line" ng-class="{ 'blue': formData.stepReached >= 8, 'grey': formData.stepReached < 8 }">&nbsp;</span>
            <span ng-if="(data.step1.causale_ordine == 'variazione') && !eightStepToVar"><a ng-if="formData.stepReached >= 8 && data.step8" ng-click="goTo('root.ordini.new.step8')"><em class="processed"></em></a>
            	  <a ng-if="formData.stepReached >= 8 && !data.step8" disabled><em class="processed"></em></a>
            <em ng-if="formData.stepReached < 8" class="inactive">6</em></span>
        </div>
    </div>
    <form class="form-container" name="sceltaOfferta" ng-submit="sceltaOfferta.$valid && submit_3()" novalidate>
	    <section class="form-process">
	    
	   	 	<div ng-include="'app/ordini/newOrder/step3/scelta-offerta-'+data.step1.causale_ordine+'.html'"></div>
		
		 <section class="form-button">
	          <button class="btn btn-disabled" type="button" ng-click="confermaAnnulla()">Annulla</button>
	          <button class="btn btn-disabled" type="button" ng-click="goTo()">indietro</button>
	          <button ng-if="isAuthorized('Ordini','Ordini in Bozza') && !bozza.nomeBozza" class="btn blue-btn" type="button" ng-click="salvaBozza()">Salva in Bozza</button>
	          <button ng-if="isAuthorized('Ordini','Ordini in Bozza') && bozza.nomeBozza" class="btn blue-btn" type="button" ng-click="salvaBozza('aggiorna')">Aggiorna Bozza</button>
	    	  <span ng-show="loadStep3"><img src="assets/i/loading.gif" /></span>
	          <button ng-disabled="loadStep3 || errColl" class="btn blue-btn" ng-click="valida(sceltaOfferta)" type="submit" >Avanti</button>
		    </section>
	    </section>
	</form>
</div>
