<!-- RU_1184 -->
<div class="col-xs-12 paddLR0" >
 	<div class="panel-body">
          <div class="row">
	          <div class="col-xs-6 form-horizontal">
	                 <div class="form-group"
                             ng-class="{ 'has-error' : configurazioneOffertaForm.catalogo.disabilitazione.$invalid && !configurazioneOffertaForm.catalogo.disabilitazione.$pristine }">
                            <label class="col-xs-5 control-label">Disabilitazione/Riabilitazione<sup>*</sup></label>
                            <div class="col-xs-7">
                                <select
                                        class="selectmenu SB-width form-control"
                                        name="disabilitazione"
                                        ng-model="customizedOffer.offerTopDetails.DISABILITAZIONE.dft"
                                        required>
                                        <option value=""></option>
                                        <option value="Y">Disabilitazione</option>
                                        <option value="N">Riabilitazione</option>                                        
                                </select>
                                <div role="alert">
                                    <span ng-show="configurazioneOffertaForm.catalogo.disabilitazione.$invalid && !configurazioneOffertaForm.catalogo.disabilitazione.$pristine" class="help-block help-width">Compila questo campo</span>
                                	<span ng-show="customizedOffer.offerTopDetails.DISABILITAZIONE.dft && (DettaglioAsset.offerTopDetails.DISABILITAZIONE.dft != customizedOffer.offerTopDetails.DISABILITAZIONE.dft)" class="help-block help-width">Valore da Asset: "{{ DettaglioAsset.offerTopDetails.DISABILITAZIONE.dft }}"</span>
                                </div>
                            </div>
                        </div>
	           </div>
          </div>
 	</div>               
</div>
