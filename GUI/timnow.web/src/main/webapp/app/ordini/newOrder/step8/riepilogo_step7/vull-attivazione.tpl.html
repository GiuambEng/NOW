<div class="panel-body">
	<div class="row">
		<div class="col-xs-6 form-horizontal paddL0">
			<div class="form-group">
				<label class="col-xs-6 control-label">DN</label>
				<div class="col-xs-6 selected-item">
					<span>{{ data.step7.dn }}</span>
				</div>
			</div>
			<div class="form-group" ng-if="data.step7.dac">
				<label class="col-xs-6 control-label">DAC</label>
				<div class="col-xs-6 selected-item">
					<span>{{ data.step7.dac | date:'dd/MM/yyyy' }}</span>
				</div>
			</div>
			
			<div class="form-group">
				<label class="col-xs-6 control-label">Numero Richiesta Colocazione</label>
				<div class="col-xs-6 selected-item">
					<span>{{ data.step7.numero_richiesta_colocazione }}</span>
				</div>
			</div>
			
			<div class="form-group">
				<label class="col-xs-6 control-label">Data Richiesta Colocazione</label>
				<div class="col-xs-6 selected-item">
					<span>{{ data.step7.dataRichiestaColocazione | date:'dd/MM/yyyy' }}</span>
				</div>
			</div>
		</div>
		<div class="col-xs-6 form-horizontal paddL0">
			<div class="form-group" ng-if="data.step7.dad">
				<label class="col-xs-6 control-label">DAD</label>
				<div class="col-xs-6 selected-item">
					<span>{{ data.step7.dad | date:'dd/MM/yyyy' }}</span>
				</div>
			</div>
			<div class="form-group">
				<label class="col-xs-6 control-label">Fascia oraria</label>
				<div class="col-xs-6 selected-item">
					<span>{{time_slot[data.step7.fascia_oraria]}}</span>
				</div>
			</div>
			<div class="form-group">
				<label class="col-xs-6 control-label">Indicatore Di Scaffale</label>
				<div class="col-xs-6 selected-item">
					<span ng-if="!data.step7.indicatoreDiScaffale"
						class="glyphicon glyphicon-unchecked" aria-hidden="true"
						style="color: #004388"></span> <span
						ng-if="data.step7.indicatoreDiScaffale"
						class="glyphicon glyphicon-check" aria-hidden="false"
						style="color: #004388"></span>
				</div>
			</div>
		</div>
	</div>
</div>
