
<div ng-if="data.step3.opzioneVariazione == 'Prestazione'" ng-init="recuperaCodiciVariazione();">
<div class="col-xs-6 paddL0 form-horizontal">
	 <div class="form-group"
         ng-class="{ 'has-error' : configurazioneOffertaForm.prestazione.$invalid && !configurazioneOffertaForm.prestazione.$pristine }"
        >
        <label class="col-xs-5 control-label">Prestazione <sup>*</sup></label>
        <div class="col-xs-7">
            <div class="selectParent">
                <select 
                        class="selectmenu SB-width form-control"
                        name="prestazione"
                        ng-model="data.step4.prestazione"
                        required>
               			<option ng-repeat="item in data.codiciVariazione" value="{{ item.codice }}">{{item.descrizione}}</option>
                </select>
                <div role="alert">
                    <span ng-if="configurazioneOffertaForm.prestazione.$invalid && !configurazioneOffertaForm.prestazione.$pristine" class="help-block help-width">Compila questo campo</span>
                </div>
            </div>
        </div>
    </div>
	
</div>

<div class="col-xs-6 paddR0 form-horizontal" >
	
</div>
 </div>

<div class="col-xs-6 paddR0 form-horizontal" >
	<div class="form-group" ng-class="{ 'var-mod' :  (data.step1.causale_ordine == 'variazione') && DettaglioAsset.offerTopDetails.FLAGMANTENIMENTOPRODOTTI.dft && (customizedOffer.offerTopDetails.FLAGMANTENIMENTOPRODOTTI.dft != DettaglioAsset.offerTopDetails.FLAGMANTENIMENTOPRODOTTI.dft)}">
	        <label class="col-xs-5 control-label">Flag Mantenimento Prodotti</label>
	         <div class="col-xs-7">
            <input type="checkbox"
                   name="checkboxName"
                   ng-model="customizedOffer.offerTopDetails.FLAGMANTENIMENTOPRODOTTI.dft"
                  >
                  <div role="alert">
       		 <span ng-show="(data.step1.causale_ordine == 'variazione') && customizedOffer.offerTopDetails.FLAGMANTENIMENTOPRODOTTI.dft && (DettaglioAsset.offerTopDetails.FLAGMANTENIMENTOPRODOTTI.dft != customizedOffer.offerTopDetails.FLAGMANTENIMENTOPRODOTTI.dft)" class="help-block help-width">Valore da Asset: "{{ DettaglioAsset.offerTopDetails.FLAGMANTENIMENTOPRODOTTI.dft }}"</span>
         </div>
        </div>
	</div>
</div>
 </div>
