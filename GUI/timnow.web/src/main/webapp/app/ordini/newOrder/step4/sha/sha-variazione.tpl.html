<div class="content-section" ng-controller="regolatorio">
    <section class="form-heading">
        <h1>Nuovo Ordine - <span class="capitalize" >{{ data.step1.causale_ordine }}</span></h1>
    </section>
    <div class="process-steps-wrapper">
        <div class="process-steps-label">
            <span class="steps">Intestazione<br>ordine</span>
            <span class="steps">Dati<br>ordine</span>
            <span class="steps" >Scelta<br>della variazione</span>
            <span class="steps"><b>Configurazione<br>offerta</b></span>
            <span class="steps">Dati<br>riferimenti</span>
            <span class="steps">Dati<br>cliente finale</span>
            <span class="steps">Dettaglio<br>ordine</span>
            <span class="steps">Riepilogo<br>ordine</span>
        </div>
        <div class="process-steps step-8">
            <span><a ng-click="goTo('root.ordini.new.step1')"><em class="processed"></em></a></span><span class="line blue">&nbsp;</span>
            <span><a ng-if="formData.stepReached >= 2" ng-click="goTo('root.ordini.new.step2')"><em class="processed"></em></a><em ng-if="formData.stepReached < 2" class="inactive">2</em></span><span class="line blue">&nbsp;</span>
            <span><a ng-if="formData.stepReached >= 3" ng-click="goTo('root.ordini.new.step3')"><em class="processed"></em></a><em ng-if="formData.stepReached < 3" class="inactive">3</em></span><span class="line blue">&nbsp;</span>
            <span><em class="active">4</em></span>
            <span class="line" ng-class="{ 'blue': formData.stepReached >= 4, 'grey': formData.stepReached < 5 }">&nbsp;</span>
            <span><a ng-if="formData.stepReached >= 5" ng-click="goTo('root.ordini.new.step5')"><em class="processed"></em></a><em ng-if="formData.stepReached < 5" class="inactive">5</em></span><span class="line" ng-class="{ 'blue': formData.stepReached >= 6, 'grey': formData.stepReached < 6 }">&nbsp;</span>
            <span><a ng-if="formData.stepReached >= 6" ng-click="goTo('root.ordini.new.step6')"><em class="processed"></em></a><em ng-if="formData.stepReached < 6" class="inactive">6</em></span><span class="line" ng-class="{ 'blue': formData.stepReached >= 7, 'grey': formData.stepReached < 7 }">&nbsp;</span>
            <span><a ng-if="formData.stepReached >= 7" ng-click="goTo('root.ordini.new.step7')"><em class="processed"></em></a><em ng-if="formData.stepReached < 7" class="inactive">7</em></span><span class="line" ng-class="{ 'blue': formData.stepReached >= 8, 'grey': formData.stepReached < 8 }">&nbsp;</span>
            <span><a ng-if="formData.stepReached >= 8" ng-click="goTo('root.ordini.new.step8')"><em class="processed"></em></a><em ng-if="formData.stepReached < 8" class="inactive">8</em></span>
        </div>
    </div>
    <form class="form-container" ng-submit="configurazioneOffertaForm.$valid && submit_4()"
          name="configurazioneOffertaForm" id="configurazioneOffertaForm" novalidate>
		<section class="form-process" ng-if="destinazioneduso"
				ng-include="'app/ordini/newOrder/step4/regolatorio/DestinazioneDusoeNP.tpl.html'">
		</section>
		<section class="form-process" ng-if="(data.step3.opzioneVariazione == 'Cambio coppia')"
				ng-include="'app/ordini/newOrder/step4/regolatorio/CambioCoppia.tpl.html'">
		</section>
		<section class="form-process" ng-if="(data.step3.opzioneVariazione == 'Trasloco')"
				ng-include="'app/ordini/newOrder/step4/regolatorio/Trasloco.tpl.html'">
		</section>
		<section class="form-process" ng-if="(data.step3.opzioneVariazione == 'Decremento ULL') || (data.step3.opzioneVariazione == 'Decremento SLU')"
				ng-include="'app/ordini/newOrder/step4/regolatorio/CambioCoppia.tpl.html'">
		</section>
        <section class="form-button">
            <button class="btn btn-disabled" type="button" ng-click="confermaAnnulla()">Annulla</button>
            <button class="btn btn-disabled" type="button" ng-click="goTo()">indietro</button>
             <button ng-if="isAuthorized('Ordini','Ordini in Bozza') && !bozza.nomeBozza" class="btn blue-btn" type="button" ng-click="validaBozza()">Salva in Bozza</button>
             <button ng-if="isAuthorized('Ordini','Ordini in Bozza') && bozza.nomeBozza" class="btn blue-btn" type="button" ng-click="salvaBozza('aggiorna')">Aggiorna Bozza</button>
            <span ng-show="caricaPassFive"><img src="assets/i/loading.gif" /></span>
           	<span ng-show="errorPassFive" ng-class="{ 'errIcon' : errorPassFive }" class="glyphicon glyphicon-exclamation-sign" title="{{errorPassFive}}"></span>
           	 <button ng-click="azzeraVariazione()"
                     class="btn blue-btn" 
                     type="button">Ripristina Dati
            </button>
            <button ng-click="valida(configurazioneOffertaForm)"
                    class="btn blue-btn" type="submit">Avanti
            </button>
        </section>
    </form>
</div>
