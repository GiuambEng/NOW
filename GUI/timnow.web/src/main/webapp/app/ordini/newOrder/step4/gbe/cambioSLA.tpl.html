<uib-accordion class="accordion-bs" ng-init="ControlloValoreSLAConsistenza()">
        <uib-accordion-group
                heading="Catalogo"
                ng-form="catalogo"
                is-open="true"
                template-url="accordion-group-template.html">
                
                <div class="col-xs-12 paddLR0" >

 <div class="panel-body">
                <div class="row">
	                <div class="col-xs-6 form-horizontal">
	                      <div class="form-group" ng-class="{ 'has-error' : configurazioneOffertaForm.sla_assurance.$invalid && !configurazioneOffertaForm.encapsulation.$pristine, 'var-mod' :  customizedOffer.offerTopDetails.SLAASSURANCE.dft && (customizedOffer.offerTopDetails.SLAASSURANCE.dft != DettaglioAsset.offerTopDetails.SLAASSURANCE.dft) }">
	                      <label class="col-xs-5 control-label">Sla Assurance<sup>*</sup></label>
	                      
	                       <div class="col-xs-7" >
                                <select
                                        class="selectmenu SB-width form-control"
                                        name="variazione"
                                        ng-change="ControlloValoreSLAConsistenza()"
                                        ng-model="customizedOffer.offerTopDetails.SLAASSURANCE.dft"
                                        required >
                                         <option ng-repeat="item in topDetails.SLAASSURANCE['dft'].split(';')" >{{item}}</option>
                                    </select>
                                <div role="alert">
                                    <span ng-show="configurazioneOffertaForm.catalogo.variazione.$invalid && !configurazioneOffertaForm.catalogo.variazione.$pristine" class="help-block help-width">Compila questo campo</span>
                                	<span ng-show="customizedOffer.offerTopDetails.SLAASSURANCE.dft && (DettaglioAsset.offerTopDetails.SLAASSURANCE.dft != customizedOffer.offerTopDetails.SLAASSURANCE.dft)" class="help-block help-width">Valore da Asset: "{{ DettaglioAsset.offerTopDetails.SLAASSURANCE.dft }}"</span>
                                </div>
                            </div>
	                      </div>
	                </div>
	               
                </div>
 </div>               

</div>
</uib-accordion-group>
</uib-accordion>
