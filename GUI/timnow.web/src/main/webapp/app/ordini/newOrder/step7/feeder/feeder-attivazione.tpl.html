<!-- RU_1058 -->
<div ng-controller="feederAttivazioneStep7">
	<ng-form class="form-container" name="dettaglioForm">
		<section class="form-process">
			<div ng-if="$root.primoFeeder">
				<div ng-include="'app/ordini/newOrder/step7/feeder/primoFeeder/primoFeeder-'+data.step1.causale_ordine+'.tpl.html'"></div>
			</div>
			<div ng-if="$root.secondoFeeder">
				<div ng-include="'app/ordini/newOrder/step7/feeder/feederSuccessivi/feederSuccessivi-'+data.step1.causale_ordine+'.tpl.html'"></div>
			</div>
		</section>
		<div class="col-xs-12 madatory-field paddL0">
	    	<i>*Campo obbligatorio</i>
	    </div>
	    <section class="form-button">
				<button class="btn btn-disabled" type="button"
					ng-click="confermaAnnulla()">Annulla</button>
				<button class="btn btn-disabled" type="button"
					ng-click="goTo('root.ordini.new.step6')">Indietro</button>
				<button ng-if="isAuthorized('Ordini','Ordini in Bozza') && !bozza.nomeBozza" class="btn blue-btn" type="button" ng-click="salvaBozza()">Salva in Bozza</button>
				<button
					ng-if="isAuthorized('Ordini','Ordini in Bozza') && bozza.nomeBozza"
					class="btn blue-btn" type="button" ng-click="salvaBozza('aggiorna')">Aggiorna
					Bozza</button>
				<button class="btn blue-btn" type="button" ng-disabled="!dettaglioForm.$valid" ng-click="submitFormFeeder($event)">Avanti</button>	
		</section>
	</ng-form>
</div>
