<div class="panel-body" >
	<div class="row">
		<div class="col-xs-6 form-horizontal paddL0">
			<div class="form-group">
				<label class="col-xs-6 control-label">Quantit&agrave; Linee</label>
				<div class="col-xs-6 selected-item">
					<span>{{ customizedOffer.offerTopDetails.QUANTITALINEE.dft }}</span>
				</div>
			</div>
			<div class="form-group">
				<label class="col-xs-6 control-label">Direzionalit&agrave;</label>
				<div class="col-xs-6 selected-item">
					<span>{{ customizedOffer.offerTopDetails.DIREZIONALITA.dft }}</span>
				</div>
			</div>
			<div class="form-group">
				<label class="col-xs-5 control-label">Selezione Passante</label>
				<div class="col-xs-7 selected-item">
					<span
						ng-if="!customizedOffer.offerTopDetails.SELEZIONEPASSANTE.dft"
						class="glyphicon glyphicon-unchecked" aria-hidden="true"
						style="color: #004388"></span> <span
						ng-if="customizedOffer.offerTopDetails.SELEZIONEPASSANTE.dft"
						class="glyphicon glyphicon-check" aria-hidden="false"
						style="color: #004388"></span>
				</div>
			</div>
			<div class="form-group">
				<label class="col-xs-6 control-label">Accesso Numerico</label>
				<div class="col-xs-6 selected-item">
					<span>{{customizedOffer.offerTopDetails.ACCESSONUMERICO.dft}}</span>
				</div>
			</div>
		</div>
	</div>
</div>
