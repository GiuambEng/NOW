<div class="col-xs-6 paddL0 form-horizontal">
 <div class="form-group"  >
                    <label class="col-xs-5 control-label">DN </label>
                    <div class="col-xs-7">
                        <input  type="text"
                                name="dn"
                                class="form-control SB-width"
                                ng-model="customizedOffer.offerTopDetails.DN.dft"
                                  >
                    </div>
     </div>
    <div class="form-group" ng-class="{ 'has-error' : configurazioneOffertaForm.routingNumber.$error.required && !configurazioneOffertaForm.routingNumber.$pristine }">
           <label class="col-xs-5 control-label">Routing Number</label>
           <div class="col-xs-7">
               <input  type="text"
                       name="routingNumber"
                       class="form-control SB-width"
                       ng-model="data.step4.routingNumber"
                       >
                       <div role="alert">
                    <span ng-if="configurazioneOffertaForm.routingNumber.$error.required && !configurazioneOffertaForm.routingNumber.$pristine" class="help-block help-width">Compila questo campo</span>
            </div>
           </div>
     </div>
  <div class="form-group">
        <label class="col-xs-5 control-label">Capostipite</label>
        <div class="col-xs-7">
            <input type="text"
                   class="form-control SB-width"
                   name="capostipite"
                   ng-model="customizedOffer.offerTopDetails.CAPOSTIPITE.dft"
                  ng-maxlength="12"
            >
        </div>
    </div>   
    
   

</div>

<div class="col-xs-6 paddR0 form-horizontal">
	<div
		 class="form-group"   
		 ng-class="{ 'has-error' : configurazioneOffertaForm.checkboxFonia.$invalid && !configurazioneOffertaForm.checkboxFonia.$pristine }"
		 >
        <label class="col-xs-5 control-label">Destinazione Uso FONIA <sup ng-if="!data.step4.destinazione_uso_dati_check">*</sup></label>
        <div class="col-xs-7">
            <input type="checkbox"
                   name="checkboxFonia"
                   ng-model="data.step4.destinazione_uso_fonia_check"
                   ng-change="cancellaDestinazioneDUso('fonia')"
                   ng-required="!data.step4.destinazione_uso_dati_check"
            >
            <div role="alert">
                    <span ng-if="configurazioneOffertaForm.checkboxFonia.$invalid && !configurazioneOffertaForm.checkboxFonia.$pristine" class="help-block help-width">Compila questo campo</span>
            </div>
        </div>
    </div>
    <div class="form-group"
         ng-class="{ 'has-error' : configurazioneOffertaForm.Sec.$invalid && !configurazioneOffertaForm.Sec.$pristine }"
         ng-if="data.step4.destinazione_uso_fonia_check"
    >
        <label class="col-xs-5 control-label"></label>
        <div class="col-xs-7">
            <div class="selectParent">
                <select
                        class="selectmenu SB-width form-control"
                        name="Sec"
                        ng-model="customizedOffer.offerTopDetails.DESTINAZIONEUSOFONIA.dft"
                        ng-required="data.step4.destinazione_uso_fonia_check"
                >
                   <option ng-repeat="item in topDetails.DESTINAZIONEUSOFONIA['dft'].split(';')" value="{{ item }}">{{item}}</option>
                </select>
                <div role="alert">
                    <span ng-if="configurazioneOffertaForm.Sec.$invalid && !configurazioneOffertaForm.Sec.$pristine" class="help-block help-width">Compila questo campo</span>
                </div>

            </div>

        </div>
    </div>
    <div class="form-group"
         ng-class="{ 'has-error' : configurazioneOffertaForm.checkboxDati.$invalid && !configurazioneOffertaForm.checkboxDati.$pristine }"
    >
        <label class="col-xs-5 control-label">Destinazione Uso DATI <sup ng-if="!data.step4.destinazione_uso_fonia_check">*</sup></label>
        <div class="col-xs-7">
            <input type="checkbox"
                   name="checkboxDati"
                   ng-model="data.step4.destinazione_uso_dati_check"
                   ng-change="cancellaDestinazioneDUso('dati')"
                   ng-required="!data.step4.destinazione_uso_fonia_check"
            >
            <div role="alert">
                    <span ng-if="configurazioneOffertaForm.checkboxDati.$invalid && !configurazioneOffertaForm.checkboxDati.$pristine" class="help-block help-width">Compila questo campo</span>
                </div>
        </div>
    </div>
	
    
    <div class="form-group"
         ng-class="{ 'has-error' : configurazioneOffertaForm.Sec.$invalid && !configurazioneOffertaForm.Sec.$pristine }"
         ng-if="data.step4.destinazione_uso_dati_check"
    >
        <label class="col-xs-5 control-label"></label>
        <div class="col-xs-7">
            <div class="selectParent">
                <select
                        class="selectmenu SB-width form-control"
                        name="Sec"
                        ng-model="customizedOffer.offerTopDetails.DESTINAZIONEUSODATI.dft"
                        ng-required="data.step4.destinazione_uso_dati_check"
                >
               		<option ng-repeat="item in topDetails.DESTINAZIONEUSODATI['dft'].split(';')"  value="{{ item }}">{{item}}</option>
                </select>
                <div role="alert">
                    <span ng-if="configurazioneOffertaForm.Sec.$invalid && !configurazioneOffertaForm.Sec.$pristine" class="help-block help-width">Compila questo campo</span>
                </div>
            </div>
        </div>
    </div>
     
    
 <div class="form-group" 
	  ng-show="data.step4.destinazione_uso_dati_check && (data.step3.offerta.idOfferta != '27' && data.step3.offerta.idOfferta != '28' && data.step3.offerta.idOfferta != '29' )"
	  ng-class="{ 'has-error' : configurazioneOffertaForm.bit_rate.$invalid && !configurazioneOffertaForm.bit_rate.$pristine }" >
         <label class="col-xs-5 control-label">Bit rate <sup>*</sup></label>
         <div class="col-xs-7">
             <input  type="text"
                     name="bit_rate"
                     class="form-control SB-width"
                     ng-model="customizedOffer.offerTopDetails.BITRATE.dft"
                     ng-maxlength="4"
                     ng-required="data.step4.destinazione_uso_dati_check && (data.step3.offerta.idOfferta != '27' && data.step3.offerta.idOfferta != '28' && data.step3.offerta.idOfferta != '29' )"
               >
             <div role="alert">
                    <span ng-if="configurazioneOffertaForm.bit_rate.$invalid && !configurazioneOffertaForm.bit_rate.$pristine" class="help-block help-width">Compila questo campo</span>
                </div>
         </div>
   </div> 
    
</div>
 

<div class="col-xs-12 madatory-field paddL0">
    <i>*Campo obbligatorio</i>
</div>
