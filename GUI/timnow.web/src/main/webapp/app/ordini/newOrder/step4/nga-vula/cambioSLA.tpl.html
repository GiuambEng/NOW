<div class="col-xs-12 paddLR0" >
 	<div class="panel-body">
          <div class="row">
	          <div class="col-xs-6 form-horizontal">
	                 <div class="form-group"
                             ng-class="{ 'has-error' : configurazioneOffertaForm.catalogo.sla_assurance.$invalid && !configurazioneOffertaForm.catalogo.sla_assurance.$pristine, 'var-mod' :  customizedOffer.offerTopDetails.SLAASSURANCE.dft && (customizedOffer.offerTopDetails.SLAASSURANCE.dft != DettaglioAsset.offerTopDetails.SLAASSURANCE.dft) }">
                            <label class="col-xs-5 control-label">Sla Assurance<sup>*</sup></label>
                            <div class="col-xs-7">
                                <select
                                        class="selectmenu SB-width form-control"
                                        name="sla_assurance"
                                        ng-model="customizedOffer.offerTopDetails.SLAASSURANCE.dft"
                                        ng-options="item for item in topDetails.SLAASSURANCE['dft'].split(';')"
                                        ng-change="ControlSLAChange()"
                                        required
                                >
                                </select>
                                <div role="alert">
                                    <span ng-show="configurazioneOffertaForm.catalogo.sla_assurance.$invalid && !configurazioneOffertaForm.catalogo.sla_assurance.$pristine" class="help-block help-width">Compila questo campo</span>
                                <span ng-show="customizedOffer.offerTopDetails.SLAASSURANCE.dft && (DettaglioAsset.offerTopDetails.SLAASSURANCE.dft != customizedOffer.offerTopDetails.SLAASSURANCE.dft)" class="help-block help-width">Valore da Asset: "{{ DettaglioAsset.offerTopDetails.SLAASSURANCE.dft }}"</span>
                                </div>
                            </div>
                        </div>
	           </div>
          </div>
 	</div>               
</div>
