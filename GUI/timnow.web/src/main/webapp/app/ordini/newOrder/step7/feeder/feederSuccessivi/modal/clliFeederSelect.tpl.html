<!-- RU_1205 -->
<div class="modal-content code-block">
	<div class="modal-header">
		<button type="button" class="close" data-dismiss="modal" aria-label="Close" ng-click="chiudi()"><span aria-hidden="true"><img src="assets/css/i/close.png" alt="close"></span></button>
		<h4>Seleziona Feeder Successivi </h4>
	</div>
	<multi-select-table
		ng-if="feeders.length > 0"
		dati="feeders"  
		custom-header="headerTabellaCLLIFeederSuccessivi"
		show-spinner="datiLoaded"
		selected-dati="dataComponent">
	</multi-select-table>
	<section ng-if="feeders.length <= 0">
		<table class="table table-hover">
			<tbody>
				<tr>
					<td class="no_dati" >Non ci sono elementi</td>
				</tr>
			</tbody>
		</table>
	</section>
	<div class="modal-footer" ng-if="feeders && feeders.length > 0">
 		<button class="button-list" type="button" ng-click="annulla()">Annulla</button>
       	<button class="button-list" type="button" ng-click="conferma()">Conferma selezione</button>
    </div>
</div>
