<!-- RU_1462 -->
<div ng-controller="fiberstreamAttivazioneStep7">
	<ng-form class="form-container" name="dettaglioForm">
	<section class="form-process">
		<div class="row">
			<div class="col-xs-6 form-horizontal paddL0">
				<div class="form-group"
					ng-class="{ 'has-error' : (dettaglioOrdineForm.data_prevista_attivazione.$invalid  && dettaglioOrdineForm.$submitted) }">
					<label class="col-xs-5 control-label">Data Prevista
						Attivazione</label>
					<div class="col-xs-7">
						<input type="text" name="data_prevista_attivazione"
							class="form-control SB-width selectDate" ng-click="openDP()"
							uib-datepicker-popup="{{format}}"
							ng-model="data.step7.dataPrevistaAttivazione" required
							is-open="popup_dp.opened" datepicker-options="dateOptions"
							close-text="Chiudi" alt-input-formats="altInputFormats">
					</div>
					<div role="alert">
						<span
							ng-if="dettaglioOrdineForm.dac.$error.required && dettaglioOrdineForm.$submitted"
							class="help-block help-width">Compila questo campo</span>
					</div>
				</div>
			</div>
		</div>

		<div class="col-xs-12 paddLR0">
			<uib-accordion class="accordion-bs" close-others="false">
			<uib-accordion-group heading="Servizi Aggiuntivi"
				is-open="subFormView[0]"
				template-url="accordion-group-template.html">
			<div
				ng-include="'app/ordini/newOrder/step7/sezioni/sezioneServiziAggiuntivi.tpl.html'"></div>
			<section class="form-button"
				ng-if="data.step7.datiServiziAggiuntivi.length < maxLengthServiziAggiuntivi">
				<button ng-click="addServizioAggiuntivo($event)" title="Aggiungi"
					alt="Aggiungi" name="aggiungiVCButton" class="close addItem">
					<span class="glyphicon glyphicon-plus"></span> <label>Aggiungi
						Servizio</label>
				</button>
			</section>
			</uib-accordion-group> </uib-accordion>
		</div>
	</section>
	<div class="col-xs-12 madatory-field paddL0">
		<i>*Campo obbligatorio</i>
	</div>
	<section class="form-button">
		<button class="btn btn-disabled" type="button"
			ng-click="confermaAnnulla()">Annulla</button>
		<button class="btn btn-disabled" type="button"
			ng-click="goTo('root.ordini.new.step6')">Indietro</button>
		<button
			ng-if="isAuthorized('Ordini','Ordini in Bozza') && !bozza.nomeBozza"
			class="btn blue-btn" type="button" ng-click="salvaBozza()">Salva
			in Bozza</button>
		<button
			ng-if="isAuthorized('Ordini','Ordini in Bozza') && bozza.nomeBozza"
			class="btn blue-btn" type="button" ng-click="salvaBozza('aggiorna')">Aggiorna
			Bozza</button>
		<button class="btn blue-btn" type="button"
			ng-disabled="!dettaglioForm.$valid"
			ng-click="submitFormFiberstream($event)">Avanti</button>
	</section>
	</ng-form>
</div>
