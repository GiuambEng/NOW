<!-- RU_1180 -->
<div class="row">
	<div class="col-xs-12 form-horizontal paddL0">				
		<div class="form-group"
			ng-class="{ 'has-error' : dettaglioForm.macroArea.$invalid && !dettaglioForm.macroArea.$pristine }">
			<label class="col-xs-3 control-label">MacroArea<sup>*</sup>
				<span ng-if="loadingMacroArea" us-spinner="{radius:5, width:1, length: 5}"></span>
			</label>
			<div class="col-xs-7 selected-item">
				<select class="selectmenu SB-width form-control"
					name="macroArea" ng-model="data.step7.datiOfferteMulticast.macroArea" required>
					<option value=""></option>
					<option ng-repeat="item in arrayMacroArea" value="{{item}}">{{item}}</option>
				</select>
				<div role="alert">
					<span
						ng-if="dettaglioForm.macroArea.$error.required && !dettaglioForm.macroArea.$pristine"
						class="help-block help-width">Seleziona questo campo</span>
				</div>
			</div>
		</div>		
		
		<div class="form-group"
			ng-class="{ 'has-error' : dettaglioForm.primoFeeder.$invalid && !dettaglioForm.primoFeeder.$pristine }">
			<label class="col-xs-3 control-label">Primo Feeder<sup>*</sup>
				<span ng-if="loadingPrimoFeeder" us-spinner="{radius:5, width:1, length: 5}"></span>
			</label>
            <div class="col-xs-7">
                 <input type="text" class="form-control SB-width" disabled
                        name="primoFeeder"
                        ng-model="data.step7.datiOfferteMulticast.primoFeeder"
                        required>
                  <div role="alert">
                  	<span ng-if="dettaglioForm.primoFeeder.$invalid && dettaglioForm.$submitted" class="help-block help-width">Compila questo campo</span>
                  </div>
           </div>
		</div>
		
		<div class="form-group"
			ng-class="{ 'has-error' : dettaglioForm.clliFeeder.$invalid && !dettaglioForm.clliFeeder.$pristine }">
			<label class="col-xs-3 control-label">CLLI Feeder Successivi<sup>*</sup>
				<span ng-if="loadingClliFeeder" us-spinner="{radius:5, width:1, length: 5}"></span>
			</label>
			<!-- RU_1199 -->
			<div class="col-xs-7 selected-item">
				<!-- RU_1205 -->			
				 <input type="text" name="clliFeederSuccessivi" hidden ng-model="data.step7.datiOfferteMulticast.clliFeederSuccessivi" required>	
                 <textarea
                            cols="30"
                            rows="5"
                            class="form-control SB-width"
                            disabled>{{data.step7.datiOfferteMulticast.clliFeederSuccessivi | joinAttrs:'clliFeederSuccessivo'}}</textarea>
				<a ng-href="#" class="openpopup" ng-click="configureClliFeederSuccessivi($event)" ng-if="data.step7.datiOfferteMulticast.macroArea">
                          <img src="assets/css/i/form_arrow.png" alt="form" style="vertical-align: unset">
                      </a>
                      <div role="alert">
					<span
						ng-if="dettaglioForm.clliFeeder.$error.required && !dettaglioForm.clliFeeder.$pristine"
						class="help-block help-width">Seleziona questo campo</span>
				</div>
			</div>	
		</div>
		
		<!-- RU_1414 -->
		<div class="form-group"
			ng-class="{ 'has-error' : dettaglioForm.bandaFeeder.$invalid && !dettaglioForm.bandaFeeder.$pristine }">
			<label class="col-xs-3 control-label">Banda Feeder<sup>*</sup>
				<span ng-if="loadingBandaFeeder" us-spinner="{radius:5, width:1, length: 5}"></span>
			</label>
            <div class="col-xs-7">
                 <input type="text" class="form-control SB-width" disabled
                        name="bandaFeeder"
                        ng-model="data.step7.datiOfferteMulticast.bandaFeeder"
                        required>
                  <div role="alert">
                  	<span ng-if="dettaglioForm.bandaFeeder.$invalid && dettaglioForm.$submitted" class="help-block help-width">Compila questo campo</span>
                  </div>
           </div>
		</div>	
	</div>
</div>
