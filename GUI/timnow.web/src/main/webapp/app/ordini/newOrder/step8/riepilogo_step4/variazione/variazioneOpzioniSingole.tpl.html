<div class="panel-body" >
	<div class="row">
		<div class="col-xs-6 form-horizontal paddL0">
			<div class="form-group" ng-if="data.step4.prestazione">
				<label class="col-xs-6 control-label">Prestazione</label>
				<div class="col-xs-6 selected-item">
					<span>{{ data.step4.prestazione }}</span>
				</div>
			</div>
			<div class="form-group" ng-if="data.step4.codiceTrasloco">
				<label class="col-xs-6 control-label">Codice Trasloco</label>
				<div class="col-xs-6 selected-item">
					<span>{{ data.step4.codiceTrasloco }}</span>
				</div>
			</div>
			 <div class="form-group">
				<label class="col-xs-5 control-label">Flag Mantenimento
					Prodotti</label>
				<div class="col-xs-7 selected-item">
					<span
						ng-if="!customizedOffer.offerTopDetails.FLAGMANTENIMENTOPRODOTTI.dft"
						class="glyphicon glyphicon-unchecked" aria-hidden="true"
						style="color: #004388"></span> <span
						ng-if="customizedOffer.offerTopDetails.FLAGMANTENIMENTOPRODOTTI.dft"
						class="glyphicon glyphicon-check" aria-hidden="false"
						style="color: #004388"></span>
				</div>
			</div>
			<div class="form-group" ng-if="data.step3.opzioneVariazione == 'Cambio Tipologia Accesso'">
				<label class="col-xs-6 control-label">Tipologia Accesso</label>
				<div class="col-xs-6 selected-item">
					<span>{{ data.step4.tipologiaAccesso }}</span>
				</div>
			</div>
			 
			 
		</div>
	</div>
</div>
