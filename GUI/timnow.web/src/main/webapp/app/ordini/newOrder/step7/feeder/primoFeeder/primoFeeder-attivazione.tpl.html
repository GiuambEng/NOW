<!-- RU_1180 -->
<div class="row">
	<div class="col-xs-12 form-horizontal paddL0">				
		<div class="form-group"
			ng-class="{ 'has-error' : dettaglioForm.macroArea.$invalid && !dettaglioForm.macroArea.$pristine }">
			<label class="col-xs-3 control-label">MacroArea<sup>*</sup>
				<span ng-if="loadingMacroArea" us-spinner="{radius:5, width:1, length: 5}"></span>
			</label>
			<div class="col-xs-7 selected-item">
				<select class="selectmenu SB-width form-control"
					name="macroArea" ng-model="data.step7.datiOfferteMulticast.macroArea" required>
					<option value=""></option>
					<option ng-repeat="item in arrayMacroArea" value="{{item}}">{{item}}</option>
				</select>
				<div role="alert">
					<span
						ng-if="dettaglioForm.macroArea.$error.required && !dettaglioForm.macroArea.$pristine"
						class="help-block help-width">Seleziona questo campo</span>
				</div>
			</div>
		</div>		
		
		<div class="form-group"
			ng-class="{ 'has-error' : dettaglioForm.clliFeeder.$invalid && !dettaglioForm.clliFeeder.$pristine }">
			<label class="col-xs-3 control-label">CLLI Feeder<sup>*</sup>
				<span ng-if="loadingClliFeeder" us-spinner="{radius:5, width:1, length: 5}"></span>
			</label>
			
			<!-- RU_1199 -->
			<div class="col-xs-7 selected-item">
				<input type="text" ng-disabled="disableAll"
                             class="form-control SB-width"
                             ng-model="data.step7.datiOfferteMulticast.clliFeeder"
                             name="clliFeeder"
                             required
                             disabled>
				<a ng-href="#" class="openpopup" ng-click="configureClliFeeder($event)">
                          <img src="assets/css/i/form_arrow.png" alt="form">
                      </a>
                      <div role="alert">
					<span
						ng-if="dettaglioForm.clliFeeder.$error.required && !dettaglioForm.clliFeeder.$pristine"
						class="help-block help-width">Seleziona questo campo</span>
				</div>
			</div>
		</div>
		
		<div class="form-group"
			ng-class="{ 'has-error' : dettaglioForm.codiceTdKit.$invalid && !dettaglioForm.codiceTdKit.$pristine }">
			<label class="col-xs-3 control-label">Codice TD KIT<sup>*</sup>
				<span ng-if="loadingCodiceTDKit" us-spinner="{radius:5, width:1, length: 5}"></span>
			</label>
			<div class="col-xs-7 selected-item">
				<input type="text" ng-disabled="disableAll"
                             class="form-control SB-width"
                             ng-model="data.step7.datiOfferteMulticast.codiceTdKit"
                             name="codiceTdKit"
					   required
                             disabled>
				<a ng-href="#" class="openpopup" ng-click="configureCodiceTDKit($event)">
                          <img src="assets/css/i/form_arrow.png" alt="form">
                      </a>
                      <div role="alert">
					<span
						ng-if="dettaglioForm.codiceTdKit.$error.required && !dettaglioForm.codiceTdKit.$pristine"
						class="help-block help-width">Seleziona questo campo</span>
				</div>
			</div>
		</div>			

		<div class="form-group"
			ng-class="{ 'has-error' : (dettaglioForm.idVlanOlo.$invalid && (!dettaglioForm.idVlanOlo.$pristine || dettaglioForm.idVlanOlo.$dirty)) ||  dettaglioForm.idVlanOlo.$error.pattern }">
			<label class="col-xs-3 control-label">IDVLANOLO<sup>*</sup>
				<span ng-if="loadingIdVlanOlo" us-spinner="{radius:5, width:1, length: 5}"></span>
			</label>
            <div class="col-xs-7">
                 <input type="text" class="form-control SB-width"
                        name="idVlanOlo"
                        ng-model="data.step7.datiOfferteMulticast.idVlanOlo"
                        ng-pattern="rangeIdentificativoVlan"
                        required>
                  <div role="alert">
                  	<span ng-if="dettaglioForm.idVlanOlo.$error.required && (!dettaglioForm.idVlanOlo.$pristine || dettaglioForm.idVlanOlo.$dirty)" class="help-block help-width">Compila questo campo</span>
                  	<span ng-if="dettaglioForm.idVlanOlo.$error.pattern" class="help-block help-width">Inserire un valore compreso tra 2 e 4000</span>
                  </div>
           </div>
		</div>
		
		<div class="form-group"
			ng-class="{ 'has-error' : (dettaglioForm.bandaFeeder.$error.required && !dettaglioForm.bandaFeeder.$pristine) || (erroreBandaFeeder !== '') }">
			<label class="col-xs-3 control-label">Banda Feeder<sup>*</sup>
				<span ng-if="loadingBandaFeeder" us-spinner="{radius:5, width:1, length: 5}"></span>
			</label>
			<div class="col-xs-7 selected-item">
				<select class="selectmenu SB-width form-control" 
					name="bandaFeeder"	ng-model="data.step7.datiOfferteMulticast.bandaFeeder"
					required>
					<option value=""></option>
					<option ng-repeat="item in arrayBandaFeeder" value="{{item}}">{{item}}</option>
				</select>
				<div role="alert">
					<span
						ng-if="dettaglioForm.bandaFeeder.$error.required && !dettaglioForm.bandaFeeder.$pristine"
						class="help-block help-width">Seleziona questo campo</span>
					<span
						ng-if="erroreBandaFeeder !== ''" class="help-block help-width">{{erroreBandaFeeder}}</span>
				</div>
			</div>
		</div>
		
		<div class="form-group"
			ng-class="{ 'has-error' : (dettaglioForm.asNumber.$invalid && !dettaglioForm.asNumber.$pristine) || (erroreAsNumber !== '') }">
			<label class="col-xs-3 control-label">AS Number<sup>*</sup>
				<span ng-if="loadingAsNumber" us-spinner="{radius:5, width:1, length: 5}"></span>
			</label>
			<div class="col-xs-7 selected-item">
				<select class="selectmenu SB-width form-control"
					name="asNumber"	ng-model="data.step7.datiOfferteMulticast.asNumber"
					required>
					<option value=""></option>
					<option ng-repeat="item in arrayAsNumber" value="{{item}}">{{item}}</option>
				</select>
				<div role="alert">
					<span
						ng-if="dettaglioForm.asNumber.$error.required && !dettaglioForm.asNumber.$pristine"
						class="help-block help-width">Seleziona questo campo</span>
					<span
						ng-if="erroreAsNumber != ''" class="help-block help-width">{{erroreAsNumber}}</span>
				</div>
			</div>
		</div>
		
		<div class="form-group"
			ng-class="{ 'has-error' : (dettaglioForm.ipSessione.$invalid && !dettaglioForm.ipSessione.$pristine) || (erroreIpSessione !== '') }">
			<label class="col-xs-3 control-label">IP SESSIONE eBGP<sup>*</sup>
				<span ng-if="loadingIpSessione" us-spinner="{radius:5, width:1, length: 5}"></span>
			</label>
			<div class="col-xs-7 selected-item">
				<select class="selectmenu SB-width form-control"
					name="ipSessione"	ng-model="data.step7.datiOfferteMulticast.ipSessione"
					required>
					<option value=""></option>
					<option ng-repeat="item in arrayIpSessione" value="{{item}}">{{item}}</option>
				</select>
				<div role="alert">
					<span
						ng-if="dettaglioForm.ipSessione.$error.required && !dettaglioForm.ipSessione.$pristine"
						class="help-block help-width">Seleziona questo campo</span>
					<span
						ng-if="erroreIpSessione != ''" class="help-block help-width">{{erroreIpSessione}}</span>
				</div>
			</div>
		</div>
	</div>
</div>
