<div class="panel-body">
	<div class="row">
		<div class="col-xs-6 form-horizontal paddL0">
			<div class="form-group" ng-if="data.step7.dad">
				<label class="col-xs-6 control-label">DAD</label>
				<div class="col-xs-6 selected-item">
					<span>{{ data.step7.dad | date:'dd/MM/yyyy' }}</span>
				</div>
			</div>
			<div class="form-group">
				<label class="col-xs-6 control-label">Fascia oraria</label>
				<div class="col-xs-6 selected-item">
					<span>{{time_slot[data.step7.fascia_oraria]}}</span>
				</div>
			</div>
		</div>
		<!-- RU_1164 -->
		<div class="col-xs-6 form-horizontal paddL0" ng-if="[MAP_OFFERTE.SEMI_BTS_H.id, MAP_OFFERTE.SEMI_VULA_H.id, MAP_OFFERTE.SEMI_EASYIP_H.id].indexOf(data.step3.offerta.idOfferta)>=0">
			<div class="form-group">
				<label class="col-xs-6 control-label" ng-if="[MAP_OFFERTE.SEMI_BTS_H.id].indexOf(data.step3.offerta.idOfferta)>=0">Semi Bitstream NGA</label>
				<label class="col-xs-6 control-label" ng-if="[MAP_OFFERTE.SEMI_VULA_H.id].indexOf(data.step3.offerta.idOfferta)>=0">Semi VULA</label>
				<!-- SM_10077 -->
				<label class="col-xs-6 control-label" ng-if="[MAP_OFFERTE.SEMI_EASYIP_H.id].indexOf(data.step3.offerta.idOfferta)>=0">Semi EASYIP NGA</label>
				<div class="col-xs-6 selected-item">
					<span>{{(data.step7.flagOffertaSemi == 'Y' ? 'SI' : '')}}</span>
				</div>
			</div>
		</div>
			
		<div class="row" ng-if="RU_1164 && [MAP_OFFERTE.SEMI_BTS_H.id, MAP_OFFERTE.SEMI_VULA_H.id, ].indexOf(data.step3.offerta.idOfferta)>=0">
			<div class="col-xs-6 col-sm-6 col-md-6 col-lg-6 form-horizontal paddL0">
				<div class="form-group" ng-class="{ 'has-error' : (dettaglioOrdineForm.idReteSecondariaOao.$invalid && dettaglioOrdineForm.$submitted) }">
					<label class="col-xs-5">Id Rete Secondaria OAO</label>
					<div class="col-xs-7">
						<input type="text" class="form-control SB-width" ng-maxlength="19" maxlength="19"
		                        name="idReteSecondariaOao" ng-model="data.step7.idReteSecondariaOao"  ng-pattern="alphanumeric">
		                <div role="alert">        
                           	<span ng-if="dettaglioOrdineForm.idReteSecondariaOao.$error.maxlength" class="help-block help-width">Inserire al massimo 19 caratteri</span>
                           	<span ng-if="dettaglioOrdineForm.idReteSecondariaOao.$error.pattern" class="help-block help-width">Inserire solo caratteri alfanumerici</span>
                           </div>
					</div>
				</div>
			</div>
		</div>
	</div>
	<div class="row" ng-if="data.step7.refOaoProgettiSpeciali">
	<div class="col-xs-6 form-horizontal paddL0">
	<div class="form-group">
	<label class="col-xs-6 control-label">Referente OAO Progetti Speciali</label>
						<div class="col-xs-6 selected-item">
							<span >{{data.step7.refOaoProgettiSpeciali}}</span>
						</div>
						</div>
	</div>
	</div>
</div>
