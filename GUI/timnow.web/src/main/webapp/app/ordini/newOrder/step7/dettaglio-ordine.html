<div class="content-section" ng-controller="newOrderStep7">
	<section class="form-heading">
		<h1>Nuovo Ordine - <span class="capitalize" >{{ data.step1.causale_ordine }}</span></h1>
	</section>
	<div class="process-steps-wrapper">
		<div class="process-steps-label">
            <span class="steps">Intestazione<br>ordine</span>
            <span class="steps">Dati<br>ordine</span>
            <span class="steps" ng-if="data.step1.causale_ordine != 'variazione'">Scelta<br>dell'offerta</span>
            <span class="steps" ng-if="data.step1.causale_ordine == 'variazione'">Scelta<br>della variazione</span>
            <span class="steps" ng-if="data.step1.causale_ordine != 'variazione' ">Configurazione<br>offerta</span>
            <span class="steps" ng-if="data.step1.causale_ordine == 'variazione'">Configurazione<br>variazione</span>
            <span class="steps" ng-if="data.step1.causale_ordine != 'variazione' || eightStepToVar">Dati<br>riferimenti</span>
            <span class="steps" ng-if="data.step1.causale_ordine != 'variazione' || eightStepToVar">Dati<br>cliente finale</span>
            <!-- RU_915 -->
            <span class="steps" ng-if="[MAP_OFFERTE.CPS.name].indexOf(data.step3.offerta.nomeOffertaCatalogo)>=0">Dati<br>aggiuntivi cliente</span>
            <span class="steps" ng-if="[MAP_OFFERTE.CPS.name].indexOf(data.step3.offerta.nomeOffertaCatalogo)==-1">Dettaglio<br>ordine</span>
            <span class="steps">Riepilogo<br>ordine</span>
        </div>
		<div class="process-steps step-8">
			<span><a ng-click="goTo('root.ordini.new.step1')"><em
					class="processed"></em></a></span><span class="line blue">&nbsp;</span> <span><a
				ng-if="formData.stepReached >= 2"
				ng-click="goTo('root.ordini.new.step2')"><em class="processed"></em></a><em
				ng-if="formData.stepReached < 2" class="inactive">2</em></span><span
				class="line blue">&nbsp;</span> <span><a
				ng-if="formData.stepReached >= 3"
				ng-click="goTo('root.ordini.new.step3')"><em class="processed"></em></a><em
				ng-if="formData.stepReached < 3" class="inactive">3</em></span><span
				class="line blue">&nbsp;</span> <span><a
				ng-if="formData.stepReached >= 4"
				ng-click="goTo('root.ordini.new.attivazione-configurazione')"><em
					class="processed"></em></a><em ng-if="formData.stepReached < 4"
				class="inactive">4</em></span>
				
				<span class="line blue">&nbsp;</span> 
				<span ng-if="data.step1.causale_ordine != 'variazione' || eightStepToVar"><a
				ng-if="formData.stepReached >= 5"
				ng-click="goTo('root.ordini.new.step5')"><em class="processed"></em></a><em
				ng-if="formData.stepReached < 5" class="inactive">5</em></span>
				
				<span ng-if="(data.step1.causale_ordine == 'variazione') && !eightStepToVar"><em class="active">5</em></span> 
				
				<span class="line blue" ng-if="data.step1.causale_ordine != 'variazione' || eightStepToVar">&nbsp;</span> 
				<span ng-if="data.step1.causale_ordine != 'variazione' || eightStepToVar"><a
				ng-if="formData.stepReached >= 6"
				ng-click="goTo('root.ordini.new.step6')"><em class="processed"></em></a><em
				ng-if="formData.stepReached < 6" class="inactive">6</em></span>
				
				<span ng-if="data.step1.causale_ordine != 'variazione' || eightStepToVar" class="line blue">&nbsp;</span> 
				<span ng-if="data.step1.causale_ordine != 'variazione' || eightStepToVar"><em class="active">7</em></span>
				
				<span class="line"
				ng-class="{ 'blue': formData.stepReached >= 8, 'grey': formData.stepReached < 8 }">&nbsp;</span>
			<span ng-if="data.step1.causale_ordine != 'variazione' || eightStepToVar"><a ng-if="formData.stepReached >= 8"
				ng-click="goTo('root.ordini.new.step8')"><em class="processed"></em></a><em
				ng-if="formData.stepReached < 8" class="inactive">8</em></span>
			<span ng-if="(data.step1.causale_ordine == 'variazione') && !eightStepToVar"><a ng-if="formData.stepReached >= 8"
				ng-click="goTo('root.ordini.new.step8')"><em class="processed"></em></a><em
				ng-if="formData.stepReached < 8" class="inactive">6</em></span>



		</div>
	</div>
	<form class="form-container" name="dettaglioOrdineForm"
		ng-submit="dettaglioOrdineForm.$valid && submit_7()" novalidate>
		
		<div>
			<div ng-if="[MAP_OFFERTE.WLR_LA.name, MAP_OFFERTE.WLR_LNA.name].indexOf(data.step3.offerta.nomeOffertaCatalogo)>=0"
			                ng-include="'app/ordini/newOrder/step7/wlr/wlr-'+data.step1.causale_ordine+'.tpl.html'">
			</div>	
			
			<div ng-if="[MAP_OFFERTE.SHA_CM.name,MAP_OFFERTE.SHA_SM.name].indexOf(data.step3.offerta.nomeOffertaCatalogo)>=0"
			                ng-include="'app/ordini/newOrder/step7/sha/sha-'+data.step1.causale_ordine+'.tpl.html'">
			</div>	
			
			<div ng-if="[MAP_OFFERTE.VULL_LNA.name,MAP_OFFERTE.VULL_LA.name, MAP_OFFERTE.ULL_LNA.name,MAP_OFFERTE.ULL_LA.name,MAP_OFFERTE.ULL_LANP.name, MAP_OFFERTE.ULLD_LNA.name,MAP_OFFERTE.ULLD_LA.name,MAP_OFFERTE.ULLD_LANP.name, MAP_OFFERTE.SLU_LNA.name,MAP_OFFERTE.SLU_LA.name,MAP_OFFERTE.SLU_LANP.name].indexOf(data.step3.offerta.nomeOffertaCatalogo)>=0"
			                ng-include="'app/ordini/newOrder/step7/regolatorio-vull/regolatorio-vull-'+data.step1.causale_ordine+'.tpl.html'">
			</div>		
			<!-- RU_716 -->
			<!-- RU_1164 -->
			<div ng-if="[MAP_OFFERTE.FWA.name, MAP_OFFERTE.VULA_CAB.name, MAP_OFFERTE.VULA_H.name,MAP_OFFERTE.NGA_CAB.name, MAP_OFFERTE.NGA_H.name,MAP_OFFERTE.EASY_BF.name, MAP_OFFERTE.EASY_BL.name,MAP_OFFERTE.EASY_SF.name, MAP_OFFERTE.EASY_SL.name, MAP_OFFERTE.GBE_AF.name, MAP_OFFERTE.GBE_SF.name, MAP_OFFERTE.ATM_AF.name, MAP_OFFERTE.ATM_AH.name, MAP_OFFERTE.ATM_AL.name, MAP_OFFERTE.ATM_SF.name, MAP_OFFERTE.ATM_SH.name, MAP_OFFERTE.EASY_H.name, MAP_OFFERTE.EASY_CAB.name, MAP_OFFERTE.SEMI_VULA_H.name, MAP_OFFERTE.SEMI_BTS_H.name, MAP_OFFERTE.SEMI_EASYIP_H.name, MAP_OFFERTE.FULLGPONPLUS.name, MAP_OFFERTE.FULLGPONPLUSNGA.name].indexOf(data.step3.offerta.nomeOffertaCatalogo)>=0"
			                ng-include="'app/ordini/newOrder/step7/atm-gbe-easyip-nga/atm-gbe-easyip-nga-'+data.step1.causale_ordine+'.tpl.html'">
			</div>	
			<!-- RU_915 -->
			<div ng-if="[MAP_OFFERTE.CPS.name].indexOf(data.step3.offerta.nomeOffertaCatalogo)>=0"
			                ng-include="'app/ordini/newOrder/step7/cps/cps-'+data.step1.causale_ordine+'.tpl.html'">
			</div>		
			
			<!-- RU_1058 -->
			<div ng-if="[MAP_OFFERTE.VLAN_GBE.name, MAP_OFFERTE.VLAN_NGA.name, MAP_OFFERTE.VLAN_VULA.name].indexOf(data.step3.offerta.nomeOffertaCatalogo) >= 0"
			                ng-include="'app/ordini/newOrder/step7/vlan/vlan-'+data.step1.causale_ordine+'.tpl.html'">
			</div>
				
			<!-- RU_1058 -->
			<div ng-if="[MAP_OFFERTE.VP.name].indexOf(data.step3.offerta.nomeOffertaCatalogo)>=0"
			                ng-include="'app/ordini/newOrder/step7/vp/vp-'+data.step1.causale_ordine+'.tpl.html'">
			</div>
			
			<!-- RU_1150 + RU_1581 -->
			<div ng-if="[MAP_OFFERTE.GPON_SEMI.name, MAP_OFFERTE.GPON_FULL.name, MAP_OFFERTE.GPON_SEMI_PNRR.name, MAP_OFFERTE.GPON_FULL_PNRR.name].indexOf(data.step3.offerta.nomeOffertaCatalogo) >= 0"
                ng-include="'app/ordini/newOrder/step7/ubb/ubb-'+data.step1.causale_ordine+'.tpl.html'">
			</div>
			
			<!-- RU_1180 -->
			<div ng-if="[MAP_OFFERTE.FEEDER.name].indexOf(data.step3.offerta.nomeOffertaCatalogo) >= 0"
                ng-include="'app/ordini/newOrder/step7/feeder/feeder-'+data.step1.causale_ordine+'.tpl.html'">
			</div>
			<!-- RU_1452 -->
			<div ng-if="[MAP_OFFERTE.FIBERSTREAM.name].indexOf(data.step3.offerta.nomeOffertaCatalogo) >= 0"
                ng-include="'app/ordini/newOrder/step7/fiberstream/fiberstream-'+data.step1.causale_ordine+'.tpl.html'">
			</div>
			<!-- RU_1475 -->
			<div ng-if="[MAP_OFFERTE.FWAITALIA1GIGASARDEGNA.name].indexOf(data.step3.offerta.nomeOffertaCatalogo) >= 0"
                ng-include="'app/ordini/newOrder/step7/eolo/eolo-'+data.step1.causale_ordine+'.tpl.html'">
			</div>
		</div>
		<!-- RU_1058 -->
		<!-- RU_1150 -->
		<section class="form-button" 
			ng-if="[MAP_OFFERTE.VLAN_GBE.name, MAP_OFFERTE.VLAN_NGA.name, MAP_OFFERTE.VLAN_VULA.name, MAP_OFFERTE.VP.name, MAP_OFFERTE.GPON_SEMI.name, MAP_OFFERTE.GPON_FULL.name,  MAP_OFFERTE.GPON_SEMI_PNRR.name, MAP_OFFERTE.GPON_FULL_PNRR.name, MAP_OFFERTE.FEEDER.name, MAP_OFFERTE.FIBERSTREAM.name, MAP_OFFERTE.FWAITALIA1GIGASARDEGNA.name].indexOf(data.step3.offerta.nomeOffertaCatalogo) == -1">
			<button class="btn btn-disabled" type="button"
				ng-click="confermaAnnulla()">Annulla</button>
			<button class="btn btn-disabled" type="button"
				ng-click="goTo()">indietro</button>
			<button ng-if="isAuthorized('Ordini','Ordini in Bozza') && !bozza.nomeBozza" class="btn blue-btn" type="button" ng-click="salvaBozza()">Salva in Bozza</button>
			<button
				ng-if="isAuthorized('Ordini','Ordini in Bozza') && bozza.nomeBozza"
				class="btn blue-btn" type="button" ng-click="salvaBozza('aggiorna')">Aggiorna
				Bozza</button>
			<!-- SM_9677 -->	
			<span ng-show="loadStep8"><img src="assets/i/loading.gif" /></span>	
			<button ng-if="!(isIncementoDecrementoVC && isATM_SF_ATM_SH) && !isCPS" class="btn blue-btn" type="submit" ng-disabled="loadStep8"
				ng-click="calcolaTabVisualizzato();">Avanti</button>	
			<button ng-if="(isIncementoDecrementoVC && isATM_SF_ATM_SH) && !isCPS" class="btn blue-btn" type="submit"
				ng-click="validaDatiRiferimento(dettaglioOrdineForm);calcolaTabVisualizzato();">Avanti</button>
			
			<!-- RU_915 -->	
			<button ng-if="isCPS && !(isIncementoDecrementoVC && isATM_SF_ATM_SH)" class="btn blue-btn" type="submit"
				ng-click="">Avanti</button>	
		</section>
		
	</form>
</div>
