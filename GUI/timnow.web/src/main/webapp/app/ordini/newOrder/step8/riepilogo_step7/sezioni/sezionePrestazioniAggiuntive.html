<div class="row">
	<h2>Prestazioni Aggiuntive</h2>
	<div class="col-xs-6 form-horizontal paddL0">
		<div class="form-group">
			<label class="col-xs-6 control-label">Codice Servizio</label>
			<div class="col-xs-6 selected-item">				
				<span ng-if="!data.step7.datiPrestazioniAggiuntive.flagPrestazioneAggiuntiva"
						class="glyphicon glyphicon-unchecked" aria-hidden="true"
						style="color: #004388"></span> 
				<span
						ng-if="data.step7.datiPrestazioniAggiuntive.flagPrestazioneAggiuntiva"
						class="glyphicon glyphicon-check" aria-hidden="false"
						style="color: #004388"></span>
			</div>
		</div>
	</div>
	<div class="col-xs-6 form-horizontal paddL0">
		<div class="form-group">
			<label class="col-xs-6 control-label">Prestazione Aggiuntiva</label>
			<div class="col-xs-6 selected-item">
				<span>{{ data.step7.datiPrestazioniAggiuntive.prestazioneAggiuntiva }}</span>
			</div>
		</div>
	</div>
</div>
