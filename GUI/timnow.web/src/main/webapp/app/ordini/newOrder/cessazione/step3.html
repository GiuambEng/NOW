<!-------------------------        FORM HEADING SECTION       START ----------------------------- -->
<!-- RU_871 -->
<form ng-if="!nonRegolatorio" ng-submit="dettaglioOrdineCessazioneForm.$valid && submit_3()" class="form-container" name="dettaglioOrdineCessazioneForm" novalidate>
       <section class="form-process sectionHeight346">
            <div class="col-xs-6 form-horizontal paddL0">
                
    
                <div class="form-group" ng-if="visibilitaDac" ng-class="{ 'has-error' : (dettaglioOrdineCessazioneForm.dac.$invalid && !dettaglioOrdineCessazioneForm.dac.$pristine) || dacMessaggioErrore }">
                    <label class="col-xs-5 control-label">DAC<sup>*</sup></label>
                    <div class="col-xs-7">
                        <input  type="text"
                                name="dac"
                                class="form-control SB-width selectDate"
                                ng-click="openDP1()"
                                uib-datepicker-popup="{{format}}"
                                ng-model="data.step3.dac"
                                ng-change="validationDac(data.step3.dac)"
                                is-open="popup_dp1.opened"
                                datepicker-options="option"
                                ng-required="visibilitaDac"
                                close-text="Chiudi"
                                alt-input-formats="altInputFormats"
                        />
                        <span ng-if="dettaglioOrdineCessazioneForm.dac.$invalid && !dettaglioOrdineCessazioneForm.dac.$pristine" class="help-block help-width">Compila questo campo</span>
                    	<span ng-if="dacMessaggioErrore" class="help-block help-width" style="margin-top: 35px;">{{dacMessaggioErrore}}</span>
                    </div>
                </div>
                <div class="form-group" ng-if="visibilitaFlagMonitoraggio">
                    <label class="col-xs-5 control-label">Flag monitoraggio</label>
                    <div class="col-xs-7">
                        <input type="checkbox"
                               ng-model="data.step3.flag_monitoraggio">
                    </div>
                </div>
                
                
                <div ng-if="visibilitaNP" class="form-group" ng-class="{ 'has-error' : dettaglioOrdineCessazioneForm.routingNumber.$invalid && !dettaglioOrdineCessazioneForm.routingNumber.$pristine }">
                    <label class="col-xs-5 control-label">Routing Number<sup>*</sup></label>
                    <div class="col-xs-7">
                        <input type="text" name="routingNumber" class="form-control SB-width" ng-model="data.step3.routingNumber" maxlength="18" ng-minlength="1" ng-maxlength="18" required>
                        <span ng-if="dettaglioOrdineCessazioneForm.routingNumber.$invalid && !dettaglioOrdineCessazioneForm.routingNumber.$pristine" class="help-block help-width">Compila questo campo</span>
 						<span ng-if="dettaglioOrdineCessazioneForm.routingNumber.$error.maxlength" class="help-block help-width">Inserire al massimo 18 caratteri</span>
                    </div>
                </div>
                <div ng-if="visibilitaNP" class="form-group" ng-class="{ 'has-error' : dettaglioOrdineCessazioneForm.dn.$invalid && !dettaglioOrdineCessazioneForm.dn.$pristine }">
                    <label class="col-xs-5 control-label">DN</label>
                    <div class="col-xs-7">
                        <input type="text" name="dn" class="form-control SB-width" ng-model="data.step3.dn" maxlength="12" ng-minlength="1" ng-maxlength="12">
                        <span ng-if="dettaglioOrdineCessazioneForm.dn.$error.maxlength" class="help-block help-width">Inserire al massimo 12 caratteri</span>
                    </div>
                </div>
            </div>
 
            <div class="col-xs-6 form-horizontal">
				<div class="form-group" ng-if="sezioneRientro">
                    <label class="col-xs-5 control-label">Flag Rientro</label>
                    <div class="col-xs-7">
                        <input type="checkbox"
                               ng-model="data.step3.flag_rientro">
                    </div>
                </div>
                
                <div class="form-group" ng-if="data.step3.flag_rientro">
                    <label class="col-xs-5 control-label">Flag Rientro Veloce</label>
                    <div class="col-xs-7">
                        <input type="checkbox"
                               ng-model="data.step3.flagRientroVeloce">
                    </div>
                </div>
                
                <div class="form-group" ng-if="data.step3.flag_rientro" ng-class="{ 'has-error' : (dettaglioOrdineCessazioneForm.tipoRientro.$invalid && !dettaglioOrdineCessazioneForm.tipoRientro.$pristine) && data.step3.flagRientroVeloce }">
                    <label class="col-xs-5 control-label">Tipo Rientro<sup>*</sup></label>
                    <div class="col-xs-7">
                        <select class="form-control selectmenu SB-width"
								ng-model="data.step3.tipoRientro"
								name="tipoRientro"
								ng-disabled="!data.step3.flagRientroVeloce"
								ng-required="data.step3.flagRientroVeloce">
								<option value="I">Cessazione con rientro veloce per impossibilit&aacute; tecniche</option>
								<option value="R">Cessazione con rientro veloce per reclamo</option>
						</select>
                    </div>
                </div>
                
                <div class="form-group" ng-if="data.step3.flag_rientro" ng-class="{ 'has-error' : (dettaglioOrdineCessazioneForm.dad.$invalid && !dettaglioOrdineCessazioneForm.dad.$pristine) && data.step3.flag_rientro}">
                    <label class="col-xs-5 control-label">Data Ricezione Richiesta<sup ng-if="data.step3.flag_rientro">*</sup></label>
                    <div class="col-xs-7">
                        <input
                                type="text"
                                name="dad"
                                class="form-control SB-width selectDate"
                                ng-click="openDP2()"
                                uib-datepicker-popup="{{format}}"
                                ng-model="data.step3.dad"
                                is-open="popup_dp2.opened"
                                datepicker-options="option"
                                ng-required="data.step3.flag_rientro"
                                close-text="Chiudi"
                                alt-input-formats="altInputFormats"
                        />
                    </div>
                </div>
                
            </div>
        </section>
        <section class="form-button">
               <div class="col-xs-12 madatory-field paddL0 text-left">
                   <i>*Campo obbligatorio</i>
               </div>
 			<button class="btn btn-disabled" type="button" ng-click="confermaAnnulla()">Annulla</button>
		    <button class="btn btn-disabled" type="button" 
		            ng-click="goTo('root.ordini.new.cessazione.step2')">indietro
		    </button>
		    <span ng-show="loadDac"><img src="assets/i/loading.gif" /></span>
		    <span ng-show="disableButtonAvanti"><img src="assets/i/loading.gif" /></span>
		    <button class="btn blue-btn" type="submit" ng-click="valida(dettaglioOrdineCessazioneForm)" ng-disabled="disableButtonAvanti">avanti
		    </button>

        </section>
</form>
 <form ng-if="nonRegolatorio" ng-submit="submit_3()" class="form-container" name="dettaglioOrdineCessazioneForm" >
        <section class="form-process sectionHeight346">
            <div class="col-xs-12 form-horizontal paddL0">
                <div class="form-group">
                    <label class="col-xs-12 control-label">Per i servizi Dati non ci sono ulteriori campi da selezionare per la Creazione Guidata dell'Ordine di cessazione.Si pu&ograve; procedere alla Pagina di Riepilogo.</label>
                </div>
            </div>
        </section>
        <section class="form-button">
 			<button class="btn btn-disabled" type="button" ng-click="confermaAnnulla()">Annulla</button>
		    <button class="btn btn-disabled" type="button" 
		            ng-click="goTo('root.ordini.new.cessazione.step2')">indietro
		    </button>		   
		    <button class="btn blue-btn" type="submit" >avanti
		    </button>
        </section>
</form>
