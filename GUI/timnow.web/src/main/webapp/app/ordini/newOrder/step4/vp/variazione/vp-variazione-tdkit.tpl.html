<ng-form name="tdKitForm" novalidate>
	<section class="form-process">
		<div class="row">		
			<div class="col-xs-12 paddL0 form-horizontal">
				<div class="form-group"
					ng-class="{ 'has-error' : configurazioneOffertaForm.tdKitForm.codiceTdKit.$invalid && configurazioneOffertaForm.$submitted }">
					<label class="col-xs-3 control-label">Codice TD KIT<sup>*</sup>
						<span ng-if="loadingCodiceTDKit" us-spinner="{radius:5, width:1, length: 5}"></span>
					</label>
					<div class="col-xs-7">			
						<input type="text"
	                              class="form-control SB-width"
	                              ng-model="customizedOffer.offerTopDetails.CODICETDKIT.dft"
	                              name="codiceTdKit"
							      required
	                              disabled>
						<a ng-href="#" class="openpopup" ng-click="configureCodiceTDKit($event)">
	                           <img src="assets/css/i/form_arrow.png" alt="form">
	                    </a>
		                <div role="alert">
		           			<span ng-if="configurazioneOffertaForm.tdKitForm.codiceTdKit.$invalid && configurazioneOffertaForm.$submitted" 
		           				  class="help-block help-width">Seleziona questo campo</span>
		       				<span ng-if="campiModificati['CODICETDKIT']" class="help-block help-width">Valore da asset: {{_codiceTDKIT}}</span>
		       			</div>
					</div>
				</div>									
				<div class="form-group">
					<label class="col-xs-3 control-label">Caratteristica VP</label>
					<div class="col-xs-7">
						<select class="selectmenu SB-width form-control" name="caratteristicaVP" ng-model="customizedOffer.offerTopDetails.CARATTERISTICAVP.dft">
							<option value=""></option>
							<option ng-repeat="item in arrayCaratteristicaVP" value="{{item}}">{{item}}</option>
						</select> 
		                <div role="alert">                                    			
		                	<span  ng-if="campiModificati['CARATTERISTICAVP']"                               	      			
		                    	class="help-block help-width">Valore da asset: {{_caratteristicaVp}}</span>
		                </div>
					</div>
				</div>
			</div>	
		</div>
	</section>
</ng-form>
