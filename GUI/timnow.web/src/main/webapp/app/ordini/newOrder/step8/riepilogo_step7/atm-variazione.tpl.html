<div class="panel-body" >
	<div class="row">
		<div class="col-xs-6 form-horizontal paddL0">
			<div class="form-group">
				<label class="col-xs-6 control-label">DAD</label>
				<div class="col-xs-6 selected-item">
					<span>{{ data.step7.dad | date:'dd/MM/yyyy' }}</span>
				</div>
			</div>
		</div>
		<div class="col-xs-6 form-horizontal paddL0">
			<div class="form-group">
				<label class="col-xs-6 control-label">Fascia oraria</label>
				<div class="col-xs-6 selected-item">
					<span ng-if="data.step7.fascia_oraria">{{time_slot[data.step7.fascia_oraria]}}</span>
				</div>
			</div>
		</div>
	</div>
	<div class="row" ng-if="data.step7.refOaoProgettiSpeciali">
	<div class="col-xs-6 form-horizontal paddL0">
	<div class="form-group">
	<label class="col-xs-6 control-label">Referente OAO Progetti Speciali</label>
						<div class="col-xs-6 selected-item">
							<span >{{data.step7.refOaoProgettiSpeciali}}</span>
						</div>
						</div>
	</div>
	</div>
	<div ng-if="formData.data.step7.datiReferenti">
					<div class="col-xs-12" ng-repeat="(key, value) in formData.data.step7.datiReferenti">
						<h2>Referente {{key}}</h2>
						<div class="col-xs-6 form-horizontal paddL0">
							<div class="form-group">
								<label class="col-xs-5 control-label">Nome</label>
								<div class="col-xs-7 selected-item">
									<span>{{ value.nome }}</span>
								</div>
							</div>
							<div class="form-group">
								<label class="col-xs-5 control-label">Telefono fisso</label>
								<div class="col-xs-7 selected-item">
									<span>{{ value.telefonoFisso }}</span>
								</div>
							</div>
							<div class="form-group">
								<label class="col-xs-5 control-label">Qualifica</label>
								<div class="col-xs-7 selected-item">
									<span>{{ value.qualifica }}</span>
								</div>
							</div>
						</div>
						<div class="col-xs-6 form-horizontal paddL0">
							<div class="form-group">
								<label class="col-xs-5 control-label">Cognome</label>
								<div class="col-xs-7 selected-item">
									<span>{{ value.cognome }}</span>
								</div>
							</div>
							<div class="form-group">
								<label class="col-xs-5 control-label">Cellulare</label>
								<div class="col-xs-7 selected-item">
									<span>{{ value.cellulare }}</span>
								</div>
							</div>
						</div>
					</div>
				</div>
</div>
