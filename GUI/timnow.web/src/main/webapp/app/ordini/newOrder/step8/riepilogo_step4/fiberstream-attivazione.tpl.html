<!-- RU_1462 -->
<div class="panel-body">
	<div class="col-xs-6 paddL0 form-horizontal">
		<div class="form-group">
			<label class="col-xs-5 control-label">Profilo Tecnico Linea</label>
			<div class="col-xs-7 selected-item">{{
				customizedOffer.offerTopDetails.PROFILOTECNICOLINEA.dft }}</div>
		</div>
	</div>
</div>
<div class="panel-body" ng-repeat="vlanuser in data.step4.vlanusers">
	<h2>User {{vlanuser.id}}</h2>
	<div class="col-xs-6 paddL0 form-horizontal">
		<div class="form-group">
			<label class="col-xs-5 control-label">Service VLAN</label>
			<div class="col-xs-7 selected-item">
				<span>{{ vlanuser.SVLANCODE.dft }} </span>
			</div>
		</div>
		<div class="form-group">
			<label class="col-xs-5 control-label">Customer VLAN</label>
			<div class="col-xs-7 selected-item ">
				<span>{{ vlanuser.CUSTOMERVLAN.dft }}</span>
			</div>
		</div>
		<div class="form-group">
			<label class="col-xs-5 control-label">User VLAN</label>
			<div class="col-xs-7 selected-item">
				<span>{{ vlanuser.USERVLAN.dft }}</span>
			</div>
		</div>
		<div class="form-group">
			<label class="col-xs-5 control-label">Profilo VLAN</label>
			<div class="col-xs-7 selected-item">
				<span ng-if="vlanuser.PROFILOVLAN.dft == '0'">COS 0</span>
				<span ng-if="vlanuser.PROFILOVLAN.dft == '1'">COS 1</span>
				<span ng-if="vlanuser.PROFILOVLAN.dft == '5'">COS 5</span>
			</div>
		</div>
	</div>
</div>
