<ng-form name="datiServiziOpzionaliForm[$index]" class="form-container"
	ng-repeat="servizio in data.step7.datiServiziOpzionali track by $index"
	novalidate>
	<fieldset ng-keyup="isServiziOpzionaliRequired(datiServiziOpzionaliForm[$index])" ng-mouseup="isServiziOpzionaliRequired(datiServiziOpzionaliForm[$index])">
		<div class="row">
			<div class="col-md-9">
				<h2>Servizio {{$index + 1}}</h2>
			</div>
			<div class="col-md-3"
				ng-if="data.step7.datiServiziOpzionali.length > 1">
				<button type="button" class="close closeItem" alt="Elimina"
					ng-click="deleteServizioOpzionale($index)" title="Elimina">
					<span aria-hidden="true" class="glyphicon glyphicon-trash"></span>
				</button>
			</div>
		</div>
		<div class="row">
			<div class="col-xs-6 form-horizontal">
				<div class="form-group"
					ng-class="{ 'has-error' : datiServiziOpzionaliForm[$index].codiceServizio.$invalid && dettaglioOrdineForm.$submitted }">
					<label class="col-xs-5 control-label">Codice Servizio<sup ng-if="isServiziOpzionaliRequiredFlag && !RU_1560 && !([MAP_OFFERTE.NGA_H.id, MAP_OFFERTE.VULA_H.id, MAP_OFFERTE.SEMI_VULA_H.id].indexOf(data.step3.offerta.idOfferta) > -1)">*</sup></label>
					<div class="col-xs-7">
						<select name="codiceServizio" 
								class="selectmenu form-control SB-width"
								ng-required="!RU_1560 && !offertaValida_RU_1560 && isServiziOpzionaliRequiredFlag"
								ng-model="servizio.codiceServizio"
								ng-change="(RU_1560 && offertaValida_RU_1560 && servizio.codiceServizio === 'TLC8') ? servizio.descrizioneServizio = 'ONT Operatore' : servizio.descrizioneServizio = ''">
									<option value=""></option>
									<option ng-repeat="code in listCodiceServizio" value="{{code}}">{{code}}</option>
						</select>
						<div role="alert">
							<span
								ng-if="datiServiziOpzionaliForm[$index].codiceServizio.$error.required && dettaglioOrdineForm.$submitted"
								class="help-block help-width">Compila questo campo</span>
							<span ng-if="erroreCodiceServizio" class="help-block help-width red">{{erroreCodiceServizio}}<span>
						</div>
					</div>
				</div>
			</div>
			<div class="col-xs-6 form-horizontal paddL0">
				<div class="form-group"
					ng-class="{ 'has-error' : datiServiziOpzionaliForm[$index].descrizioneServizio.$invalid && dettaglioOrdineForm.$submitted }">
					<label class="col-xs-5 control-label">Descrizione Servizio</label>
					<div class="col-xs-7">
						<!-- RU_1560 -->
						<input type="text" name="descrizioneServizio"
							class="form-control SB-width"
							ng-maxlength="255"
							ng-model="servizio.descrizioneServizio"
							ng-disabled="RU_1560 && offertaValida_RU_1560 && !servizio.codiceServizio">
						<div role="alert">
							<span
								ng-if="datiServiziOpzionaliForm[$index].descrizioneServizio.$error.maxlength"
								class="help-block help-width">Inserire al massimo 255
								caratteri</span>
						</div>
					</div>
				</div>
			</div>
		</div>
		<div class="row">
			<div class="col-xs-6 form-horizontal">
				<div class="form-group"
					ng-class="{ 'has-error' : datiServiziOpzionaliForm[$index].datiTecnici.$invalid && !dettaglioOrdineForm.$submitted }">
					<label class="col-xs-5 control-label">Dati Tecnici</label>
					<div class="col-xs-7">
						<!-- RU_1560 -->
						<input type="text" name="datiTecnici" class="form-control SB-width"
							ng-model="servizio.datiTecnici" ng-maxlength="255"
							data-toggle="tooltip"
					        data-placement="top"
					        ng-attr-title="{{(RU_1560 && offertaValida_RU_1560) ? 'Per il servizio opzionale TLC8, il contenuto di questo campo viene ignorato da FiberCop' : ''}}">
						<div role="alert">
							<span
								ng-if="datiServiziOpzionaliForm[$index].datiTecnici.$error.maxlength"
								class="help-block help-width">Inserire al massimo 255
								caratteri</span>
						</div>
					</div>
				</div>
			</div>
			<div class="col-xs-6 form-horizontal paddL0">
				<div class="form-group">
					<label class="col-xs-5 control-label">Vincolante Per
						Espletamento</label>
					<div class="col-xs-7">
						<!-- RU_1560 -->
						<select class="form-control selectmenu SB-width"
							name="vincolantePerEspletamento"
							ng-model="servizio.vincolantePerEspletamento"
							data-toggle="tooltip"
					        data-placement="top"
					        ng-attr-title="{{(RU_1560 && offertaValida_RU_1560) ? 'Per il servizio opzionale TLC8, il contenuto di questo campo viene ignorato da FiberCop' : ''}}">
							<option value="" selected="">Selezionare</option>
							<option value="N">No</option>
							<option value="Y">Si</option>
						</select>
					</div>
				</div>
			</div>
		</div>
	</fieldset>
</ng-form>
