<div class="panel-body">
	<div class="row">
		<div class="col-xs-6 form-horizontal paddL0">
			<div class="form-group" ng-if="data.step7.dad">
				<label class="col-xs-6 control-label">DAD</label>
				<div class="col-xs-6 selected-item">
					<span>{{ data.step7.dad | date:'dd/MM/yyyy' }}</span>
				</div>
			</div>
			<div class="form-group" ng-if="data.step7.fascia_oraria">
				<label class="col-xs-6 control-label">Fascia oraria</label>
				<div class="col-xs-6 selected-item">
					<span>{{time_slot[data.step7.fascia_oraria]}}</span>
				</div>
			</div>
		</div>
		<div class="col-xs-6 form-horizontal paddL0">
			<div class="form-group"
					 ng-if="(customizedOffer.offerTopDetails.TIPOLINEA.dft=='POTS' || customizedOffer.offerTopDetails.TIPOLINEA.dft=='ISDN') && data.step7.numeroLinea">
				<label class="col-xs-6 control-label">Numero Linea </label>
				<div class="col-xs-6 selected-item">
					<span ng-if="data.step7.numeroLinea">{{data.step7.numeroLinea}}</span>
				</div>
			</div>
			<div class="form-group" ng-if="([MAP_OFFERTE.VULA_CAB.id, MAP_OFFERTE.VULA_H.id,MAP_OFFERTE.NGA_CAB.id,MAP_OFFERTE.NGA_H.id].indexOf(data.step3.offerta.idOfferta) >= 0) &&
								(customizedOffer.offerTopDetails.TIPOLINEA.dft == 'LineaNonFonia')">
				<label class="col-xs-6 control-label">Opzione Dinamica</label>
				<div class="col-xs-6 selected-item">
				<span ng-if="!data.step7.opzioneDinamica"
					  class="glyphicon glyphicon-unchecked" aria-hidden="true"
					  style="color: #004388"></span> <span
						ng-if="data.step7.opzioneDinamica"
						class="glyphicon glyphicon-check" aria-hidden="false"
						style="color: #004388"></span>
				</div>
			</div>
		</div>
	</div>
	
	<!-- RU_886 -->
	<div class="row" ng-if="[MAP_OFFERTE.VULA_CAB.name, MAP_OFFERTE.NGA_CAB.name].indexOf(data.step3.offerta.nomeOffertaCatalogo)>=0">
		<div class="col-xs-6 form-horizontal paddL0">
			<div class="form-group">
				<label class="col-xs-5">TEST2</label>
				<div class="col-xs-7"> 
					<span>{{data.step7.test2}}</span>
				</div>
			</div>
		</div>
	</div>

	<!-- R1C-19-1212 -->
	<div class="row" ng-if="[MAP_OFFERTE.VULA_H.name, MAP_OFFERTE.NGA_H.name, MAP_OFFERTE.BTS_H.name].indexOf(data.step3.offerta.nomeOffertaCatalogo)>=0">
		<div class="col-xs-6 form-horizontal paddL0">
			<div class="form-group">
				<label class="col-xs-5">TOKEN</label>
				<div class="col-xs-6 selected-item">
					<span>{{data.step7.token}}</span>
				</div>
			</div>
		</div>
	</div>
	
	<!-- RU_1036 -->
	<div class="col-xs-6 form-horizontal paddL0" ng-if="RU_1036 && customizedOffer.offerTopDetails.TIPOLINEA.dft=='LineaNonFonia'">
		<div class="form-group">
			<label class="col-xs-6 control-label">QUALIFICA</label>
			<div class="col-xs-6 selected-item">
				<span>{{(data.step7.qualifica == 'Y' ? 'SI' : 'NO')}}</span>
			</div>
		</div>
	</div>
	
	<!-- RU_1164 -->
	<div class="col-xs-6 form-horizontal paddL0" ng-if="[MAP_OFFERTE.SEMI_BTS_H.id, MAP_OFFERTE.SEMI_VULA_H.id, MAP_OFFERTE.SEMI_EASYIP_H.id].indexOf(data.step3.offerta.idOfferta)>=0">
		<div class="form-group">
			<label class="col-xs-6 control-label" ng-if="[MAP_OFFERTE.SEMI_BTS_H.id].indexOf(data.step3.offerta.idOfferta)>=0">Semi Bitstream NGA</label>
			<label class="col-xs-6 control-label" ng-if="[MAP_OFFERTE.SEMI_VULA_H.id].indexOf(data.step3.offerta.idOfferta)>=0">Semi VULA</label>
			<!-- SM_10077 -->
			<label class="col-xs-6 control-label" ng-if="[MAP_OFFERTE.SEMI_EASYIP_H.id].indexOf(data.step3.offerta.idOfferta)>=0">Semi EASYIP NGA</label>
			<div class="col-xs-6 selected-item">
				<span>{{(data.step7.flagOffertaSemi == 'Y' ? 'SI' : '')}}</span>
			</div>
		</div>
	</div>
	
	<div class="col-xs-6 form-horizontal paddL0" ng-if="[MAP_OFFERTE.SEMI_BTS_H.id, MAP_OFFERTE.SEMI_VULA_H.id].indexOf(data.step3.offerta.idOfferta)>=0">
		<div class="form-group">
			<label class="col-xs-6 control-label">Id Rete Secondaria OAO</label>
			<div class="col-xs-6 selected-item">
				<span>{{data.step7.idReteSecondariaOao}}</span>
			</div>
		</div>
	</div>
			
	<!-- RU_980 -->
	<div ng-if="showServiziOpzionali && RU_980">
		<div ng-include="'app/ordini/newOrder/step8/riepilogo_step7/sezioni/sezioneServiziOpzionali.html'"></div>
	</div>
	<!-- RU_1485 -->
	<div ng-if="showServiziOpzionaliAlternativi && RU_980">
		<div ng-include="'app/ordini/newOrder/step8/riepilogo_step7/sezioni/sezioneServiziOpzionaliAlternativi.html'"></div>
	</div>
	<!-- R1I-20-0131-->
	<div ng-if="showDisaggregazione">
		<div ng-include="'app/ordini/newOrder/step8/riepilogo_step7/sezioni/sezioneDisaggregazione.html'"></div>
	</div>
	<div ng-if="showPresaAppuntamento">
		<div ng-include="'app/ordini/newOrder/step8/riepilogo_step7/sezioni/sezionePresaAppuntamento.html'"></div>
	</div>
	<div ng-if="showPrestazioniAggiuntive">
		<div ng-include="'app/ordini/newOrder/step8/riepilogo_step7/sezioni/sezionePrestazioniAggiuntive.html'"></div>
	</div>
	<div ng-if="showSlaPlusSu">
		<div ng-include="'app/ordini/newOrder/step8/riepilogo_step7/sezioni/sezioneSlaPlusSu.html'"></div>
	</div>	
</div>
