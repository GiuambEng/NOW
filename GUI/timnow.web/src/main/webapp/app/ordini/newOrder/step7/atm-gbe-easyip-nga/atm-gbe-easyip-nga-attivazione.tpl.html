<section class="form-process" >
			<div class="row">
				<div class="col-xs-6 form-horizontal paddL0">
					<div class="form-group">
						<label class="col-xs-5 control-label">DAD</label>
						<div class="col-xs-7">
							<input type="text" name="dad"
								class="form-control SB-width selectDate" ng-click="openDP2()"
								uib-datepicker-popup="{{format}}" ng-model="data.step7.dad"
								is-open="popup_dp2.opened" datepicker-options="dateOptions"
								close-text="Chiudi" alt-input-formats="altInputFormats"
								>
						</div>
					</div>
					<!-- RU_716 -->
					<div class="form-group"
						 ng-if="[MAP_OFFERTE.FWA.name].indexOf(data.step3.offerta.nomeOffertaCatalogo)<0 && (([MAP_OFFERTE.VULA_CAB.id, MAP_OFFERTE.NGA_CAB.id, MAP_OFFERTE.GBE_AF.id].indexOf(data.step3.offerta.idOfferta) >= 0) &&
								(customizedOffer.offerTopDetails.TIPOLINEA.dft == 'LineaNonFonia'))"
					>
						<label class="col-xs-5 control-label">Opzione Dinamica</label>
						<div class="col-xs-7">
 							<input type="checkbox" ng-model="data.step7.opzioneDinamica" > <!-- RU_741 -->
							<!-- <span class="glyphicon glyphicon-unchecked" aria-hidden="true"
								  style="color: #004388"></span> -->
						</div>
					</div>
				</div>
				<div class="col-xs-6 form-horizontal paddL0">
					<div class="form-group"
						ng-class="{ 'has-error' : (dettaglioOrdineForm.fascia_oraria.$invalid && dettaglioOrdineForm.$submitted) }">
						<label class="col-xs-5 control-label">Fascia oraria <sup ng-if="data.step7.dad">*</sup></label>
						<div class="col-xs-7">
							<div class="selectParent">
								<select class="form-control selectmenu SB-width"
									name="fascia_oraria" ng-model="data.step7.fascia_oraria"
									ng-required="data.step7.dad">
									<option value="" selected="">Selezionare</option>
									<option ng-repeat="(key,value) in time_slot" value="{{ key }}">{{value}}</option>
								</select> <span
									ng-if="dettaglioOrdineForm.fascia_oraria.$invalid && dettaglioOrdineForm.$submitted"
									class="help-block help-width">Compila questo campo</span>
							</div>
						</div>
					</div>
					
					<!-- RU_1036 -->
					<div class="form-group"	ng-class="{ 'has-error' : (dettaglioOrdineForm.qualifica.$invalid && dettaglioOrdineForm.$submitted) }"  ng-if="RU_1036 && showQualifica">
						<label class="col-xs-5 control-label">QUALIFICA</label>
						<div class="col-xs-7">
							<div class="selectParent">
								<select class="form-control selectmenu SB-width"
									name="qualifica" ng-model="data.step7.qualifica">
									<option value="Y">SI</option>
									<option value="N">NO</option>
								</select> <span
									ng-if="dettaglioOrdineForm.fascia_oraria.$invalid && dettaglioOrdineForm.$submitted"
									class="help-block help-width">Compila questo campo</span>
							</div>
						</div>
					</div>
				</div>
				<!-- RU_716 -->
				<div class="col-xs-6 form-horizontal paddL0"
					 ng-if="[MAP_OFFERTE.FWA.name].indexOf(data.step3.offerta.nomeOffertaCatalogo)<0 && ([MAP_OFFERTE.ATM_SF.id, MAP_OFFERTE.ATM_SH.id,MAP_OFFERTE.GBE_SF.id].indexOf(data.step3.offerta.idOfferta) >= 0)"
					 ng-class="{ 'has-error' : ((dettaglioOrdineForm.dataDisponibilitaSede.$invalid || dettaglioOrdineForm.dataDisponibilitaSede.$invalid) && dettaglioOrdineForm.$submitted) }">
					<div class="form-group">
						<label class="col-xs-5 control-label">Data Disponibilit&agrave; Sede <sup>*</sup></label>
						<div class="col-xs-7">
							<input 
								type="text" 
								name="dataDisponibilitaSede"
								class="form-control SB-width selectDate" 
								ng-click="openDP4()"
								uib-datepicker-popup="{{format}}" 
								ng-model="data.step7.dataDisponibilitaSede"
								is-open="popup_dp4.opened" 
								datepicker-options="dateOptions"
								close-text="Chiudi" 
								alt-input-formats="altInputFormats"
								required
								>
								<div role="alert">
									<span ng-if="dettaglioOrdineForm.dataDisponibilitaSede.$invalid && dettaglioOrdineForm.$submitted" class="help-block help-width">Compila questo campo</span>
								</div>
						</div>
					</div>
				</div>
				<!-- RU_716 -->
				<div class="col-xs-6 form-horizontal paddL0" ng-if="[MAP_OFFERTE.FWA.name].indexOf(data.step3.offerta.nomeOffertaCatalogo)<0 && (customizedOffer.offerTopDetails.TIPOLINEA.dft=='POTS' || customizedOffer.offerTopDetails.TIPOLINEA.dft=='ISDN')">
					<div class="form-group"
						ng-class="{ 'has-error' : (dettaglioOrdineForm.numero_linea.$invalid && dettaglioOrdineForm.$submitted) }">
						<label class="col-xs-5 control-label">Numero Linea <sup>*</sup></label>
                          <div class="col-xs-7">
                               <input type="text" class="form-control SB-width"
                                      name="numero_linea"
                                      ng-model="data.step7.numeroLinea"
                                      ng-maxlength="10" maxlength="10"
                                      required>
                                	<span ng-if="dettaglioOrdineForm.numero_linea.$invalid && dettaglioOrdineForm.$submitted" class="help-block help-width">Compila questo campo</span>
                                	<span ng-if="dettaglioOrdineForm.numero_linea.$error.maxlength" class="help-block help-width">Inserire al massimo 10 caratteri</span>
                         </div>
					</div>
				</div>
			</div>
			<!-- RU_886 -->
			<div class="row" ng-if="[MAP_OFFERTE.VULA_CAB.name, MAP_OFFERTE.NGA_CAB.name].indexOf(data.step3.offerta.nomeOffertaCatalogo)>=0">
				<div class="col-xs-6 col-sm-6 col-md-6 col-lg-6 form-horizontal paddL0">
					<div class="form-group"
						ng-class="{ 'has-error' : dettaglioOrdineForm.test2.$invalid && !dettaglioOrdineForm.test2.$pristine }" >
						<label class="col-xs-5">TEST2</label>
						<div class="col-xs-7">
							<select
							 	ng-init=" initTest2()"
								class="selectmenu SB-width form-control" 
								name="test2"
								ng-model="data.step7.test2">
								<option value="Y">SI</option>
								<option value="N" selected>NO</option>
							</select>
							<div role="alert">
								<span
									ng-if="dettaglioOrdineForm.test2.$invalid && !dettaglioOrdineForm.test2.$pristine"
									class="help-block help-width">Compila questo campo</span>
							</div>
						</div>
					</div>
				</div>
			</div>

			<!-- R1C-19-1212 -->
			<div class="row" ng-if="R1C_19_1212">
				<div
					class="col-xs-6 col-sm-6 col-md-6 col-lg-6 form-horizontal paddL0">
					<div class="form-group"
						ng-class="{ 'has-error' : dettaglioOrdineForm.token.$invalid && !dettaglioOrdineForm.token.$pristine }">
						<label class="col-xs-5">TOKEN</label>
						<div class="col-xs-7">
							<input type="text" class="form-control SB-width" name="token"
								ng-model="data.step7.token" ng-maxlength="50"> <span
								ng-if="dettaglioOrdineForm.token.$error.maxlength"
								class="help-block help-width"> Inserire al massimo 50
								caratteri </span>
						</div>
					</div>
				</div>
			</div>
			
			<!-- RU_1164 -->
			<div class="row" ng-if="RU_1164 && [MAP_OFFERTE.SEMI_VULA_H.id].indexOf(data.step3.offerta.idOfferta)>=0">
				<div class="col-xs-6 col-sm-6 col-md-6 col-lg-6 form-horizontal paddL0">
					<div class="form-group">
						<label class="col-xs-5">Semi VULA</label>
						<div class="col-xs-7">
							<label class="col-xs-5">SI</label>
							<input type="hidden" disabled class="form-control SB-width" ng-bind="data.step7.flagOffertaSemi = 'Y'">
						</div>
					</div>
				</div>
			</div>
			
			<div class="row" ng-if="RU_1164 && [MAP_OFFERTE.SEMI_BTS_H.id].indexOf(data.step3.offerta.idOfferta)>=0">
				<div class="col-xs-6 col-sm-6 col-md-6 col-lg-6 form-horizontal paddL0">
					<div class="form-group">
						<label class="col-xs-5">Semi Bitstream NGA</label>
						<div class="col-xs-7">
							<label class="col-xs-5">SI</label>
							<input type="hidden" disabled class="form-control SB-width" ng-bind="data.step7.flagOffertaSemi = 'Y'">
						</div>
					</div>
				</div>
			</div>
			
			<!-- SM_10077 -->
			<div class="row" ng-if="RU_1164 && [MAP_OFFERTE.SEMI_EASYIP_H.id].indexOf(data.step3.offerta.idOfferta)>=0">
				<div class="col-xs-6 col-sm-6 col-md-6 col-lg-6 form-horizontal paddL0">
					<div class="form-group">
						<label class="col-xs-5">Semi EASYIP NGA</label>
						<div class="col-xs-7">
							<label class="col-xs-5">SI</label>
							<input type="hidden" disabled class="form-control SB-width" ng-bind="data.step7.flagOffertaSemi = 'Y'">
						</div>
					</div>
				</div>
			</div>
			
			<div class="row" ng-if="RU_1164 && [MAP_OFFERTE.SEMI_BTS_H.id, MAP_OFFERTE.SEMI_VULA_H.id].indexOf(data.step3.offerta.idOfferta)>=0">
				<div class="col-xs-6 col-sm-6 col-md-6 col-lg-6 form-horizontal paddL0">
					<div class="form-group" ng-class="{ 'has-error' : (dettaglioOrdineForm.idReteSecondariaOao.$invalid && dettaglioOrdineForm.$submitted) }">
						<label class="col-xs-5">Id Rete Secondaria OAO</label>
						<div class="col-xs-7">
							<input type="text" class="form-control SB-width" ng-maxlength="19" maxlength="19"
			                        name="idReteSecondariaOao" ng-model="data.step7.idReteSecondariaOao"  ng-pattern="alphanumeric">
			                <div role="alert">        
                            	<span ng-if="dettaglioOrdineForm.idReteSecondariaOao.$error.maxlength" class="help-block help-width">Inserire al massimo 19 caratteri</span>
                            	<span ng-if="dettaglioOrdineForm.idReteSecondariaOao.$error.pattern" class="help-block help-width">Inserire solo caratteri alfanumerici</span>
                            </div>
						</div>
					</div>
				</div>
			</div>
			
			<!-- RU_980 -->		
			<div class="col-xs-12 paddLR0">
				<uib-accordion class="accordion-bs">
					<uib-accordion-group heading="Servizi Opzionali" is-open="subFormView[0]" template-url="accordion-group-template.html" ng-if="showServiziOpzionali">
						<div ng-include="'app/ordini/newOrder/step7/sezioni/sezioneServiziOpzionali.tpl.html'"></div>
	                     <section class="form-button" ng-if="data.step7.datiServiziOpzionali.length < maxLengthServiziOpzionali">
							<button ng-click="addServizioOpzionale($event)" title="Aggiungi" alt="Aggiungi" name="aggiungiVCButton" class="close addItem">
								<span class="glyphicon glyphicon-plus"></span>
								<label>Aggiungi</label>
							</button>
						 </section>                       
					</uib-accordion-group>
					
					<!-- RU_1485 -->
					<uib-accordion-group heading="Servizi Opzionali Alternativi" is-open="subFormView[1]" template-url="accordion-group-template.html" ng-if="showServiziOpzionaliAlternativi">
						<div ng-include="'app/ordini/newOrder/step7/sezioni/sezioneServiziOpzionaliAlternativi.tpl.html'"></div>
	                     <section class="form-button" ng-if="data.step7.datiServiziOpzionaliAlternativi.length < maxLengthServiziOpzionaliAlternativi">
							<button ng-click="addServizioOpzionaleAlternativo($event)" title="Aggiungi" alt="Aggiungi" name="aggiungiVCButton" class="close addItem">
								<span class="glyphicon glyphicon-plus"></span>
								<label>Aggiungi</label>
							</button>
						 </section>                       
					</uib-accordion-group>
					
					<!-- R1I-20-0131-->
					<uib-accordion-group heading="Disaggregazione" is-open="subFormView[2]" template-url="accordion-group-template.html" ng-if="showDisaggregazione">					
						<div ng-include="'app/ordini/newOrder/step7/sezioni/sezioneDisaggregazione.tpl.html'"></div>                         
					</uib-accordion-group>
					<uib-accordion-group heading="Presa Appuntamento" is-open="subFormView[3]" template-url="accordion-group-template.html" ng-if="showPresaAppuntamento">
						<div ng-include="'app/ordini/newOrder/step7/sezioni/sezionePresaAppuntamento.tpl.html'"></div>                            
					</uib-accordion-group>
					<uib-accordion-group heading="Prestazioni Aggiuntive" is-open="subFormView[4]" template-url="accordion-group-template.html" ng-if="showPrestazioniAggiuntive">
						 <div ng-include="'app/ordini/newOrder/step7/sezioni/sezionePrestazioniAggiuntive.tpl.html'"></div>
					</uib-accordion-group>	
					<uib-accordion-group heading="Sla Plus SU" is-open="subFormView[5]" template-url="accordion-group-template.html" ng-if="showSlaPlusSu">
						<div ng-include="'app/ordini/newOrder/step7/sezioni/sezioneSlaPlusSu.tpl.html'"></div>
					</uib-accordion-group>	
					<!-- RU_1598 -->
					<uib-accordion-group heading="Cluster" is-open="subFormView[6]" template-url="accordion-group-template.html" ng-if="showCluster">
						<div ng-include="'app/ordini/newOrder/step7/sezioni/sezioneCluster.tpl.html'"></div>
					</uib-accordion-group>				
				</uib-accordion>
			</div>			
</section>
