<div ng-if="spinOptionVariazione" class="spinner_container_direttiva">
	<span us-spinner="{radius:18, width:3, length: 14}"></span>
</div>
<div class="col-xs-6 form-horizontal paddL0">
     <div class="form-group" ng-if="(data.step1.causale_ordine == 'variazione') && data.option" ng-class="{ 'has-error' : sceltaOfferta.opzioneVariazione.$invalid && !sceltaOfferta.opzioneVariazione.$pristine}">
        <label class="col-xs-5 control-label">Opzione Variazione<sup>*</sup></label>
         <div class="col-xs-7">
             <div class="selectParent">
                 <select class="selectmenu SB-width form-control"
                         name="opzioneVariazione"
                         ng-model="data.step3.opzioneVariazione"
                         ng-change="cambiaOpzioneVariazione()"
                         ng-disabled="loadStep3 || errColl"
                         required
                 >
                     <option ng-repeat="item in data.option" value="{{ item.codice }}">{{item.codice}}</option>
                 </select>
                 <div role="alert">
                         <span ng-show="sceltaOfferta.opzioneVariazione.$invalid && !sceltaOfferta.opzioneVariazione.$pristine" class="help-block help-width">Compila questo campo</span>
                     </div> 
             </div>
         </div>
     </div>
     <div class="form-group" ng-if="[MAP_OFFERTE.ULL_LA.id, MAP_OFFERTE.ULLD_LA.id, MAP_OFFERTE.SLU_LA.id].indexOf(data.step3.offerta.idOfferta) >= 0">
		<label class="col-xs-5 control-label">Flag NP</label>
		<div class="col-xs-7">
		 	<input type="checkbox"
	                  name="checkboxName"
	                  ng-model="data.step3.visibilitaNP"
	                  ng-change="svuotaNP()">
		</div>
	</div>
 </div>
 <div class="col-xs-12 madatory-field paddL0">
     <i>*Campo obbligatorio</i>
 </div>
