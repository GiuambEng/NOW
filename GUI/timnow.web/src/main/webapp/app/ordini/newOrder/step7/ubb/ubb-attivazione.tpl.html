<!-- RU_1150 -->
<div ng-controller="ubbAttivazioneStep7">
	<ng-form class="form-container" name="dettaglioForm">
		<section class="form-process">
			<div class="row">
				<div class="col-xs-12 form-horizontal paddL0">
					<div class="form-group"
						ng-class="{ 'has-error' : dettaglioForm.coinvestimento.$invalid && !dettaglioForm.coinvestimento.$pristine }">
						<label class="col-xs-3 control-label">Coinvestimento<sup>*</sup></label>
						<div class="col-xs-7 selected-item">
							<select class="selectmenu SB-width form-control" required
								name="area"	ng-model="data.step7.coinvestimento">
								<option value=></option>
								<option value="I">IRU</option>
								<option value="M">Minimo Garantito</option>
							</select>
							<div role="alert">
								<span
									ng-if="dettaglioForm.coinvestimento.$error.required && !dettaglioForm.coinvestimento.$pristine"
									class="help-block help-width">Seleziona questo campo</span>
							</div>
						</div>
					</div>
					<div class="form-group"
						ng-class="{ 'has-error' : dettaglioForm.idGpon.$invalid && !dettaglioForm.idGpon.$pristine }">
						<label class="col-xs-3 control-label">IDGPON<sup>*</sup>
							<span ng-if="loadingidGpon" us-spinner="{radius:5, width:1, length: 5}"></span>
						</label>
						<div class="col-xs-7 selected-item">
							<input type="text"
	                               class="form-control SB-width"
	                               ng-model="data.step7.idGpon"
	                               name="idGpon"
								   required
	                               disabled>
							<a ng-href="#" class="openpopup" ng-click="configureIdGpon($event)">
	                            <img src="assets/css/i/form_arrow.png" alt="form">
	                        </a>
	                        <div role="alert">
								<span
									ng-if="dettaglioForm.codiceTdKit.$error.required && !dettaglioForm.codiceTdKit.$pristine"
									class="help-block help-width">Seleziona questo campo</span>
							</div>
						</div>
					</div>
					<div class="form-group" ng-class="{ 'has-error' : dettaglioForm.dai.$invalid && !dettaglioForm.dai.$pristine }">
						<label class="col-xs-3 control-label">DAI<sup>*</sup></label>
						<div class="col-xs-7">
							<input type="text" name="dai"
								class="form-control SB-width selectDate" ng-click="openDaiPicker()"
								uib-datepicker-popup="{{format}}" ng-model="data.step7.dac"
								is-open="popup_dai.opened" datepicker-options="dateOptions"
								close-text="Chiudi" required
								alt-input-formats="altInputFormats"> 
							<div role="alert">
								<span
									ng-if="dettaglioForm.dai.$error.required && !dettaglioForm.dai.$pristine"
									class="help-block help-width">Compila questo campo</span>
							</div>
						</div>
					</div>
					
					<!-- RU_1317 -->					
					<div class="form-group" ng-class="{ 'has-error' : dettaglioForm.refOaoProgettiSpeciali.$invalid && !dettaglioForm.refOaoProgettiSpeciali.$pristine }">
						<label class="col-xs-3 control-label">ReferentiOAOProgettiSpeciali</label>
						<div class="col-xs-7">
							<textarea
	                        	name="refOaoProgettiSpeciali"
	                            cols="30"
	                            rows="5"
	                            class="form-control"
	                            ng-model="data.step7.refOaoProgettiSpeciali"
	                            ng-maxlength="255">
	                        </textarea>
	                        <div role="alert">
                        		<span ng-if="!dettaglioForm.refOaoProgettiSpeciali.$error.pattern && dettaglioForm.refOaoProgettiSpeciali.$error.maxlength" class="help-block help-width">Inserire al massimo 255 caratteri</span>
                    		</div>
                        </div>
                     </div>

					<div class="col-xs-12 paddLR0">
						<uib-accordion class="accordion-bs" close-others="false">
							<uib-accordion-group heading="Servizi Opzionali" is-open="subFormView[0]" template-url="accordion-group-template.html" ng-if="showServiziOpzionali">
								<div ng-include="'app/ordini/newOrder/step7/sezioni/sezioneServiziOpzionali.tpl.html'"></div>
			                     <section class="form-button" ng-if="data.step7.datiServiziOpzionali.length < maxLengthServiziOpzionali">
									<button id="aggiungiServizioButton" ng-click="addServizioOpzionale($event)" title="Aggiungi" alt="Aggiungi" class="close addItem">
										<span class="glyphicon glyphicon-plus"></span>
										<label>Aggiungi</label>
									</button>
								 </section>                       
							</uib-accordion-group>
							
							<!-- RU_1485 -->
							<uib-accordion-group heading="Servizi Opzionali Alternativi" is-open="subFormView[1]" template-url="accordion-group-template.html" ng-if="showServiziOpzionaliAlternativi">
								<div ng-include="'app/ordini/newOrder/step7/sezioni/sezioneServiziOpzionaliAlternativi.tpl.html'"></div>
			                     <section class="form-button" ng-if="data.step7.datiServiziOpzionaliAlternativi.length < maxLengthServiziOpzionaliAlternativi">
									<button ng-click="addServizioOpzionaleAlternativo($event)" title="Aggiungi" alt="Aggiungi" name="aggiungiVCButton" class="close addItem">
										<span class="glyphicon glyphicon-plus"></span>
										<label>Aggiungi</label>
									</button>
								 </section>                       
							</uib-accordion-group>
							
							<!-- RU_1393 -->
							<uib-accordion-group heading="Gestione Autonoma" is-open="subFormView[2]" template-url="accordion-group-template.html" ng-if="showGestioneAutonoma">					
								<div ng-include="'app/ordini/newOrder/step7/sezioni/sezioneGestioneAutonoma.tpl.html'"></div>                         
							</uib-accordion-group>
							<uib-accordion-group heading="Presa Appuntamento" is-open="subFormView[3]" template-url="accordion-group-template.html" ng-if="showPresaAppuntamento">
								<div ng-include="'app/ordini/newOrder/step7/sezioni/sezionePresaAppuntamento.tpl.html'"></div>                            
							</uib-accordion-group>
							<uib-accordion-group heading="Prestazioni Aggiuntive" is-open="subFormView[4]" template-url="accordion-group-template.html" ng-if="showPrestazioniAggiuntive">
						 		<div ng-include="'app/ordini/newOrder/step7/sezioni/sezionePrestazioniAggiuntive.tpl.html'"></div>
							</uib-accordion-group>	
							<uib-accordion-group heading="Sla Plus SU" is-open="subFormView[5]" template-url="accordion-group-template.html" ng-if="showSlaPlusSu">
								<div ng-include="'app/ordini/newOrder/step7/sezioni/sezioneSlaPlusSu.tpl.html'"></div>
							</uib-accordion-group>
						</uib-accordion>
					</div>
				</div>
			</div>
		</section>
		<div class="col-xs-12 madatory-field paddL0">
	    	<i>*Campo obbligatorio</i>
	    </div>
	    <section class="form-button">
				<button class="btn btn-disabled" type="button"
					ng-click="confermaAnnulla()">Annulla</button>
				<button class="btn btn-disabled" type="button"
					ng-click="goTo()">Indietro</button>
				<button ng-if="isAuthorized('Ordini','Ordini in Bozza') && !bozza.nomeBozza" class="btn blue-btn" type="button" ng-click="salvaBozza()">Salva in Bozza</button>
				<button
					ng-if="isAuthorized('Ordini','Ordini in Bozza') && bozza.nomeBozza"
					class="btn blue-btn" type="button" ng-click="salvaBozza('aggiorna')">Aggiorna
					Bozza</button>
				<button class="btn blue-btn" type="button" ng-disabled="!dettaglioForm.$valid" ng-click="submitFormVlan($event)">Avanti</button>	
		</section>
	</ng-form>
</div>
