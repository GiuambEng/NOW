<div class="row">
	<h2>Presa Appuntamento</h2>
	<div class="col-xs-6 form-horizontal paddL0">

			<label class="col-xs-6 control-label">Owner Presa Appuntamento</label>
			<div class="col-xs-6 selected-item">
				<span>{{ data.step7.datiAppuntamentoDisaggregazione.ownerPresaAppuntamento }}</span>
			</div>
		</div>
	</div>
	<div class="col-xs-6 form-horizontal paddL0">
		<div class="form-group">
			<label class="col-xs-6 control-label">Data Appuntamento</label>
			<div class="col-xs-6 selected-item">
				<span>{{ data.step7.datiAppuntamentoDisaggregazione.dataAppuntamento | date:'dd/MM/yyyy' }}</span>
			</div>
		</div>
	</div>
	<div class="col-xs-6 form-horizontal paddL0">
		<div class="form-group">
			<label class="col-xs-6 control-label">Fascia Oraria</label>
			<div class="col-xs-6 selected-item">
				<span>{{ timeSlotPresaAppuntamento[data.step7.datiAppuntamentoDisaggregazione.fasciaOraria] }}</span>
			</div>
		</div>
