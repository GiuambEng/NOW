<!-- RU_1058 -->
<ng-form name="condivisoriForm" ng-controller="vlanVariazioneNumeroCondivisoriStep4" novalidate>
	
	<section class="form-process">
		<!-- Condivisori già presenti -->
		<div class="panel-body" ng-repeat="condivisore in data.step4.arrayCondivisori"> 
			<div class="row">
		       	<div class="col-md-9">
					<h2>CONDIVISORE {{$index + 1}}</h2>
				</div>
			</div>
			
			<div class="row">
	        	<div class="col-xs-6 form-horizontal">  
		        	<div class="form-group" >
						<label class="col-xs-5 control-label">Elimina </label>
						<div class="col-xs-7">
							<input type="checkbox"
							       ng-true-value="'C'" ng-false-value="''"
							       ng-model="condivisore.azione">
						</div>
					</div>
		         </div>
		    </div>
		    
		    <div class="row">
		    	<div class="col-xs-6 form-horizontal">
		    		<div class="form-group">
						<label class="col-xs-5 control-label">Codice OLO Titolare</label>
						<label class="col-xs-7 selected-item">{{condivisore.codOloAgcomTitolare}}</label>
					</div>
					<div class="form-group">
						<label class="col-xs-5 control-label">Codice OLO</label>
						<label class="col-xs-7 selected-item">{{condivisore.codOloAgcom}}</label>
					</div>
		    	</div>
		    </div>
		</div>
		
		<!-- Condivisori da aggiungere -->
		<div class="panel-body" ng-repeat="condivisore in data.step4.arrayCondivisoriNuovi track by $index"> 
			<div class="row">
		       	<div class="col-md-9">
					<h2>NUOVO CONDIVISORE {{$index + 1}}</h2>
				</div>
		        <div class="col-md-3">
					<button type="button" 
						class="close closeItem" 
						alt="Elimina Condivisore" 
						title="Elimina Condivisore" 
						ng-click="deleteCondivisoreNuovo($index)">
						<span aria-hidden="true" class="glyphicon glyphicon-trash"></span>
					</button>
				</div>
			</div>
		    
		    <div class="row">
		    	<div class="col-xs-6 form-horizontal">
		    		<div class="form-group">
						<label class="col-xs-5 control-label">OLO<sup>*</sup></label>
						<div class="col-xs-7 selected-item">
							<select class="selectmenu SB-width form-control" name="olo{{$index}}" ng-change="addAzione($index)"
								ng-model="data.step4.arrayCondivisoriNuovi[$index]" required
								ng-options="olo.codOloAgcom for olo in listaCodOlo track by olo.codOloAgcom">
							</select>
						</div>
					</div>
					<div class="form-group">
						<label class="col-xs-5 control-label">Codice OLO</label>
						<label class="col-xs-7 selected-item">{{data.step4.arrayCondivisoriNuovi[$index].codOloNumerico}}</label>
					</div>
		    		<div class="form-group">
						<label class="col-xs-5 control-label">Codice OLO Titolare</label>
						<label class="col-xs-7 selected-item">{{data.step4.arrayCondivisoriNuovi[$index].codOloAgcomTitolare}}</label>
					</div>
		    	</div>
		    </div>
		</div>
		<section class="form-button">
	    	<button id="aggiungiCondivisore" title="Aggiungi Condivisore" alt="Aggiungi Condivisore" class="close addItem" 
	    			ng-click="addNuovoCondivisore($event)" ng-if="enableAggiungiCondivisore"><span class="glyphicon glyphicon-plus"></span><label>Aggiungi</label></button>
	    </section>	
	</section>		
</ng-form>
