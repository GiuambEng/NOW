<!-- 		OFFERTA WLR      -->
		<section class="form-process" ng-controller="wlr_dettaglio" ng-if="data.step1.causale_ordine!='migrazione'">
			<div class="row">
				<!-- SPALLA SINISTRA -->
				<div class="col-xs-6 form-horizontal paddL0">
				<div class="form-group" 
					 ng-if="data.step1.causale_ordine!='variazione' && data.step3.offerta.idOfferta == '25'"
					 ng-class="{ 'has-error' : dettaglioOrdineForm.dn.$invalid && dettaglioOrdineForm.$submitted}"
					>
						<label class="col-xs-5 control-label">DN <sup>*</sup></label>
						<div class="col-xs-7">
							<input name="dn" 
								   ng-maxlength="12" type="text"
								   class="form-control SB-width"
								   ng-model="data.step7.dn" 
								   required
								   />
							<div role="alert">
								<span ng-if="dettaglioOrdineForm.dn.$error.maxlength"
									class="help-block help-width">Inserire massimo 12
									caratteri</span> 
								<span ng-if="dettaglioOrdineForm.dn.$invalid && dettaglioOrdineForm.$submitted"
									class="help-block help-width">Compila questo campo</span>
							</div>
						</div>
					</div>
				<div class="form-group" 
					 ng-if="data.step1.causale_ordine!='variazione' && data.step3.offerta.idOfferta == '22'"
					 ng-class="{ 'has-error' : dettaglioOrdineForm.idRisorsaBTSNaked.$invalid && dettaglioOrdineForm.$submitted }">
						<label class="col-xs-5 control-label">Id Risorsa BTS Naked</label>
						<div class="col-xs-7">
							<input  name="idRisorsaBTSNaked" 
									type="text" 
									class="form-control SB-width"
									ng-model="data.step7.idRisorsaBTSNaked" 
									ng-maxlength="12"
							>
							<div role="alert">
								<span ng-if="dettaglioOrdineForm.idRisorsaBTSNaked.$error.maxlength"
									class="help-block help-width">Inserire massimo 12 caratteri</span>
							</div>
						</div>
				</div>
				<div class="form-group" ng-if="data.step1.causale_ordine!='variazione'" ng-class="{ 'has-error' : dettaglioOrdineForm.BorchiaNT1Plus.$invalid && dettaglioOrdineForm.$submitted }">
						<label class="col-xs-5 control-label">BorchiaNT1Plus</label>
						<div class="col-xs-7">
							
							<select name="BorchiaNT1Plus"
									ng-model="data.step7.borchiaNT1Plus"
									class="selectmenu SB-width form-control" 
									ng-disabled="data.step3.offerta.idOfferta == '22' && customizedOffer.offerTopDetails.TIPOLINEA.dft != 'ISDN'"
									 >
									 <option></option>
									 <option>W+</option>
									 <option>W-</option>
							</select>
						</div>
				</div>
				<div class="form-group"
					 ng-if="data.step1.causale_ordine=='variazione' || data.step3.offerta.idOfferta == '22'"
					 ng-class="{ 'has-error' : dettaglioOrdineForm.fascia_oraria.$invalid && dettaglioOrdineForm.$submitted }"
					>
						<label class="col-xs-5 control-label">Fascia oraria</label>
						<div class="col-xs-7">
							<div class="selectParent">
								<select 
										class="form-control selectmenu SB-width"
										name="fascia_oraria" 
										ng-model="data.step7.fascia_oraria"
										ng-required="data.step7.dad"
								>
									<option value="" selected="">Selezionare</option>
									<option ng-repeat="(key,value) in time_slot" value="{{ key }}">{{value}}</option>
								</select> <span
									ng-if="dettaglioOrdineForm.fascia_oraria.$invalid && dettaglioOrdineForm.$submitted"
									class="help-block help-width">Compila questo campo</span>

							</div>
						</div>
					</div>
					<div class="form-group"  
						 ng-if="(((data.step1.causale_ordine=='variazione' || data.step3.offerta.idOfferta == '22') && (data.step3.opzioneVariazione == 'Trasloco')) || (data.step1.causale_ordine=='attivazione' && data.step3.offerta.idOfferta == '22'))"
						 ng-class="{ 'has-error' : dettaglioOrdineForm.recapitoTelefonicoCliente.$invalid && dettaglioOrdineForm.$submitted }" 
						 >
						<label class="col-xs-5 control-label">Recapito telefonico Cliente<sup>*</sup></label>
						<div class="col-xs-7">
							<input name="recapitoTelefonicoCliente" 
								   ng-maxlength="12" 
								   type="text"
								   ng-pattern="integerval" 
								   class="form-control SB-width"
								   ng-model="data.step7.recapitoTelefonicoCliente" 
								   required
								   />
							<div role="alert">
								<span ng-if="dettaglioOrdineForm.recapitoTelefonicoCliente.$error.maxlength"
									class="help-block help-width">Inserire massimo 12
									caratteri</span> 
								<span ng-if="dettaglioOrdineForm.recapitoTelefonicoCliente.$invalid && dettaglioOrdineForm.$submitted"
									class="help-block help-width">Compila questo campo</span>
							</div>
						</div>
					</div>
				</div>
				<!-- SPALLA DESTRA -->
				<div class="col-xs-6 form-horizontal paddL0">
				<div class="form-group"
						ng-class="{ 'has-error' : ((dettaglioOrdineForm.dac.$invalid && dettaglioOrdineForm.$submitted) || dacMessaggioErrore) }">
						<label class="col-xs-5 control-label">DAC<sup ng-if="data.step3.offerta.idOfferta == '22'">*</sup><span
							ng-hide="caricaDac" us-spinner="{radius:5, width:1, length: 5}"></span></label>
						<div class="col-xs-7 dpContainer">
							<input type="text" name="dac"
								class="form-control SB-width selectDate" ng-click="openDP1()"
								ng-change="validationDac(data.step7.dac)"
								uib-datepicker-popup="{{format}}" ng-model="data.step7.dac"
								is-open="popup_dp1.opened" datepicker-options="dateOptions"
								ng-required="data.step3.offerta.idOfferta == '22'" 
								close-text="Chiudi"
								alt-input-formats="altInputFormats"
								ng-disabled="!caricaDac" />
							<div role="alert">
								<span
									ng-if="dettaglioOrdineForm.dac.$invalid && !dettaglioOrdineForm.dac.$pristine"
									class="help-block help-width">Compila questo campo</span> <span
									ng-if="dacMessaggioErrore" class="help-block help-width">{{dacMessaggioErrore}}</span>
							</div>
						</div>
					</div>
					<div class="form-group"  ng-if="data.step1.causale_ordine=='variazione' || data.step3.offerta.idOfferta == '22'">
						<label class="col-xs-5 control-label">DAD</label>
						<div class="col-xs-7">
							<input type="text" name="dad"
								class="form-control SB-width selectDate" ng-click="openDP2()"
								uib-datepicker-popup="{{format}}" ng-model="data.step7.dad"
								is-open="popup_dp2.opened" datepicker-options="option"
								close-text="Chiudi" 
								alt-input-formats="altInputFormats">  
						</div>
					</div>
					<div class="form-group" ng-if="data.step1.causale_ordine!='variazione'">
						<label class="col-xs-5 control-label">ClirPermanente</label>
						<div class="col-xs-7">
							<select class="selectmenu SB-width form-control" name="clirPermanente" ng-model="data.step7.clirPermanente">
								<option></option>
								<option value="0">Disattivare</option>
								<option value="1">Attivare/Mantenere</option>
							</select>
						</div>
					</div>
					<div class="form-group" ng-class="{ 'has-error' : (dettaglioOrdineForm.dataSottoscrizioneContratto.$invalid && dettaglioOrdineForm.$submitted) }">
						<label class="col-xs-5 control-label">Data Sottoscrizione Contratto<sup>*</sup></label>
						<div class="col-xs-7">
							<input type="text" name="dataSottoscrizioneContratto"
								   class="form-control SB-width selectDate" ng-click="openDP3()"
								   uib-datepicker-popup="{{format}}" ng-model="data.step7.dataSottoscrizioneContratto"
								   is-open="popup_dp3.opened" datepicker-options="option"
								   close-text="Chiudi"
								   alt-input-formats="altInputFormats" 
								   required
								> 
							<div role="alert">
								<span ng-if="dettaglioOrdineForm.dataSottoscrizioneContratto.$invalid && !dettaglioOrdineForm.dataSottoscrizioneContratto.$pristine"
									class="help-block help-width">Compila questo campo</span>
							</div>
						</div>
					</div>
				</div>
			</div>
		</section>
	 <section ng-if="data.step1.causale_ordine=='migrazione'"  class="form-process">
            <div class="col-xs-12 form-horizontal paddL0">
                <div class="form-group">
                    <label class="col-xs-12 control-label">Per i servizi Dati non ci sono ulteriori campi da inserire .Si pu&ograve; procedere alla Pagina successiva.</label>
                </div>
            </div>
        </section>
