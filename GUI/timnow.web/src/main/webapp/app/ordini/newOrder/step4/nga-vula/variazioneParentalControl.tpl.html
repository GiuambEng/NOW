<div class="col-xs-12 paddLR0">
    <uib-accordion class="accordion-bs">
        <uib-accordion-group
                        heading="Parental Control"
                        ng-form="parental_control_form"
                        is-open="true"
                        template-url="accordion-group-template.html">
            <div class="panel-body">
                <div class="row">
                    <div class="col-xs-6 form-horizontal">
                            <div class="form-group"
                                    ng-class="{ 'has-error' : configurazioneOffertaForm.parental_control_form.parental_control.$invalid && !configurazioneOffertaForm.parental_control_form.parental_control.$pristine, 'var-mod' :  customizedOffer.offerTopDetails.PROFILO.dft && (customizedOffer.offerTopDetails.PROFILO.dft != DettaglioAsset.offerTopDetails.PROFILO.dft) }">
                                    <label class="col-xs-5 control-label">Parental Control<sup>*</sup></label>
                                    <div class="col-xs-7">
                                        <select
                                                class="selectmenu SB-width form-control"
                                                name="parental_control"
                                                ng-model="customizedOffer.offerTopDetails.PROFILO.dft"
                                                ng-options="key as value for (key, value) in parentalControlMap"
                                                ng-change="ControlParentalControlChange();"
                                                required
                                        >
                                            <option ng-value="null" disabled hidden>
                                                -- seleziona --
                                            </option>
                                        </select>
                                        <div role="alert">
                                            <span ng-show="configurazioneOffertaForm.parental_control_form.parental_control.$invalid && !configurazioneOffertaForm.parental_control_form.parental_control.$pristine" class="help-block help-width">Compila questo campo</span>
                                        <span ng-show="
                                                customizedOffer.offerTopDetails.PROFILO.dft 
                                                && (DettaglioAsset.offerTopDetails.PROFILO.dft != customizedOffer.offerTopDetails.PROFILO.dft)
                                            " class="help-block help-width">Valore da Asset: "{{ parentalControlMap[DettaglioAsset.offerTopDetails.PROFILO.dft] }}"</span>
                                        </div>
                                    </div>
                                </div>
                    </div>
                </div>
            </div> 
        </uib-accordion-group>
    </uib-accordion>              
</div>
