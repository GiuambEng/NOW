<ng-form name="datiServiziOpzionaliAlternativiForm[$index]" class="form-container"
	ng-repeat="servizio in data.step7.datiServiziOpzionaliAlternativi track by $index"
	novalidate>
	<fieldset>
		<div class="row">
			<div class="col-md-9">
				<h2>Servizio {{$index + 1}}</h2>
			</div>
			<div class="col-md-3"
				ng-if="data.step7.datiServiziOpzionaliAlternativi.length > 1">
				<button type="button" class="close closeItem" alt="Elimina"
					ng-click="deleteServizioOpzionaleAlternativo($index)" title="Elimina">
					<span aria-hidden="true" class="glyphicon glyphicon-trash"></span>
				</button>
			</div>
		</div>
		<div class="row">
			<div class="col-xs-6 form-horizontal">
				<div class="form-group">
					<label class="col-xs-5 control-label">Codice Servizio</label>
					<div class="col-xs-7">
						<select name="codiceServizio"
							class="selectmenu form-control SB-width"
							ng-model="servizio.codiceServizio" ng-change="setDescrizioneServizioOpzionaleAlternativo(servizio.codiceServizio, $index)">
							<option value></option>
							<option ng-repeat="code in listCodiceServizioAlternativo" value="{{code.servizioOpzionaleAlternativo}}">{{code.servizioOpzionaleAlternativo}}</option>
						</select>
					</div>
				</div>
			</div>
			<div class="col-xs-6 form-horizontal paddL0">
				<div class="form-group">
					<label class="col-xs-5 control-label">Descrizione Servizio</label>
					<div class="col-xs-7">
						<input type="text" name="descrizioneServizio" disabled
							class="form-control SB-width"
							ng-model="servizio.descrizioneServizio">
					</div>
				</div>
			</div>
		</div>
	</fieldset>
</ng-form>
