<!-- RU_1393 -->
<ng-form name="datiGestioneAutonomaForm" class="form-container"
	novalidate>
	<fieldset ng-keyup="isGestioneAutonomaRequired(datiGestioneAutonomaForm)" ng-mouseup="isGestioneAutonomaRequired(datiGestioneAutonomaForm)">
		<div class="panel-body">
			<div class="row">
				<div class="col-xs-6 form-horizontal">
					<div class="form-group" ng-class="{ 'has-error' : datiGestioneAutonomaForm.impresaSystem.$invalid && dettaglioOrdineForm.$submitted }">						
						<label class="col-xs-5 control-label">Impresa System</label>
						<div class="col-xs-7">
							<input type="checkbox" name="impresaSystem" 
								ng-model="data.step7.datiGestioneAutonoma.impresaSystem" ng-true-value="'Y'" ng-false-value="'N'" ng-change="onCheckImpresaSystem()">
						</div>
					</div>
				</div>
				<div class="col-xs-6 form-horizontal paddL0">
					<div class="form-group" ng-class="{ 'has-error' : datiGestioneAutonomaForm.operatoreSystem.$invalid && dettaglioOrdineForm.$submitted }">						
						<label class="col-xs-5 control-label">Operatore System</label>
						<div class="col-xs-7">
							<input type="checkbox" name="operatoreSystem" 
								ng-model="data.step7.datiGestioneAutonoma.operatoreSystem" ng-true-value="'Y'" ng-false-value="'N'" ng-change="onCheckOperatoreSystem()">
						</div>
					</div>
				</div>
			</div>	
			
			<div class="row">			
				<div class="col-xs-6 form-horizontal">
					<div class="form-group"
						ng-class="{ 'has-error' : datiGestioneAutonomaForm.systemUnico.$invalid && dettaglioOrdineForm.$submitted }">
						<label class="col-xs-5 control-label">System Unico<sup ng-if="isGestioneAutonomaRequiredFlag">*</sup></label>
						<div class="col-xs-7">
							<select name="systemUnico"
								class="selectmenu form-control SB-width"
								ng-model="data.step7.systemUnico" ng-required="isGestioneAutonomaRequiredFlag">
								<option value></option>
								<option ng-repeat="system in listCodiceSystemUnico track by $index"
									value="{{system}}">{{system.codSystemUnico}}</option>
							</select>
							<div role="alert">
								<span
									ng-if="datiGestioneAutonomaForm.systemUnico.$error.required && dettaglioOrdineForm.$submitted"
									class="help-block help-width red">Compila questo campo</span>
								<span ng-if="erroreCodiceSystemUnico != ''" class="help-block help-width red">{{erroreCodiceSystemUnico}}</span>
							</div>
						</div>
					</div>
				</div>
				<div class="col-xs-6 form-horizontal paddL0" ng-if="data.step7.datiGestioneAutonoma.operatoreSystem == 'Y'">
					<div class="form-group"
						ng-class="{ 'has-error' : datiGestioneAutonomaForm.subappalto.$invalid && dettaglioOrdineForm.$submitted }">
						<!-- RU_1428 -->
						<label class="col-xs-5 control-label">Subappalto
								<sup ng-if="data.step7.datiGestioneAutonoma.tipologiaImpresa == 'OPSYSC3'">*</sup>
						</label>
						<div class="col-xs-7">
							<select name="subappalto"
								class="selectmenu form-control SB-width"
								ng-model="data.step7.datiGestioneAutonoma.subAppalto"
								ng-required="data.step7.datiGestioneAutonoma.tipologiaImpresa == 'OPSYSC3'">
								<option value></option>
								<option ng-repeat="subappalto in listCodiceSubappalto track by $index"
									value="{{subappalto}}">{{subappalto}}</option>
							</select>
							<div role="alert">
								<span ng-if="erroreCodiceSubAppalto != ''" class="help-block help-width red">{{erroreCodiceSubAppalto}}</span>
								<span
									ng-if="datiGestioneAutonomaForm.subappalto.$error.required && dettaglioOrdineForm.$submitted"
									class="help-block help-width red">Compila questo campo</span> 
							</div>
						</div>
					</div>
				</div>
			</div>	
			
			<!-- RU_1428 -->
			<div class="row">
				<div class="col-xs-6 form-horizontal">
					<div class="form-group"
						ng-class="{ 'has-error' : datiGestioneAutonomaForm.tipologiaImpresa.$invalid && dettaglioOrdineForm.$submitted }">
						<label class="col-xs-5 control-label">Tipologia Impresa<sup ng-required="isGestioneAutonomaRequiredFlag">*</sup></label>
						<label class="col-xs-5 control-label">{{data.step7.datiGestioneAutonoma.tipologiaImpresa}}</label>
					</div>
				</div>
			</div>				
				
			<div class="row">
				<div class="col-xs-6 form-horizontal">
					<div class="form-group"
						ng-class="{ 'has-error' : datiGestioneAutonomaForm.noteSu.$invalid && dettaglioOrdineForm.$submitted }">
						<label class="col-xs-5 control-label">Note SU</label>
						<div class="col-xs-7">
							<textarea name="noteSu" cols="30" rows="5" id="noteSu"
								placeholder="Inserisci eventuali note"
								class="form-control SB-width"
								ng-model="data.step7.datiGestioneAutonoma.noteSu"
								ng-maxlength="255"></textarea>
							<div role="alert">
								<span ng-if="datiGestioneAutonomaForm.noteSu.$error.maxlength"
									class="help-block help-width red">Inserire al massimo 255 caratteri</span>
							</div>
						</div>
					</div>
				</div>
			</div>
			
			
		</div>
	</fieldset>
</ng-form>
