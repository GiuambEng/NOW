<!-- RU_1393 -->
<div class="row">
	<h2>Gestione Autonoma</h2>
	<div class="col-xs-6 form-horizontal paddL0">
		<div class="form-group">
			<label class="col-xs-6 control-label">Impresa System</label>
			<div class="col-xs-6 selected-item">				
				<span ng-if="!data.step7.datiGestioneAutonoma.impresaSystem"
						class="glyphicon glyphicon-unchecked" aria-hidden="true"
						style="color: #004388"></span> 
				<span
						ng-if="data.step7.datiGestioneAutonoma.impresaSystem == 'Y'"
						class="glyphicon glyphicon-check" aria-hidden="false"
						style="color: #004388"></span>
			</div>
		</div>
		<div class="form-group">
			<label class="col-xs-6 control-label">Operatore System</label>
			<div class="col-xs-6 selected-item">				
				<span ng-if="!data.step7.datiGestioneAutonoma.operatoreSystem"
						class="glyphicon glyphicon-unchecked" aria-hidden="true"
						style="color: #004388"></span> 
				<span
						ng-if="data.step7.datiGestioneAutonoma.operatoreSystem == 'Y'"
						class="glyphicon glyphicon-check" aria-hidden="false"
						style="color: #004388"></span>
			</div>
		</div>
	</div>
	<div class="col-xs-6 form-horizontal paddL0">
		<div class="form-group">
			<label class="col-xs-6 control-label">System Unico</label>
			<div class="col-xs-6 selected-item">
				<span>{{ data.step7.datiGestioneAutonoma.systemUnico }}</span>
			</div>
		</div>
		<div class="form-group">
			<label class="col-xs-6 control-label">Subappalto</label>
			<div class="col-xs-6 selected-item">
				<span>{{ data.step7.datiGestioneAutonoma.subAppalto }}</span>
			</div>
		</div>
	</div>
	<div class="col-xs-6 form-horizontal paddL0">
		<div class="form-group">
			<label class="col-xs-6 control-label">Tipologia Impresa</label>
			<div class="col-xs-6 selected-item">
				<span>{{ data.step7.datiGestioneAutonoma.tipologiaImpresa }}</span>
			</div>
		</div>
	</div>
	<div class="col-xs-6 form-horizontal paddL0">
		<div class="form-group">
			<label class="col-xs-6 control-label">Note SU</label>
			<div class="col-xs-6 selected-item">
				<span>{{ data.step7.datiGestioneAutonoma.noteSu }}</span>
			</div>
		</div>
	</div>
</div>
