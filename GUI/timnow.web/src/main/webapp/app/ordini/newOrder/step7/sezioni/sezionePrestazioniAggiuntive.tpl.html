<ng-form name="datiPrestazioniAggiuntiveForm" class="form-container"
	novalidate>
	<fieldset ng-disabled="prestazioniAggiuntiveDisabled" ng-mouseup="isPrestazioniAggiuntiveRequired(datiPrestazioniAggiuntiveForm)" ng-keyup="isPrestazioniAggiuntiveRequired(datiPrestazioniAggiuntiveForm)">
		<div class="panel-body">
			<div class="row" ng-if="prestazioniAggiuntiveDisabled && !isOffertaSemiGPON">
				<div class="col-xs-12 form-horizontal">
					<div class="form-group">
						<label class="col-xs-12 help-block help-width red"> Per
							abilitare i campi della sezione, compilare correttamente la
							sezione Disaggregazione. </label>
					</div>
				</div>
			</div>
			<!-- RU_1393 -->
			<div class="row" ng-if="prestazioniAggiuntiveDisabled && isOffertaSemiGPON">
				<div class="col-xs-12 form-horizontal">
					<div class="form-group">
						<label class="col-xs-12 help-block help-width red"> Per
							abilitare i campi della sezione, compilare correttamente la
							sezione Gestione Autonoma. </label>
					</div>
				</div>
			</div>
			<div class="row">
				<div class="col-xs-6 form-horizontal">
					<div class="form-group"
						ng-class="{ 'has-error' : datiPrestazioniAggiuntiveForm.flagPrestazioneAggiuntiva.$invalid && dettaglioOrdineForm.$submitted }">
						<label class="col-xs-5 control-label">Flag Prestazione Aggiuntiva<sup ng-if="isPrestazioniAggiuntiveRequiredFlag">*</sup>
						</label>
						<div class="col-xs-7">
							<input type="checkbox" name="flagPrestazioneAggiuntiva"
								ng-model="data.step7.datiPrestazioniAggiuntive.flagPrestazioneAggiuntiva" ng-required="isPrestazioniAggiuntiveRequiredFlag"/>
							<div role="alert">	                                                	                                                
		                       <span ng-if="datiPrestazioniAggiuntiveForm.flagPrestazioneAggiuntiva.$error.required && dettaglioOrdineForm.$submitted" class="help-block help-width">Compila questo campo</span>
		                    </div>
						</div>
					</div>
				</div>
				<div class="col-xs-6 form-horizontal paddL0">
					<div class="form-group"
						ng-class="{ 'has-error' : datiPrestazioniAggiuntiveForm.prestazioneAggiuntiva.$invalid && dettaglioOrdineForm.$submitted }">
						<label class="col-xs-5 control-label">Prestazione
							Aggiuntiva<sup ng-if="isPrestazioniAggiuntiveRequiredFlag">*</sup>
						</label>
						<div class="col-xs-7">
							<input type="text" name="prestazioneAggiuntiva"
								class="form-control SB-width"
								ng-model="data.step7.datiPrestazioniAggiuntive.prestazioneAggiuntiva"
								ng-maxlength="100" ng-required="isPrestazioniAggiuntiveRequiredFlag">
							<div role="alert">
								<span
									ng-if="datiPrestazioniAggiuntiveForm.prestazioneAggiuntiva.$error.required && dettaglioOrdineForm.$submitted"
									class="help-block help-width">Compila questo campo</span> <span
									ng-if="datiPrestazioniAggiuntiveForm.prestazioneAggiuntiva.$error.maxlength"
									class="help-block help-width">Inserire al massimo 100
									caratteri</span>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</fieldset>
</ng-form>
