 <div class="col-xs-6 form-horizontal paddL0">
      <div class="form-group">
          <label  class="col-xs-5 control-label">Offerte disponibili<sup>*</sup></label>
          <div class="col-xs-7" >
              <div class="selectParent">
                  <select class="selectmenu SB-width form-control"
                          name="offerta"
                          ng-model="data.step3.offertaLabel"
                          ng-change="getOfferDetails('reload'); "
                  >
                      <option ng-repeat="item in formData.offers" value="{{ item }}">{{item.nomeOfferta}}</option>
                  </select>
              </div>
          </div>
      </div>
	  <div class="form-group" ng-if="data.step3.offertaLabel && !getMap_Offerta(data.step3.offerta.idOfferta).regolatorio" ng-class="{ 'has-error' : sceltaOfferta.tipoMigrazione.$invalid && !sceltaOfferta.tipoMigrazione.$pristine}">
           <label class="col-xs-5 control-label">Tipo Migrazione<sup>*</sup></label>
           <div class="col-xs-7">
               <select class="selectmenu SB-width form-control"
                       name="tipoMigrazione"
                       ng-model="data.step3.tipoMigrazione"
                       required>
                   <option value="Attivazione274">Attivazione 274</option>
                   <option value="MigrazioneOLO">Migrazione OLO</option>
               </select>
               <div role="alert">
                    <span ng-show="sceltaOfferta.tipoMigrazione.$invalid && !sceltaOfferta.tipoMigrazione.$pristine" class="help-block help-width">Compila questo campo</span>
                </div>
           </div>
       </div>
</div>
<div class="col-xs-12 madatory-field paddL0">
    <i>*Campo obbligatorio</i>
</div>
