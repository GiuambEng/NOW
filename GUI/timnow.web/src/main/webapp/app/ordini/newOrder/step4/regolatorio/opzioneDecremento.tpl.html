<div class="col-xs-6 paddL0 form-horizontal">
 <div class="form-group"  >
                    <label class="col-xs-5 control-label">DN</label>
                    <div class="col-xs-7">
                        <input  type="text"
                                name="dn"
                                class="form-control SB-width"
                                ng-model="data.step4.dn"
                                >
                    </div>
     </div>
    <div class="form-group" ng-class="{ 'has-error' : configurazioneOffertaForm.routingNumber.$invalid && !configurazioneOffertaForm.routingNumber.$pristine }">
           <label class="col-xs-5 control-label">Routing Number<sup>*</sup></label>
           <div class="col-xs-7">
               <input  type="text"
                       name="routingNumber"
                       class="form-control SB-width"
                       ng-model="data.step4.routingNumber"
                      required
               >
            <div role="alert">
                    <span ng-if="configurazioneOffertaForm.routingNumber.$invalid && !configurazioneOffertaForm.routingNumber.$pristine" class="help-block help-width">Compila questo campo</span>
            </div>
           </div>
     </div>
</div>
<div class="col-xs-6 paddR0 form-horizontal">
    <div class="form-group" ng-if="(customizedOffer.offerTopDetails.STRUTTURALINEA.dft=='PBX' || customizedOffer.offerTopDetails.STRUTTURALINEA.dft=='GNR')">
        <label class="col-xs-5 control-label">Capostipite<sup>*</sup></label>
        <div class="col-xs-7">
            <input type="text"
                   class="form-control SB-width"
                   name="capostipite"
                   required
                   ng-model="customizedOffer.offerTopDetails.CAPOSTIPITE.dft"
                  ng-maxlength="12"
            >
        </div>
    </div>   
     <div class="form-group" ng-if="(customizedOffer.offerTopDetails.STRUTTURALINEA.dft=='PBX' || customizedOffer.offerTopDetails.STRUTTURALINEA.dft=='GNR')">
         <label class="col-xs-5 control-label">Quantit&agrave; Linee<sup>*</sup></label>
         <div class="col-xs-7">
             <input
                  type="number"
                  name="quantita_linee"
                  class="form-control SB-width"
                  ng-model="customizedOffer.offerTopDetails.QUANTITALINEE.dft"
                  ng-pattern="integerval"
                  ng-maxlength="3"
                  required
             >
         </div>
     </div> 
</div>
<div class="col-xs-12 madatory-field paddL0">
    <i>*Campo obbligatorio</i>
</div>
