<div class="panel-body">
	<div class="row">
		<div class="col-xs-6 form-horizontal paddL0">
			<div class="form-group" ng-if="data.step7.dac">
				<label class="col-xs-6 control-label">DAC</label>
				<div class="col-xs-6 selected-item">
					<span>{{ data.step7.dac | date:'dd/MM/yyyy' }}</span>
				</div>
			</div>
			<div class="form-group" ng-if="data.step7.dad">
				<label class="col-xs-6 control-label">DAD</label>
				<div class="col-xs-6 selected-item">
					<span>{{ data.step7.dad | date:'dd/MM/yyyy' }}</span>
				</div>
			</div>
			<div class="form-group">
					<label class="col-xs-6 control-label">Fascia oraria</label>
					<div class="col-xs-6 selected-item">
						<span>{{ data.step7.fascia_oraria }}</span>
					</div>
			</div>
			<div class="form-group" ng-if="[MAP_OFFERTE.ULL_LNA.name,MAP_OFFERTE.ULL_LA.name,MAP_OFFERTE.ULL_LANP.name].indexOf(data.step3.offerta.nomeOffertaCatalogo)>=0">
				<label class="col-xs-6 control-label">Flag monitoraggio</label>
				<div class="col-xs-6 selected-item">
					<span ng-if="!data.step7.flag_monitoraggio"
						class="glyphicon glyphicon-unchecked" aria-hidden="true"
						style="color: #004388"></span> <span
						ng-if="data.step7.flag_monitoraggio"
						class="glyphicon glyphicon-check" aria-hidden="false"
						style="color: #004388"></span>
				</div>
			</div>
		</div>
		<div class="col-xs-6 form-horizontal paddL0">
			<div class="form-group">
				<label class="col-xs-6 control-label">N. verde operatore
					PT</label>
				<div class="col-xs-6 selected-item">
					<span>{{ data.step7.num_verde_op_pt }}</span>
				</div>
			</div>
			<div class="form-group">
				<label class="col-xs-6 paddR0 control-label">N. verde
					operatore collaudo</label>
				<div class="col-xs-6 selected-item">
					<span>{{ data.step7.num_verde_op_collaudo }}</span>
				</div>
			</div>
			<div class="form-group">
				<label class="col-xs-6 control-label">DN operatore
					collaudo</label>
				<div class="col-xs-6 selected-item">
					<span>{{ data.step7.dn_op_collaudo }}</span>
				</div>
			</div>
		</div>
	</div>
	<div class="row" ng-if="data.step7.refOaoProgettiSpeciali">
	<div class="col-xs-6 form-horizontal paddL0">
	<div class="form-group">
	<label class="col-xs-6 control-label">Referente OAO Progetti Speciali</label>
						<div class="col-xs-6 selected-item">
							<span >{{data.step7.refOaoProgettiSpeciali}}</span>
						</div>
						</div>
	</div>
	</div>
</div>
