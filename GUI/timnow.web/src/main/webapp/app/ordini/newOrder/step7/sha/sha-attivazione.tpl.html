<section class="form-process" ng-if="data.step1.causale_ordine!='migrazione'">
			<div class="row">
				<!-- SPALLA SINISTRA -->
				<div class="col-xs-6 form-horizontal paddL0">
							<div class="form-group" ng-class="{ 'has-error' : dettaglioOrdineForm.dn.$invalid  && dettaglioOrdineForm.$submitted }">
                                        <label class="col-xs-5 control-label">DN<sup>*</sup></label>
                                        <div class="col-xs-7">
                                            <input  type="text"
                                                    name="dn"
                                                    class="form-control SB-width"
                                                    ng-model="data.step7.dn" 
									   				required
                                                    ng-maxlength="12">
                                            <div role="alert">
                                                <span ng-if="dettaglioOrdineForm.dn.$error.required && dettaglioOrdineForm.$submitted" class="help-block help-width">Compila questo campo</span>
                                                <span ng-if="dettaglioOrdineForm.dn.$error.maxlength" class="help-block help-width">Inserire al massimo 12 caratteri</span>
                                            </div>
                                        </div>
                                    </div>
                                <div class="form-group"
									ng-class="{ 'has-error' : ((dettaglioOrdineForm.dac.$invalid && dettaglioOrdineForm.$submitted) || dacMessaggioErrore) }">
									<label class="col-xs-5 control-label">DAC<sup>*</sup><span
										ng-hide="caricaDac" us-spinner="{radius:5, width:1, length: 5}"></span></label>
									<div class="col-xs-7 dpContainer">
										<input type="text" name="dac"
											class="form-control SB-width selectDate" ng-click="openDP1()"
											ng-change="validationDac(data.step7.dac)"
											uib-datepicker-popup="{{format}}" ng-model="data.step7.dac"
											is-open="popup_dp1.opened" datepicker-options="dateOptions"
											ng-required="true" close-text="Chiudi"
											alt-input-formats="altInputFormats"
											ng-disabled="!caricaDac" />
										<div role="alert">
											<span
												ng-if="dettaglioOrdineForm.dac.$invalid && !dettaglioOrdineForm.dac.$pristine"
												class="help-block help-width">Compila questo campo</span> <span
												ng-if="dacMessaggioErrore" class="help-block help-width">{{dacMessaggioErrore}}</span>
										</div>
									</div>
								</div>
								<div class="form-group">
										<label class="col-xs-5 control-label">DAD</label>
										<div class="col-xs-7">
											<input type="text" name="dad"
												class="form-control SB-width selectDate" ng-click="openDP2()"
												uib-datepicker-popup="{{format}}" ng-model="data.step7.dad"
												is-open="popup_dp2.opened" datepicker-options="dateOptions"
												close-text="Chiudi" 
												alt-input-formats="altInputFormats"
												> 
										</div>
									</div>
									<div class="form-group"
										ng-class="{ 'has-error' : dettaglioOrdineForm.fascia_oraria.$invalid && dettaglioOrdineForm.$submitted }">
										<label class="col-xs-5 control-label">Fascia oraria<sup ng-if="data.step7.dad">*</sup></label>
										<div class="col-xs-7">
											<div class="selectParent">
												<select class="form-control selectmenu SB-width"
													name="fascia_oraria" ng-model="data.step7.fascia_oraria"
													ng-required="data.step7.dad">
													<option value="" selected="">Selezionare</option>
													<option ng-repeat="(key,value) in time_slot" value="{{ key }}">{{value}}</option>
												</select> <span
													ng-if="dettaglioOrdineForm.fascia_oraria.$invalid && dettaglioOrdineForm.$submitted"
													class="help-block help-width">Compila questo campo</span>
											</div>
										</div>
									</div>
				</div>
				<!--  SPALLA DESTRA -->
				<div class="col-xs-6 form-horizontal paddL0">
					<div class="form-group">
						<label class="col-xs-5 control-label">Indicatore di scaffale</label>
						<div class="col-xs-7">
							<input type="checkbox" ng-model="data.step7.indicatoreDiScaffale">
						</div>
					</div>
					<div class="form-group"
						ng-if="data.step3.tipologia_ordine == 'regolatorio'"
						ng-class="{ 'has-error' : ((dettaglioOrdineForm.idullco.$invalid || dettaglioOrdineForm.idullcoSearch.$invalid) && dettaglioOrdineForm.$submitted) }">
						<label class="col-xs-5 control-label">IDULLCO<sup>*</sup></label>
						<div class="col-xs-7">
							<input type="hidden" name="idullco" ng-model="data.step7.idullco" required />
							<input type="text" name="idullcoSearch"
								class="form-control SB-width"
								ng-model="data.step7.searchIdullco"
								required
								value="">
							<button ng-if="data.step7.searchIdullco" type="button"
								class="close buttonDeleteSelection"
								aria-label="Cancella Selezione"
								ng-click="cancellaSelezioneIdullco()">
								<span aria-hidden="true"><img
									src="assets/css/i/close.png" alt="close"></span>
							</button>
							<a href="#"
								ng-if="data.step7.searchIdullco"
								class="openpopup" ng-click="dettaglioOrdineGetIdullco($event)"><img
								src="assets/css/i/form_arrow.png" alt="form"></a>
							<div role="alert">
								<span
									ng-if="dettaglioOrdineForm.idullcoSearch.$invalid && dettaglioOrdineForm.$submitted"
									class="help-block help-width">Compila questo campo</span> <span
									ng-if="dettaglioOrdineForm.idullco.$invalid && dettaglioOrdineForm.$submitted"
									class="help-block help-width">Effettua la ricerca</span>
							</div>
						</div>
					</div>
				</div>
			</div>
		</section>
        <section ng-if="data.step1.causale_ordine=='migrazione'"  class="form-process">
            <div class="col-xs-12 form-horizontal paddL0">
                <div class="form-group">
                    <label class="col-xs-12 control-label">Per i servizi Dati non ci sono ulteriori campi da inserire .Si pu&ograve; procedere alla Pagina successiva.</label>
                </div>
            </div>
        </section>
