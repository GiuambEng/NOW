<div class="col-xs-6 paddL0 form-horizontal">
<div class="form-group"
            ng-class="{ 'has-error' : configurazioneOffertaForm.posizione_permutatore_1.$invalid && !configurazioneOffertaForm.posizione_permutatore_1.$pristine }"
    >
        <label class="col-xs-5 control-label">Posizione permutatore 1<sup>*</sup></label>
        <div class="col-xs-7">
            <input type="text"
                   class="form-control SB-width"
                   name="posizione_permutatore_1"
                   placeholder="Armadio X posizione..."
                   ng-model="customizedOffer.offerTopDetails.POSIZIONEPERMUTATORE1.dft"
                   ng-maxlength="15"
                   ng-minlength="15"
                   ng-init="customizedOffer.offerTopDetails.POSIZIONEPERMUTATORE1.dft = customizedOffer.offerTopDetails.POSIZIONEPERMUTATORE1.dft || formData.offerDetails.offerTopDetails.POSIZIONEPERMUTATORE1.dft"
                   required
            >
            <div role="alert">
                <span ng-if="configurazioneOffertaForm.posizione_permutatore_1.$error.required && !configurazioneOffertaForm.posizione_permutatore_1.$pristine" class="help-block help-width">Compila questo campo</span>
                <span ng-if="configurazioneOffertaForm.posizione_permutatore_1.$error.minlength" class="help-block help-width">Inserire 15 caratteri</span>
                <span ng-if="configurazioneOffertaForm.posizione_permutatore_1.$error.maxlength" class="help-block help-width">Inserire 15 caratteri</span>
            </div>

        </div>
    </div>
    <div class="form-group"
            ng-class="{ 'has-error' : configurazioneOffertaForm.posizione_permutatore_2.$invalid && !configurazioneOffertaForm.posizione_permutatore_2.$pristine }"
    >
        <label class="col-xs-5 control-label">Posizione permutatore 2</label>
        <div class="col-xs-7">
            <input type="text"
                   class="form-control SB-width"
                   name="posizione_permutatore_2"
                   placeholder="Armadio X posizione..."
                   ng-model="customizedOffer.offerTopDetails.POSIZIONEPERMUTATORE2.dft"
                   ng-init="customizedOffer.offerTopDetails.POSIZIONEPERMUTATORE2.dft || formData.offerDetails.offerTopDetails.POSIZIONEPERMUTATORE2.dft"
                   ng-maxlength="15"
                   ng-minlength="15"
            >
            <div role="alert">
                <span ng-if="configurazioneOffertaForm.posizione_permutatore_2.$error.required && !configurazioneOffertaForm.posizione_permutatore_2.$pristine" class="help-block help-width">Compila questo campo</span>
                <span ng-if="configurazioneOffertaForm.posizione_permutatore_2.$error.minlength" class="help-block help-width">Inserire 15 caratteri</span>
                <span ng-if="configurazioneOffertaForm.posizione_permutatore_2.$error.maxlength" class="help-block help-width">Inserire 15 caratteri</span>
            </div>

        </div>
    </div>
</div>

<div class="col-xs-6 paddR0 form-horizontal">
	<div class="form-group"	ng-if="(data.step3.offerta.idOfferta == '1' || data.step3.offerta.idOfferta == '2' || data.step3.offerta.idOfferta == '3' || data.step3.offerta.idOfferta == '4' || data.step3.offerta.idOfferta == '27' || data.step3.offerta.idOfferta == '28')"
							ng-class="{ 'has-error' : ((configurazioneOffertaForm.idullco.$invalid || configurazioneOffertaForm.idullcoSearch.$invalid) && configurazioneOffertaForm.$submitted) }">
									<label class="col-xs-5 control-label">IDULLCO<sup>*</sup></label>
									<div class="col-xs-7">
										<input type="hidden" name="idullco" ng-model="data.step4.idullco"
											required />
										<input type="text" name="idullcoSearch"
											class="form-control SB-width"
											ng-model="data.step4.searchIdullco"
											required
											value="">
										<button ng-if="data.step4.searchIdullco" type="button"
											class="close buttonDeleteSelection"
											aria-label="Cancella Selezione"
											ng-click="cancellaSelezioneIdullco()">
											<span aria-hidden="true"><img
												src="assets/css/i/close.png" alt="close"></span>
										</button>
										<a href="#"
											ng-if="data.step4.searchIdullco"
											class="openpopup" ng-click="dettaglioOrdineGetIdullco($event)"><img
											src="assets/css/i/form_arrow.png" alt="form"></a>
										<div role="alert">
											<span
												ng-if="configurazioneOffertaForm.idullcoSearch.$invalid && configurazioneOffertaForm.$submitted"
												class="help-block help-width">Compila questo campo</span> <span
												ng-if="configurazioneOffertaForm.idullco.$invalid && configurazioneOffertaForm.$submitted"
												class="help-block help-width">Effettua la ricerca</span>
										</div>
									</div>
								</div>
		 <div class="form-group">
                    <label class="col-xs-5 control-label">DN </label>
                    <div class="col-xs-7">
                        <input  type="text"
                                name="dn"
                                class="form-control SB-width"
                                ng-model="data.step4.DN.dft"
                                >
                    </div>
    	 </div>
</div>
 

<div class="col-xs-12 madatory-field paddL0">
    <i>*Campo obbligatorio</i>
</div>
