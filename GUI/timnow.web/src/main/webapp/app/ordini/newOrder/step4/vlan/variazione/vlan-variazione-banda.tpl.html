<!-- RU_1058 -->
<ng-form name="bandaForm" novalidate ng-controller="vlanVariazioneStep4">
	<section class="form-process">	
		<div class="row">
			<div class="col-xs-12 paddL0 form-horizontal">
				<div class="form-group">
					<label class="col-xs-3 control-label">Codice TD KIT</label> <label
						class="col-xs-7 selected-item">{{_codiceTDKIT}}</label>
				</div>
				<div class="form-group">
					<label class="col-xs-3 control-label">Famiglia VLAN</label> <label
						class="col-xs-7 selected-item">{{_famigliaVlan}}</label>
				</div>
				<!-- SM_9794 -->
				<div class="form-group" ng-repeat="cos in _COS" ng-if="_famigliaVlan == 'VLAN MonoCoS Banda Condivisa'">
					<label class="col-xs-3 control-label">CoS</label>
					<label class="col-xs-7 selected-item">{{cos.dft}}</label>
				</div>
				<div class="form-group" ng-if="showBanda" ng-class="{ 'has-error' : configurazioneOffertaForm.bandaForm.banda.$invalid && configurazioneOffertaForm.$submitted }">
					<label class="col-xs-3 control-label">Banda<sup>*</sup></label>
					<div class="col-xs-7 selected-item">
						<!-- Task #33635 -->
						<select class="selectmenu SB-width form-control" name="banda"
							ng-model="customizedOffer.offerBotDetails[_indexBanda].dft" required>
							<option value=""></option>
							<option ng-repeat="value in arrayBanda" value="{{value}}">{{value}}</option>
						</select>
						<div role="alert">
							<span
								ng-if="configurazioneOffertaForm.bandaForm.banda.$error.required && configurazioneOffertaForm.$submitted"
								class="help-block help-width">Seleziona questo campo</span>
							<span ng-if="campiModificati['BANDA']" class="help-block help-width">Valore precedente: {{_banda}}</span>
						</div>
					</div>
				</div>
				<div class="form-group" ng-if="showProfiloBMC"
					ng-class="{ 'has-error' : configurazioneOffertaForm.bandaForm.profiloBmc.$invalid && configurazioneOffertaForm.$submitted }">
					<label class="col-xs-3 control-label">Profilo BMC<sup>*</sup></label>
					<div class="col-xs-7 selected-item">	
						<input type="text"
	                               class="form-control SB-width"
	                               ng-model="customizedOffer.offerTopDetails.PROFILOBMC.dft"
	                               name="profiloBmc"
	                    		   disabled>
	                    <a ng-href="#" class="openpopup" ng-click="configureProfiloBMC($event)">
	                       <img src="assets/css/i/form_arrow.png" alt="form">
	                    </a>
						<div role="alert">
							<span
								ng-if="configurazioneOffertaForm.bandaForm.profiloBmc.$error.required && configurazioneOffertaForm.$submitted"
								class="help-block help-width">Seleziona questo campo</span>
							<span ng-if="campiModificati['PROFILOBMC']" class="help-block help-width">Valore precedente: {{_profiloBMC}}</span>
						</div>
					</div>
				</div>
			</div>
		</div>
	</section>
</ng-form>
