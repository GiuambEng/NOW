<!--  RU_1058 -->
<form class="form-container" ng-submit="datiReferenteForm.$valid && submit_5()" name="datiReferenteForm" novalidate>
    <section class="form-process" ng-init="ref1_open = true">
        <div class="panel-body">
            <div class="col-xs-12 form-horizontal paddL0">
                <div class="form-group" ng-class="{ 'has-error' : datiReferenteForm.distrettoFisso.$invalid && !datiReferenteForm.distrettoFisso.$pristine}">
                    <label class="col-xs-3 control-label">Distretto Fisso</label>
                    <div class="col-xs-7">
                        <input type="text" class="form-control SB-width" name="distrettoFisso" ng-model="data.step5.datiReferenti[1].distrettoFisso" ng-pattern="alphanumeric" maxlength="4" ng-maxlength="4">
                        <div role="alert">
                        	<span ng-if="datiReferenteForm.distrettoFisso.$error.pattern" class="help-block help-width">Non inserire caratteri speciali</span>                            
                            <span ng-if="datiReferenteForm.distrettoFisso.$error.maxlength" class="help-block help-width">Inserire al massimo 4 caratteri</span>
                        </div>
                    </div>
                </div>
                <div class="form-group" ng-class="{ 'has-error' : datiReferenteForm.numeroFisso.$invalid && !datiReferenteForm.numeroFisso.$pristine }">
                    <label class="col-xs-3 control-label">Numero Fisso</label>
                    <div class="col-xs-7">
                        <input type="text" class="form-control SB-width" name="numeroFisso" ng-model="data.step5.datiReferenti[1].numeroFisso" ng-pattern="alphanumeric" maxlength="15" ng-maxlength="15">
                        <div role="alert">
                        	<span ng-if="datiReferenteForm.numeroFisso.$error.pattern" class="help-block help-width">Non inserire caratteri speciali</span>                             
                            <span ng-if="datiReferenteForm.numeroFisso.$error.maxlength" class="help-block help-width">Inserire al massimo 15 caratteri</span>
                        </div>
                    </div>
                </div>
                <div class="form-group" ng-class="{ 'has-error' : datiReferenteForm.distrettoMobile.$invalid && !datiReferenteForm.distrettoMobile.$pristine }">
                    <label class="col-xs-3 control-label">Distretto Mobile</label>
                    <div class="col-xs-7">
                        <input type="text" class="form-control SB-width" name="distrettoMobile" ng-model="data.step5.datiReferenti[1].distrettoMobile" ng-pattern="alphanumeric" maxlength="3" ng-maxlength="3">
                        <div role="alert"> 
                        	<span ng-if="datiReferenteForm.distrettoMobile.$error.pattern" class="help-block help-width">Non inserire caratteri speciali</span>                           
                            <span ng-if="datiReferenteForm.distrettoMobile.$error.maxlength" class="help-block help-width">Inserire al massimo 3 caratteri</span>
                        </div>
                    </div>
                </div>
                <div class="form-group" ng-class="{ 'has-error' : datiReferenteForm.numeroMobile.$invalid && !datiReferenteForm.numeroMobile.$pristine }">
                    <label class="col-xs-3 control-label">Numero Mobile</label>
                    <div class="col-xs-7">
                        <input type="text" class="form-control SB-width" name="numeroMobile" ng-model="data.step5.datiReferenti[1].numeroMobile" ng-pattern="alphanumeric" maxlength="15" ng-maxlength="15">
                        <div role="alert">
                            <span ng-if="datiReferenteForm.numeroMobile.$error.pattern" class="help-block help-width">Non inserire caratteri speciali</span>
                            <span ng-if="datiReferenteForm.numeroMobile.$error.maxlength" class="help-block help-width">Inserire al massimo 15 caratteri</span>
                        </div>
                    </div>
                </div>
                <div ng-init="data.step5.datiReferenti[1].progressivo = '1'"></div>
                <div ng-init="data.step5.datiReferenti[1].qualifica = 'O'"></div>
            </div>
        </div>

        <div class="col-xs-12 madatory-field paddL0">
            <i>*Campo obbligatorio</i>
        </div>
    </section>
    <section class="form-button">
        <button class="btn btn-disabled" type="button" ng-click="confermaAnnulla()">Annulla</button>
        <button class="btn btn-disabled" type="button" ng-click="goTo()">indietro
        </button>
        <button ng-if="isAuthorized('Ordini','Ordini in Bozza') && !bozza.nomeBozza" class="btn blue-btn" type="submit" ng-click="salvaBozza()">Salva in Bozza</button>
        <button ng-if="isAuthorized('Ordini','Ordini in Bozza') && bozza.nomeBozza" class="btn blue-btn" type="button" ng-click="salvaBozza('aggiorna')">Aggiorna Bozza</button>
        <button class="btn blue-btn" type="submit" ng-click="valida(datiReferenteForm)">Avanti</button>
    </section>
</form>
