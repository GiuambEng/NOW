<!-- RU_1462 -->
<div class="modal-wrap code-block">
	<ng-form name="nuovoApparatoForm" class="form-container" novalidate>
	<div class="modal-header">
		<button type="button" class="close" data-dismiss="modal"
			aria-label="Close" ng-click="$ctrl.chiudi()">
			<span aria-hidden="true"><img src="assets/css/i/close.png"
				alt="close"></span>
		</button>
		<h4 class="modal-title">Nuovo Apparato per Servizio
			{{$ctrl.servizio.indexServizio + 1}}</h4>
	</div>
	<div class="modal-body">
		<section class="form-process">
			<div class="row">
				<div class="col-xs-12 form-horizontal paddL0">
					<div class="form-group"
						ng-class="{ 'has-error' : (nuovoApparatoForm.codice_apparato.$invalid && nuovoApparatoForm.$submitted) }">
						<label class="col-xs-3 control-label">Codice Apparato<sup>*</sup></label>
						<div class="col-xs-7 selected-item">
							<input type="text" class="form-control SB-width" ng-click="$ctrl.searchCodiceApparato($event)"
								name="codice_apparato" ng-model="$ctrl.apparato.codiceApparato" placeholder="Clicca su questo campo e seleziona"
								required readonly>
							<div role="alert">
								<span
									ng-if="nuovoApparatoForm.codice_apparato.$invalid && nuovoApparatoForm.$submitted"
									class="help-block help-width">Compila questo campo</span>
							</div>
						</div>
					</div>
					<div class="form-group"
						ng-class="{ 'has-error' : (nuovoApparatoForm.password_apparato.$invalid && nuovoApparatoForm.$submitted) }">
						<label class="col-xs-3 control-label">Password Apparato</label>
						<div class="col-xs-7">
							<input type="text" class="form-control SB-width"
								name="password_apparato"
								ng-model="$ctrl.apparato.passwordApparato" ng-maxlength="50"
								maxlength="50">
							<div role="alert">
								<span
									ng-if="nuovoApparatoForm.password_apparato.$error.maxlength"
									class="help-block help-width">Inserire al massimo 50
									caratteri</span>
							</div>
						</div>
					</div>
					<div class="form-group"
						ng-class="{ 'has-error' : (nuovoApparatoForm.tipologia_apparato.$invalid && nuovoApparatoForm.$submitted) }">
						<label class="col-xs-3 control-label">Tipologia Apparato<sup>*</sup></label>
						<div class="col-xs-7">
							<input type="text" class="form-control SB-width"
								name="tipologia_apparato"
								ng-model="$ctrl.apparato.tipologiaApparato" ng-maxlength="100"
								maxlength="100" required readonly>
							<div role="alert">
								<span
									ng-if="nuovoApparatoForm.tipologia_apparato.$invalid && nuovoApparatoForm.$submitted"
									class="help-block help-width">Compila questo campo</span> <span
									ng-if="nuovoApparatoForm.tipologia_apparato.$error.maxlength"
									class="help-block help-width">Inserire al massimo 100
									caratteri</span>
							</div>
						</div>
					</div>
					<div class="form-group"
						ng-class="{ 'has-error' : (nuovoApparatoForm.azione_apparato.$invalid && nuovoApparatoForm.$submitted) }">
						<label class="col-xs-3 control-label">Azione Apparato<sup>*</sup></label>
						<div class="col-xs-7">
							<select name="azione_apparato"
								class="selectmenu form-control SB-width"
								ng-model="$ctrl.apparato.azioneApparato" required>
								<option value></option>
								<option value="0">Consegna</option>
								<option value="1">Consegna e installazione</option>
								<option value="2">Solo installazione</option>
							</select>
							<div role="alert">
								<span
									ng-if="nuovoApparatoForm.azione_apparato.$error.required && nuovoApparatoForm.$submitted"
									class="help-block help-width">Compila questo campo</span>
							</div>
						</div>
					</div>
					<div class="form-group"
						ng-class="{ 'has-error' : (nuovoApparatoForm.qta_apparato.$invalid && nuovoApparatoForm.$submitted) }">
						<label class="col-xs-3 control-label">QTA Apparato<sup>*</sup></label>
						<div class="col-xs-7">
							<input type="number" class="form-control SB-width"
								onkeydown="return false" name="qta_apparato"
								ng-model="$ctrl.apparato.qtaApparato" min="1" max="99" required>
							<div role="alert">
								<span
									ng-if="nuovoApparatoForm.qta_apparato.$invalid && nuovoApparatoForm.$submitted"
									class="help-block help-width">Compila questo campo</span>
							</div>
						</div>
					</div>
					<div class="form-group"
						ng-class="{ 'has-error' : (nuovoApparatoForm.causale_apparato.$invalid && nuovoApparatoForm.$submitted) }">
						<label class="col-xs-3 control-label">Causale</label>
						<div class="col-xs-7">
							<textarea name="causale_apparato" cols="30" rows="5"
								class="form-control" ng-model="$ctrl.apparato.causale"
								ng-maxlength="255"></textarea>
							<div role="alert">
								<span
									ng-if="nuovoApparatoForm.password_apparato.$error.maxlength"
									class="help-block help-width">Inserire al massimo 50
									caratteri</span>
							</div>
						</div>
					</div>
				</div>
			</div>
		</section>
		<div class="col-xs-12 madatory-field paddL0">
			<i>*Campo obbligatorio</i>
		</div>
	</div>
	<div class="modal-footer">
		<section class="form-button">
			<button class="btn btn-disabled" type="button"
				ng-click="$ctrl.chiudi()">Annulla</button>
			<button class="btn blue-btn" type="button"
				ng-disabled="!nuovoApparatoForm.$valid" ng-click="$ctrl.aggiungi()">Aggiungi</button>
		</section>
	</div>
	</ng-form>
</div>
