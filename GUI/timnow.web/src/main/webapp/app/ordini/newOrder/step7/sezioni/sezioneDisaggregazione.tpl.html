<ng-form name="datiDisaggregazioneForm" class="form-container"
	novalidate>
	<fieldset ng-keyup="isDisaggregazioneRequired(datiDisaggregazioneForm)">
		<div class="panel-body">
			<div class="row">
				<div class="col-xs-6 form-horizontal">
					<div class="form-group"
						ng-class="{ 'has-error' : datiDisaggregazioneForm.systemUnico.$invalid && dettaglioOrdineForm.$submitted }">
						<label class="col-xs-5 control-label">System Unico<sup ng-if="isDisaggregazioneRequiredFlag">*</sup></label>
						<div class="col-xs-7">
							<select name="systemUnico"
								class="selectmenu form-control SB-width"
								ng-model="data.step7.datiDisaggregazione.systemUnico" ng-required="isDisaggregazioneRequiredFlag">
								<option value></option>
								<option ng-repeat="system in listSystemUnico track by $index"
									value="{{system}}">{{system}}</option>
							</select>
							<div role="alert">
								<span
									ng-if="datiDisaggregazioneForm.systemUnico.$error.required && dettaglioOrdineForm.$submitted"
									class="help-block help-width">Compila questo campo</span>
								<span ng-if="erroreSystemUnico" class="help-block help-width red">{{erroreSystemUnico}}<span>
							</div>
						</div>
					</div>
				</div>
				<div class="col-xs-6 form-horizontal paddL0" ng-if="showSezionePerLNA">
					<div class="form-group"
						ng-class="{ 'has-error' : datiDisaggregazioneForm.noteSu.$invalid && dettaglioOrdineForm.$submitted }">
						<label class="col-xs-5 control-label">Note SU</label>
						<div class="col-xs-7">
							<textarea name="noteSu" cols="30" rows="5" id="noteSu"
								placeholder="Inserisci eventuali note"
								class="form-control SB-width"
								ng-model="data.step7.datiDisaggregazione.noteSu"
								ng-maxlength="255"></textarea>
							<div role="alert">
								<span ng-if="datiDisaggregazioneForm.noteSu.$error.maxlength"
									class="help-block help-width">Inserire al massimo 255
									caratteri</span>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</fieldset>
</ng-form>
