<ng-form name="datiSlaPlusSuForm" class="form-container" novalidate>
	<fieldset ng-disabled="slaPlusSuDisabled" ng-mouseup="isSlaPlusSuRequired(datiSlaPlusSuForm)" ng-keyup="isSlaPlusSuRequired(datiSlaPlusSuForm)">
		<div class="panel-body">
			<div class="row" ng-if="slaPlusSuDisabled">
				<div class="col-xs-12 form-horizontal">
					<div class="form-group">
						<label class="col-xs-12 help-block help-width red" ng-if="!isOffertaSemiGPON"> Per
							abilitare i campi della sezione, compilare correttamente la
							sezione Disaggregazione. </label>
						<!-- RU1393 -->
						<label class="col-xs-12 help-block help-width red" ng-if="isOffertaSemiGPON"> Per
							abilitare i campi della sezione, compilare correttamente la
							sezione Gestione Autonoma. </label>
					</div>
				</div>
			</div>			
			<div class="row">
				<div class="col-xs-6 form-horizontal">
					<div class="form-group"
						ng-class="{ 'has-error' : datiSlaPlusSuForm.flagSlaPlusSu.$invalid && dettaglioOrdineForm.$submitted }">
						<label class="col-xs-5 control-label">Flag Sla Plus SU<sup ng-if="isSlaPlusSuRequiredFlag">*</sup></label>
						<div class="col-xs-7">
							<input type="checkbox" name="flagSlaPlusSu"
								ng-model="data.step7.datiSlaPlusSu.flagSlaPlusSu" ng-required="isSlaPlusSuRequiredFlag" />
							<div role="alert">	                                                	                                                
		                       <span ng-if="datiSlaPlusSuForm.flagSlaPlusSu.$error.required && dettaglioOrdineForm.$submitted" class="help-block help-width">Compila questo campo</span>
		                    </div>
						</div>
					</div>
				</div>
				<div class="col-xs-6 form-horizontal paddL0">
					<div class="form-group"
						ng-class="{ 'has-error' : datiSlaPlusSuForm.valoreSla.$invalid && dettaglioOrdineForm.$submitted }">
						<label class="col-xs-5 control-label">Valore SLA<sup ng-if="isSlaPlusSuRequiredFlag">*</sup></label>
						<div class="col-xs-7">
							<input type="text" name="valoreSla" class="form-control SB-width"
								ng-model="data.step7.datiSlaPlusSu.valoreSla" ng-maxlength="50"
								ng-required="isSlaPlusSuRequiredFlag">
							<div role="alert">
								<span
									ng-if="datiSlaPlusSuForm.valoreSla.$error.required && dettaglioOrdineForm.$submitted"
									class="help-block help-width">Compila questo campo</span> <span
									ng-if="datiSlaPlusSuForm.valoreSla.$error.maxlength"
									class="help-block help-width">Inserire al massimo 50
									caratteri</span>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</fieldset>
</ng-form>
