<ng-form name="datiClusterForm" class="form-container"
	novalidate>
	<fieldset ng-keyup="false">
		<div class="panel-body">
			<div class="row">
				<div class="col-xs-6 form-horizontal">
					<div class="form-group">
						<label class="col-xs-5 control-label">Cluster Accesso</label>
						<div class="col-xs-7">
							<select name="clusterAccesso"
								class="selectmenu form-control SB-width"
								ng-model="data.step7.clusterAccesso" ng-required="false">
								<option ng-repeat="cluster in listCluster track by $index"
									value="{{cluster}}">{{cluster}}</option>
							</select>
						</div>
					</div>
				</div>
			</div>
		</div>
	</fieldset>
</ng-form>
