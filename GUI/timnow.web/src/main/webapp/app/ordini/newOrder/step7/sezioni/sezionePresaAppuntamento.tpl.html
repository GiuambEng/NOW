<ng-form name="datiPresaAppuntamentoForm" class="form-container"
	novalidate>
	<fieldset ng-disabled="presaAppuntamentoDisabled" ng-mouseup="isPresaAppuntamentoRequired(datiPresaAppuntamentoForm)" ng-keyup="isPresaAppuntamentoRequired(datiPresaAppuntamentoForm)">
		<div class="panel-body">
			<div class="row" ng-if="presaAppuntamentoDisabled && !isOffertaSemiGPON">
				<div class="col-xs-12 form-horizontal">
					<div class="form-group">
						<label class="col-xs-12 help-block help-width red"> Per
							abilitare i campi della sezione, compilare correttamente la
							sezione Disaggregazione. </label>
					</div>
				</div>
			</div>
			<!-- RU_1393 -->
			<div class="row" ng-if="presaAppuntamentoDisabled && isOffertaSemiGPON">
				<div class="col-xs-12 form-horizontal">
					<div class="form-group">
						<label class="col-xs-12 help-block help-width red"> Per
							abilitare i campi della sezione, compilare correttamente la
							sezione Gestione Autonoma. </label>
					</div>
				</div>
			</div>
			<div class="row">
				<div class="col-xs-6 form-horizontal">
					<div class="form-group"
						ng-class="{ 'has-error' : datiPresaAppuntamentoForm.ownerPresaAppuntamento.$invalid && dettaglioOrdineForm.$submitted }">
						<label class="col-xs-5 control-label">Owner Presa
							Appuntamento</label>
						<div class="col-xs-7">
							<select class="form-control selectmenu SB-width"
								name="ownerPresaAppuntamento"
								ng-model="data.step7.datiAppuntamentoDisaggregazione.ownerPresaAppuntamento">
								<option value>Selezionare</option>
								<option value="OP">OP</option>
								<option value="SU">SU</option>
								<!-- SM_11217 -->
								<option value="TI" ng-if="showOwnerPresaAppuntamentoTI">TI</option>
							</select>
						</div>
					</div>
				</div>
				<div class="col-xs-6 form-horizontal paddL0">
					<div class="form-group"
						ng-class="{ 'has-error' : datiPresaAppuntamentoForm.dataAppuntamento.$invalid && dettaglioOrdineForm.$submitted }">
						<label class="col-xs-5 control-label">Data Appuntamento<sup ng-if="isPresaAppuntamentoRequiredFlag">*</sup></label>
						<div class="col-xs-7">
							<input type="text" name="dataAppuntamento"
								class="form-control SB-width selectDate" ng-click="openDP4()"
								uib-datepicker-popup="{{format}}" is-open="popup_dp4.opened"
								datepicker-options="dateOptions" close-text="Chiudi"
								alt-input-formats="altInputFormats"
								ng-model="data.step7.datiAppuntamentoDisaggregazione.dataAppuntamento"
								ng-maxlength="10" ng-required="isPresaAppuntamentoRequiredFlag">
							<div role="alert">
								<span
									ng-if="datiPresaAppuntamentoForm.dataAppuntamento.$error.required && dettaglioOrdineForm.$submitted"
									class="help-block help-width">Compila questo campo</span> <span
									ng-if="datiPresaAppuntamentoForm.dataAppuntamento.$error.maxlength"
									class="help-block help-width">Inserire al massimo 10
									caratteri</span>
							</div>
						</div>
					</div>
				</div>
			</div>
			<div class="row">
				<div class="col-xs-6 form-horizontal">
					<div class="form-group"
						ng-class="{ 'has-error' : datiPresaAppuntamentoForm.fasciaOraria.$invalid && dettaglioOrdineForm.$submitted }">
						<label class="col-xs-5 control-label">Fascia Oraria<sup ng-if="isPresaAppuntamentoRequiredFlag">*</sup></label>
						<div class="col-xs-7">
							<select class="form-control selectmenu SB-width"
								name="fasciaOraria"
								ng-model="data.step7.datiAppuntamentoDisaggregazione.fasciaOraria"
								ng-required="isPresaAppuntamentoRequiredFlag">
								<option value>Selezionare</option>
								<!-- SM_9212 -->
								<option ng-repeat="(key,value) in timeSlotPresaAppuntamento" value="{{ key }}">{{value}}</option>
							</select>
							<div role="alert">
								<span
									ng-if="datiPresaAppuntamentoForm.fasciaOraria.$error.required && dettaglioOrdineForm.$submitted"
									class="help-block help-width">Compila questo campo</span>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</fieldset>
</ng-form>
