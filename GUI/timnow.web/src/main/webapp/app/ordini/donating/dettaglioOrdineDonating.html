<div class="content-section">
    <section class="form-heading">
        <h1>Notifiche e Riscontro Codice Sessione Donating</h1>
    </section>
    <div class="order-summary">
        <button class="btn btn-disabled turn-back pull-left" type="submit" ng-click="backToList()">&#60; indietro</button>
    <uib-tabset active="activeJustified" justified="true">
        <uib-tab index="0" heading="Richieste" id="tab-1" class="nowrap">
    <section class="order-summary">
            <now-table
                    dati="richieste"
                    custom-header="headerListRequestRequest"
                    tipologia="tipologiaEsiti"
                    is-large-with-h-scroll="true"
                    show-spinner="listLoaded">
            </now-table>
    </section>
        </uib-tab>

        <uib-tab index="1" heading="Notifiche" id="tab-2" class="nowrap">
    <section class="order-summary">

        <now-table
                dati="notifiche"
                custom-header="headerListRequestNotification"
                tipologia="tipologiarichieste"
                is-large-with-h-scroll="true"
                show-spinner="listLoaded">
        </now-table>
        <div class="row data-table " >

            <div ng-if="(isAuthorized('Ordini','Nuova Richiesta'))" style="padding:10px;">
                <button ng-click="nuovaRichiesta()" ng-disabled="richiestaDisabilitata">Nuova Richiesta +</button>
            </div>
        </div>
    </section>
        </uib-tab>
    </uib-tabset>
    </div>
</div>
