<!------------------------- FORM HEADING SECTION START ----------------------------- -->
<div class="content-section">
    <section class="form-heading">
        <h1>Ordini Donating</h1>
    </section>
    <section class="user-content">
        <form class="form-horizontal">
            <div class="form-group">
                <label class="control-label col-sm-2">Codice Ordine TI</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" name="codice-ordine" ng-model="filters.codiceOrdine" />
                </div>
            </div>
            <div class="form-group">
                <label class="control-label col-sm-2">Nome File Notifica</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" name="nome-file" ng-model="filters.nomeFile" />
                </div>
            </div>
            <div class="form-group">
                <label class="control-label col-sm-2">ID Risorsa</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" name="id-risorsa" ng-model="filters.idRisorsa" />
                </div>
            </div>
            <div class="form-group">
                <label class="control-label col-sm-2">Codice Sessione</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" name="codice-sessione" ng-model="filters.codiceSessione" />
                </div>
            </div>
            <div class="form-group">
                <div class="col-sm-offset-2 col-sm-10">
                    <button type="submit" class="btn btn-disabled" ng-disabled="!(filters.codiceOrdine || filters.nomeFile || filters.idRisorsa || filters.codiceSessione)" ng-click="search()">Ricerca</button>
                    <button type="submit" class="btn btn-disabled" ng-show="(filters.codiceOrdine || filters.nomeFile || filters.idRisorsa || filters.codiceSessione)" ng-click="clearSearch()">Pulisci</button>                
                </div>
            </div>
        </form>
    </section>
    <section class="user-content" ng-show="listLoaded">
        <now-table 
            dati="list" 
            custom-header="listHeaders" 
            tipologia="tipologia"
            row-selection-callback="getDetail"
            show-spinner="!loading"
            > 
        </now-table>
    </section>
</div>
