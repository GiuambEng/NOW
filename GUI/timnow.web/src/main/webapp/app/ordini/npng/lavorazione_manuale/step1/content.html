<div class="content-section">
    <section class="form-heading">
        <h1>Lavorazione Manuale NPNG</h1>
    </section>

    <section class="process-steps-wrapper">
        <div class="process-steps-wrapper">
            <div class="process-steps-label">
                <span class="steps"><strong>Ricerca<br>ordine</strong></span>
                <span class="steps">Lavorazione<br>ordine</span>
                <span class="steps">Conferma<br>ordine</span>
            </div>

            <div class="process-steps step-8">
                <span><em class="active">1</em></span><span class="line grey">&nbsp;</span>
                <span><em class="inactive">2</em></span><span class="line grey">&nbsp;</span>
                <span><em class="inactive">3</em></span>
            </div>
        </div>
    </section>

    <form ng-submit="ricercaOrdineForm.$valid && submit_1()" class="form-container" name="ricercaOrdineForm" novalidate>
        <section class="form-process">
         <div ng-if="loadOLO" class="spinner_container_direttiva">
			<span us-spinner="{radius:18, width:3, length: 14}"></span>
		</div>
            <div class="col-xs-6 form-horizontal paddL0">                

                <div class="form-group">
                     <label class="col-xs-5 control-label">OAO<span ng-if="loadOAO" us-spinner="{radius:5, width:1, length: 5}"></span></label>
                    <div class="col-xs-7">
                        <select ng-options="item.codiceOLO for item in listaOlo track by item.codiceOLO"
                                class="selectmenu SB-width form-control"
                                name="operatore"
                                ng-model="data.step1.oao">
                        </select>
                    </div>
                </div>
                
                <div class="form-group" ng-class="{ 'has-error' : ricercaOrdineForm.codOrdineOlo.$invalid && !ricercaOrdineForm.codOrdineOlo.$pristine }">
                    <label class="col-xs-5 control-label">Codice Ordine OLO</label>
                    <div class="col-xs-7">
                        <input type="text"
                               name="codOrdineOlo"
                               class="form-control SB-width"
                               ng-model="data.step1.codOrdineOlo"
                               ng-required="(!data.step1.codOrdineTi || data.step1.codOrdineTi == '') && (!data.step1.dn || data.step1.dn == '')"/>
                        <div role="alert">
                            <span ng-if="ricercaOrdineForm.codOrdineOlo.$error.required && !ricercaOrdineForm.codOrdineOlo.$pristine" 
                            	class="help-block help-width">Digitare uno dei campi di ricerca</span>
                        </div>
                    </div>
                </div>
                
            </div>
            <div class="col-xs-6 form-horizontal">

                <div class="form-group" ng-class="{ 'has-error' : ricercaOrdineForm.codOrdineTi.$invalid && !ricercaOrdineForm.codOrdineTi.$pristine }">
                    <label class="col-xs-5 control-label">Codice Ordine TI</label>
                    <div class="col-xs-7">
                        <input type="text" class="form-control SB-width"
                               name="codOrdineTi"
                               ng-model="data.step1.codOrdineTi"/
                               ng-required="(!data.step1.codOrdineOlo || data.step1.codOrdineOlo == '') && (!data.step1.dn || data.step1.dn == '')">
                        <div role="alert">
                            <span ng-if="ricercaOrdineForm.codOrdineTi.$error.required && !ricercaOrdineForm.codOrdineTi.$pristine" 
                            	class="help-block help-width">Digitare uno dei campi di ricerca</span>
                        </div>
                    </div>
                </div>
                
                <div class="form-group" ng-class="{ 'has-error' : ricercaOrdineForm.dn.$invalid && !ricercaOrdineForm.dn.$pristine }">
                    <label class="col-xs-5 control-label">DN</label>
                    <div class="col-xs-7">
                        <input type="text" class="form-control SB-width"
                               name="dn"
                               ng-model="data.step1.dn"
                               ng-required="(!data.step1.codOrdineOlo || data.step1.codOrdineOlo == '') && (!data.step1.codOrdineTi || data.step1.codOrdineTi == '')"/>
                        <div role="alert">
                            <span ng-if="ricercaOrdineForm.dn.$error.required && !ricercaOrdineForm.dn.$pristine" 
                            	class="help-block help-width">Digitare uno dei campi di ricerca</span>
                        </div>
                    </div>
                </div>
                
            </div>
            <div class="col-xs-12 madatory-field paddL0">
                <i>*Campo obbligatorio</i>
            </div>
        </section>
        <section class="form-button">
        	<button class="btn blue-btn" ng-click="annulla()">Annulla</button>
	        <button class="btn blue-btn" ng-disabled="ricercaOrdineForm.$invalid" type="submit">Avanti</button>
		 </section>
    </form>
</div>
