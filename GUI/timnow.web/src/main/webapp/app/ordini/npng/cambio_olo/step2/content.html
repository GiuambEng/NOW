<div class="content-section">
	<section class="form-heading">
		<h1>Ordine Cambio OLO</h1>
	</section>

	<section class="process-steps-wrapper">
		<div class="process-steps-label">
			<span class="steps">Ricerca<br>risorsa</span> 
			<span class="steps"><strong>Visualizzazione<br>consistenza</strong></span>
			<span class="steps">Conferma<br>ordine</span>
		</div>

		<div class="process-steps step-8">
			<span><em class="processed"></em></span><span class="line blue">&nbsp;</span>
			<span><em class="active">2</em></span><span class="line grey">&nbsp;</span>
			<span><em class="inactive">3</em></span>
		</div>
	</section>

	<div ng-if="loadRisorsaNpng" class="spinner_container_direttiva">
		<span us-spinner="{radius:18, width:3, length: 14}"></span>
	</div>

	<!-- DATI STATICI -->
	<section class="order-summary">
		<table class="table-detail">
			<tbody>
				<tr>
					<td>DN:</td>
					<td class="highlight"><span class="span-highlight">{{data.step2.dn}}</span></td>
					<td></td>
					<td>OLO:</td>
					<td class="highlight"><span class="span-highlight">{{data.step2.olo}}</span></td>
				</tr>
				<tr>
					<td>Stato:</td>
					<td class="highlight"><span class="span-highlight">{{data.step2.stato}}</span></td>
					<td></td>
					<td>Opzione Traffico:</td>
					<td class="highlight"><span class="span-highlight">{{data.step2.opzioneTraffico}}</span></td>
				</tr>
				<tr>
					<td>Tipologia Provisioning:</td>
					<td class="highlight"><span class="span-highlight">{{data.step2.tipologiaProvisioning}}</span></td>
					<td></td>
					<td></td>
					<td></td>
				</tr>
			</tbody>
		</table>
	</section>

	<form ng-submit="visualizzazioneConsistenzaForm.$valid && submit_2()"
		class="form-container" name="visualizzazioneConsistenzaForm"
		novalidate>
		<section class="form-process">
			<div class="col-xs-6 form-horizontal ">
				<div class="form-group">
					<label class="col-xs-5 control-label">Nuovo OLO<sup>*</sup></label>
					<div class="col-xs-7 selected-item">
						<select class="selectmenu SB-width form-control" required
							name="nuovoOlo" ng-model="olo"
							ng-options="item.codiceOLO for item in listaOlo track by item.codiceOLO">
						</select>
					</div>
				</div>

				<div class="form-group">
					<label class="col-xs-5 control-label">Data Cut Over<sup>*</sup></label>
					<div class="col-xs-7">
						<input type="text" name="dac"
							class="form-control SB-width selectDate"
							ng-click="dataCutOverConfig.open()"
							uib-datepicker-popup="{{dataCutOverConfig.format}}"
							ng-model="dataCutOver" is-open="dataCutOverConfig.popupOpened"
							datepicker-options="dataCutOverConfig.dateOptions" close-text="Chiudi"
							alt-input-formats="altInputFormats"
							required>
					</div>
				</div>
			</div>
			<div class="col-xs-12 madatory-field ">
				<i>*Campo obbligatorio</i>
			</div>
		</section>
		<section class="form-button">
			<button class="btn blue-btn" ng-click="annulla()">Annulla</button>
			<button class="btn blue-btn" ng-click="indietro()">Indietro</button>
			<span ng-if="showLoader"><img src="assets/i/loading.gif" /></span>
			<button class="btn blue-btn"
				ng-disabled="visualizzazioneConsistenzaForm.$invalid || showLoader" type="submit">Conferma</button>
		</section>
	</form>
</div>
