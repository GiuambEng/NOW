<div class="content-section">
    <section class="form-heading">
        <h1>Ordine Cambio OLO</h1>
    </section>

    <section class="process-steps-wrapper">
        <div class="process-steps-wrapper">
            <div class="process-steps-label">
                <span class="steps"><strong>Ricerca<br>risorsa</strong></span>
                <span class="steps">Visualizzazione<br>consistenza</span>
                <span class="steps">Conferma<br>ordine</span>
            </div>

            <div class="process-steps step-8">
                <span><em class="active">1</em></span><span class="line grey">&nbsp;</span>
                <span><em class="inactive">2</em></span><span class="line grey">&nbsp;</span>
                <span><em class="inactive">3</em></span>
            </div>
        </div>
    </section>

    <form ng-submit="ricercaAssetForm.$valid && submit_1()" class="form-container" name="ricercaAssetForm" novalidate>
        <section class="form-process">
            <div class="col-xs-6 form-horizontal paddL0">
                <div class="form-group" ng-class="{ 'has-error' : ricercaAssetForm.dn.$invalid && !ricercaAssetForm.dn.$pristine }">
                    <label class="col-xs-5 control-label">DN<sup>*</sup><span ng-if="loadAsset" us-spinner="{radius:5, width:1, length: 5}"></span></label>
                    <div class="col-xs-7">
                        <input type="text"
                               name="dn"
                               class="form-control SB-width"
                               ng-model="data.step1.dn"
                               required/>
                        <div role="alert">
                            <span ng-if="ricercaAssetForm.dn.$error.required && !ricercaAssetForm.dn.$pristine" 
                            	class="help-block help-width">Compila questo campo</span>
                        </div>
                    </div>
                </div>                
            </div>
            
            <div class="col-xs-12 madatory-field paddL0">
                <i>*Campo obbligatorio</i>
            </div>
        </section>
        <section class="form-button">
        	<button class="btn blue-btn" ng-click="annulla()">Annulla</button>
	        <button class="btn blue-btn" ng-disabled="ricercaAssetForm.$invalid" type="submit">Avanti</button>
		 </section>
    </form>
</div>
