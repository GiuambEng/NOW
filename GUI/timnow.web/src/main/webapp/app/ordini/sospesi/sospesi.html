<div class="content-section">
      <section class="form-heading">
            <h1>Lista Ordini Sospesi</h1>
        </section>
        <!-- SM_8904 -->
        <now-export-file 
		ng-if="orders.length>0"
		export-callback="iniziaExport"
		vista="$root.VIEW.SOSPESI">
	</now-export-file>
     <div style="clear:both">
        <now-advanced-search
		 dati-to-search="paramToSearch"
		 title="ricerca avanzata"
		 titolo="tipologia"
		 callback="getSearchAdvanced()"
		 cod-funzione="tipologiaRicerca"
		></now-advanced-search>
            <now-table 
			dati="orders" 
			custom-header="headerList"
			tipologia="tipologia"					
			show-spinner="datiLoaded"
			is-large-with-h-scroll="true"
			row-selection-callback="getDettaglioOrdini" 
			></now-table>
	</div>
</div>
