<div class="page-container" style="padding: 15px;">
	<div class="content-section">

		<section class="order-summary">
			<div id="tabs">

				<h3>Dettaglio Servizio {{title}}</h3>
				<table class="table-detail">
					<tbody>
						<!-- RU_915 -->
						<tr ng-repeat="customizzazione in items" ng-if="!(title == 'ACCESSOCPS' && customizzazione.attribute == 'FLAG_RECLAMO' && $root.isDGUser())">
							<td>{{customizzazione.attribute}}:</td>
							<td></td>
							<td class="highlight">{{customizzazione.value}}</td>
							<td class="highlight" style="font-weight: bold;">{{customizzazione.valueOld}}</td>
							<td></td>
						</tr>
					</tbody>
				</table>
			</div>
			<hr>
			<div class="tab-bottom">
				<button class="btn btn-disabled" ng-click="cancel()">Chiudi</button>
			</div>
		</section>
	</div>
</div>
