<div class="page-container" style="padding: 15px;">
	<div class="content-section">
		<section class="order-summary">
			<div id="tabs">
				<h3>{{title}}</h3>
				<div class="data-table table-fixed">
					<table class="table table-hover">
						<thead>
							<tr>
								<th>Nome</th>
								<th>Valore</th>
							</tr>
						</thead>
						<tbody>
							<tr class="accordion-toggle contract_row"
								ng-if="items.length>0"
								ng-repeat="item in items">
								<td>{{item.nome}}</td>
								<td>{{item.richiestadettagliovalore}}</td>
							</tr>
							<tr class="accordion-toggle contract_row"
								ng-if="!items.length>0" style="text-align: center;">
								<td colspan="2">Nessun dettaglio per l'elemento selezionato</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
			<hr>
			<div class="tab-bottom">
				<button class="btn btn-disabled" ng-click="cancel()">Chiudi</button>
			</div>
		</section>
	</div>
</div>
