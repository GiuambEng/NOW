<div class="content-section">
	<section class="form-heading form-border">
		<a href="#" ui-sref="root.ihelp({ihelps:ihelps})" class="nav-back">tutti
			gli iHELP</a>
		<h1>iHELP</h1>
	</section>
	<div ng-if="loadComplete" class="spinner_container_direttiva">
		<span us-spinner="{radius:18, width:3, length: 14}"></span>
	</div>
	<section class="user-content user-wrapper"
		ng-repeat="item in ihelps | filter : {visibile : true} as filteredItems"
		ng-show="$index == ihelpVisible">
		<h4>{{item.titolo}}</h4>
		<div>{{item.contenuto}}</div>
	</section>
	<section class="form-button">
		<button ng-disabled="ihelpVisible <= 0"
			ng-click="ihelpVisible = ihelpVisible - 1"
			class="btn btn-disabled btn-normal">iHELP PRECEDENTE</button>
		<button ng-disabled="ihelpVisible >= (filteredItems.length - 1)"
			ng-click="ihelpVisible = ihelpVisible + 1 "
			class="btn btn-disabled btn-normal">iHELP SUCCESSIVA</button>
	</section>
</div>
