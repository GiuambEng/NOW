<div class="content-section">
	<section class="form-heading form-border">
		<h1>iHELP</h1>
		<div ng-if="loadComplete" class="spinner_container_direttiva">
			<span us-spinner="{radius:18, width:3, length: 14}"></span>
		</div>
		<h2 ng-if="!ihelps.length>0 && !loadComplete">Non ci sono iHELP</h2>
	</section>
	<section class="user-help" ng-if="ihelps.length>0">
		<div>
			<section class="row"
				style="border-bottom: 1px solid #c8c8c8; padding-bottom: 5px;">
				<div class="col-xs-11 form-horizontal">
					<div class="form-group" ng-if="collapse">
						<label class="col-xs-5 control-label">Ricerca per titolo</label>
						<div class="col-xs-7">
							<input type="text" name="titolo" class="form-control SB-width"
								ng-model="search.titolo">
						</div>
					</div>
				</div>
				<div class="col-xs-1 form-horizontal">
					<a href="#" ng-click="$event.preventDefault();collapse=!collapse ">
						<img ng-if="!collapse" src="assets/css/i/zoom-icon.png" alt="zoom">
						<img ng-if="collapse" src="assets/css/i/no-zoom-icon.png"
						alt="zoom">
					</a>
				</div>
			</section>
		</div>
		<div class="user-qtn"
			ng-repeat="item in ihelps | filter : {visibile : true} | filter :search">
			<div class="user-data">{{item.titolo}}</div>
			<div class="button-wrapper">
				<a href="#"
					ui-sref="root.ihelp.dettaglio({idIHelp : $index, ihelps : ihelps})"
					class="read-btn">leggi</a>
			</div>
		</div>
		<div class="clear"></div>
	</section>
</div>
