<div class="content-section">
	<section class="form-heading form-border">
		<a href="#" ui-sref="root.faq({faqs:faqs})" class="nav-back">tutte le FAQ </a>
		<h1>FAQ</h1>
	</section>
	<div ng-if="loadComplete" class="spinner_container_direttiva">
		<span us-spinner="{radius:18, width:3, length: 14}"></span>
	</div>
	<section class="user-content user-wrapper"
		ng-repeat="item in faqs | filter : {visible : true} as filteredItems"
		ng-show="$index == faqVisible">
		<h4>{{item.question}}</h4>
		<div>{{item.answer}}</div>
	</section>
	<section class="form-button">
		<button ng-disabled="faqVisible <= 0"
			ng-click="faqVisible = faqVisible - 1"
			class="btn btn-disabled btn-normal">FAQ PRECEDENTE</button>
		<button ng-disabled="faqVisible >= (filteredItems.length - 1)"
			ng-click="faqVisible = faqVisible + 1 "
			class="btn btn-disabled btn-normal">FAQ SUCCESSIVA</button>
	</section>
</div>
