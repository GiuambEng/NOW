<div class="content-section">
	<section class="form-heading">
		<h1>Archi numerazioni TD </h1>
	</section>
		<div  class="row form-process" ng-if="archiParziali">
			<div  class="col-xs-12" >
				<div class="form-group">
                    <label class="col-xs-2 control-label">Td Residui</label>
                    <div class="col-xs-3">{{archiParziali}}</div>
				</div>
			</div>
		</div>
		<edit-delete-now-table  
		dati="listaArchiTD" 
		custom-header="headerList"
		tipologia="tipologia"
		detail-arg="detailArg"
		modify-callback="modifyItem()"
		delete-callback="deleteItem()"  
		add-callback="addItem()"
		abilita-modify="isAuthorized('Ordini','Nuovo Ordine')"
		abilita-delete="false"
		abilita-add="isAuthorized('Ordini','Nuovo Ordine')"
		show-spinner="listaArchiTDLoaded"		
		></edit-delete-now-table>	
</div>
