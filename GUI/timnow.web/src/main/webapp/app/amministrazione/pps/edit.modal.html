<!-- Modal -->
<div class="modal-wrap code-block" ng-class="{{modalOptions.type}}">
	
	<div class="modal-header">
		<button type="button" class="close" data-dismiss="modal" aria-label="Close" ng-click="modalOptions.close()"><span aria-hidden="true"><img src="assets/css/i/close.png" alt="close"></span></button>
		<h4>Modifica soglia {{modalOptions.data.nomeSoglia}}</h4>
	</div>
</div>
<div class="modal-body">
	<div class="form-group" >
        <label class="col-xs-5 control-label">Valore soglia <sup>*</sup></label>
        <div class="col-xs-7">
            <input type="text" name="codice_ordine" class="form-control SB-width" ng-model="modalOptions.data.valoreSoglia" required>
            
            <div role="alert">
                <span ng-show="!modalOptions.data.valoreSoglia" class="help-block help-width">Valore soglia obbligatorio!</span>
            </div>

        </div>
    </div>
    <p class="text">{{modalOptions.data.descrizioneSoglia}}</p>
</div>
<div class="modal-footer">
	<section class="form-button">
		<button
				type="button"
				class="btn btn-disabled"
				ng-click="modalOptions.close()"
				data-dismiss="modal"
		>Annulla</button>
		<button ng-disabled="!modalOptions.data.valoreSoglia"
				class="btn blue-btn"
				type="button"
				ng-click="modalOptions.ok(modalOptions.data)"
		>Salva</button>
	</section>
</div>
