<div class="content-section">
	<section class="form-heading">
		<h1>Parametri Monitoraggio PPS</h1>
	</section>
	<section class="user-content">
		<div class="form-group">
			<label class="col-xs-5 control-label">Ambito Monitoraggio  <span ng-if="!scopesLoaded" us-spinner="{radius:5, width:2, length: 5}"></span></label>
			<div class="col-xs-7">
				<div class="selectParent">
					<select class="selectmenu SB-width form-control" name="ambito" ng-model="selectedScope" 
					ng-options="ambito.nome for ambito in scopes"
					ng-change="getReportTypes()">
						<option value="" selected="selected">Seleziona ambito...</option>
					</select>
				</div>
			</div>
		</div>
	</section>

	<section class="user-content user-wrapper">
		<div class="form-group" ng-show="selectedScope">
			<label class="col-xs-5 control-label">Tipologia Report  <span ng-if="!reportTypesLoaded && selectedScope" us-spinner="{radius:5, width:2, length: 5}"></span></label>
			<div class="col-xs-7">
				<div class="selectParent">
					<select class="selectmenu SB-width form-control" name="tipologia" ng-model="selectedReportType" 
					ng-options="tipologia.nome for tipologia in reportTypes"
					ng-change="getPPSParameters()">
						<option value="" selected="selected">Seleziona tipologia...</option>
					</select>
				</div>
			</div>
		</div>
	</section>

	<section class="user-content" ng-show="selectedReportType">
		<now-table 
			dati="parametriPPS" 
			custom-header="headerList"
			tipologia="tipologia"
			show-spinner="parametriLoaded"
			is-large-with-h-scroll="true"
			row-selection-callback="updateThreshold">
		</now-table>
	</section>
</div>
