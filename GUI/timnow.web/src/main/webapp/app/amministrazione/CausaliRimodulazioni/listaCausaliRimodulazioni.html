	<section class="form-heading">
		<h1>Configurazione Monitoraggio Rimodulazioni</h1>
	</section>
	
	<section class="user-content">
		<edit-delete-now-table 
		dati="causaliRimodulazioni.selezionate" 
		custom-header="headerListY"
		tipologia="tipologia"					
		detail-arg="detailArg"

	</section>
</div>
