<!-- RU_963 -->
<div class="content-section">
	<section class="form-heading">
		<h1>Marcaggio Comuni / Pricing</h1>
	</section>
	<now-export-file ng-if="marcaggi.length>0"
		export-callback="iniziaExportCsv"
		vista="$root.VIEW.MARCAGGIO_COMUNI_PRICING" file-type="'csv'"> </now-export-file>
	<now-export-file ng-if="marcaggi.length>0"
		export-callback="iniziaExportXls"
		vista="$root.VIEW.MARCAGGIO_COMUNI_PRICING" file-type="'xls'"> </now-export-file>
	<div style="clear: both">
		<now-advanced-search dati-to-search="paramToSearch"
			always-open="enableRicercaMarcaggi" title="ricerca avanzata"
			titolo="tipologia" callback="getSearchAdvanced()"
			cod-funzione="tipologiaRicerca"></now-advanced-search>

		<div ng-if="!enableRicercaMarcaggi">
			<now-table dati="marcaggi" custom-header="headerList" detail-list="detailList"
				tipologia="tipologia" show-spinner="marcaggiLoaded"
				row-selection-callback="getDettaglioPricing"></now-table>
		</div>

	</div>
</div>
