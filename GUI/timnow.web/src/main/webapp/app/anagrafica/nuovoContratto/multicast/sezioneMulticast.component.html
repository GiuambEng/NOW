<!-- RU-1180 -->
<section class="form-heading">
	<h1>Dati Multicast</h1>
</section>
<section class="form-process">
	<div class="row">
		<div class="form-group"
			ng-class="{ 'has-error' : $ctrl.form.nomeBouquet.$invalid }">
			<label class="col-xs-5">NOME BOUQUET: </label>
			<label class="col-xs-3">Bouquet</label>
			<div class="col-xs-4">
				<input type="text"
					class="form-control SB-width" name="nomeBouquet" ng-pattern="$ctrl.regexBouquet" ng-disabled="$ctrl.disableBouquet"
					ng-model="$ctrl.data.bouquet" required />
				<div role="alert">
					<span ng-if="$ctrl.form.nomeBouquet.$error.pattern"
						class="help-block help-width" style=""> Inserire 3 caratteri numerici </span>
					<span ng-if="$ctrl.form.nomeBouquet.$invalid && $ctrl.form.$submitted" 
						class="help-block help-width">Compila questo campo</span>
				</div>					
			</div>
		</div>
	</div>
	<div class="row">
		<div class="col-xs-6">
			<div class="fileUpload btn btn-default">
				<span ng-if="!$ctrl.csvFile.name">Scegli file CSV</span><span ng-if="$ctrl.csvFile.name">{{$ctrl.csvFile.name}}</span>
				<input type="file" ngf-select="$ctrl.onFileSelect($files, $ctrl.form)" ng-change="$ctrl.onChangeFile($ctrl.csvFile)"
					ng-model="$ctrl.csvFile" name="file" class="upload">
			</div>	
		</div>
	
		<div class="col-xs-5" ng-if="$ctrl.csvFile && !$ctrl.errorMsg">
			<button ng-if="$ctrl.csvFile" ng-click="$ctrl.uploadFile($ctrl.csvFile)" class="btn btn-disabled" ng-disabled="$ctrl.uploadingFile">Invia file</button>
		</div>		
		<div class="col-xs-1">
			<img ng-if="$ctrl.uploadingFile" src="assets/i/loading.gif"/>
		</div>
	</div>
	<div class="row">
		<section class="form-heading exportTemplate col-xs-6"
			ng-if="$ctrl.csvFile && $ctrl.csvFile.progress >= 0 && $ctrl.csvFile.progress < 100 && !$ctrl.errorMsg">
			<div>
				<small><em>Invio del file in corso...</em></small>
				<uib-progressbar animate="true" value="$ctrl.csvFile.progress">
				<b>{{$ctrl.csvFile.progress | number:0}}%</b></uib-progressbar>
			</div>
		</section>
		<div class="upload_error" ng-if="$ctrl.errorMsg">ERRORE: {{$ctrl.errorMsg}}</div>
		<div class="upload_success"
			ng-if="$ctrl.csvFile && !$ctrl.errorMsg && $ctrl.csvFile.progress==100 && $ctrl.csvFile.result">Upload
			avvenuto con successo</div>
	</div>
	
	<esiti-multicast data="$ctrl.data"></esiti-multicast>
</section>
