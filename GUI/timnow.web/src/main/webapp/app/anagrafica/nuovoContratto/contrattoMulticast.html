<style>
.now-custom-select-background {
	background-color: lightgrey;
	cursor: pointer;
}

.now-datepicker-disabled.form-control.SB-width.selectDate {
	background-color: #f0f0f0 !important;
	cursor: not-allowed !important;
}

.now-float-right {
	float: right;
}

.now-custom-options-list {
	height: 10rem;
	overflow-y: auto;
	margin-bottom: 5rem;
	margin-top: 0.5rem;
	background-color: rgb(240, 240, 240);
    padding-left: 10px;
    border-radius: 0.5rem;
}

.mandatory-row {
    border-top: 1px solid #ccc;
}

.no-selected-offers-true {
	border-color: #e8221a !important;
}

</style>

<!--RU_716 NUOVO CONTRATTO-->
<div class="content-section">
	<section class="form-heading">
		<h1>Modifica contratto</h1>
	</section>
	<form ng-submit="nuovoContrattoForm.$valid && submit()" class="form-container" name="nuovoContrattoForm" novalidate>
		<section class="form-process container-fluid">
			<!-- 1 -->
			<div class="row">
				<div class="col-xs-6 col-sm-6 col-md-6 col-lg-6 form-horizontal paddL0">
					<div class="form-group">
						<label class="col-xs-5">OAO<sup>*</sup></label>
						<label class="col-xs-7"> {{codOloSelectNuovoContr}}</label>
					</div>
				</div>
				<div
					class="col-xs-6 col-sm-6 col-md-6 col-lg-6 form-horizontal paddL0">
					<div class="form-group">
						<label class="col-xs-5 control-label">CODICE OLO NUMERICO<sup>*</sup></label>
						<label class="col-xs-7">{{codiceOloNumericoNuovoContr}}</label>
					</div>
				</div>
			</div>
			<div class="row">
				<div
					class="col-xs-6 col-sm-6 col-md-6 col-lg-6 form-horizontal paddL0">
					<div class="form-group">
						<label class="col-xs-5">NOME CONTRATTO<sup>*</sup></label>
						<label class="col-xs-7">{{nomeContrattoNuovoOrd}}</label>
					</div>
				</div>
				<div
					class="col-xs-6 col-sm-6 col-md-6 col-lg-6 form-horizontal paddL0">
					<div class="form-group">
						<label class="col-xs-5">CODICE CONTRATTO<sup>*</sup></label>
						<label class="col-xs-7">{{codiceContrattoNuovoContr}}</label>
					</div>
				</div>
			</div>
			<div class="row">
				<div class="col-xs-6 col-sm-6 col-md-6 col-lg-6 form-horizontal paddL0">
					<div class="form-group">
						<label class="col-xs-5">TIPO SERVIZIO<sup>*</sup></label>
						<label class="col-xs-7">{{tipoServizioNuovoContratto}}</label>
					</div>
				</div>
				<div
					class="col-xs-6 col-sm-6 col-md-6 col-lg-6 form-horizontal paddL0">
					<div class="form-group">
						<label class="col-xs-5">DATA INIZIO VALIDITA<sup>*</sup>
							CONTRATTO
						</label>
						<label class="col-xs-7">{{dataInizioValContr | date:'dd/MM/yyyy'}}</label>							
					</div>
				</div>
			</div>
			<div class="row">
				<div
					class="col-xs-6 col-sm-6 col-md-6 col-lg-6 form-horizontal paddL0">
					<div class="form-group"">
						<label class="col-xs-5">TIPO PRODOTTI<sup>*</sup></label>
						<label class="col-xs-7">{{tipoProdottiNuovoContratto}}</label>
					</div>
				</div>
				<div
					class="col-xs-6 col-sm-6 col-md-6 col-lg-6 form-horizontal paddL0">
					<div class="form-group">
						<label class="col-xs-5">DATA FINE VALIDITA<sup>*</sup>
							CONTRATTO
						</label>
						<label class="col-xs-7 ">{{dataFineValContr | date:'dd/MM/yyyy'}}</label>
					</div>
				</div>
			</div>
			<div class="row">
				<div
					class="col-xs-6 col-sm-6 col-md-6 col-lg-6 form-horizontal paddL0">
					<div class="form-group">
						<label class="col-xs-5">OFFERTA<sup>*</sup></label>
						<label class="col-xs-7">{{offerta}}</label>
					</div>
				</div>
				<div
					class="col-xs-6 col-sm-6 col-md-6 col-lg-6 form-horizontal paddL0">
					<div class="form-group">
						<label class="col-xs-5">TIPO CONTRATTO<sup>*</sup></label>
						<label class="col-xs-7">{{tipoContrattoNuovoContratto}}</label>
					</div>
				</div>
			</div>
			<div class="row">
				<div
					class="col-xs-6 col-sm-6 col-md-6 col-lg-6 form-horizontal paddL0">
					<div class="form-group">
						<label class="col-xs-5 ">DATA INIZIO ASSOCIAZIONE<sup>*</sup>
							OFFERTA - CONTRATTO
						</label>
						<label class="col-xs-7">{{dataInizioAssOff | date:'dd/MM/yyyy'}}</label>
					</div>
				</div>
				<div
					class="col-xs-6 col-sm-6 col-md-6 col-lg-6 form-horizontal paddL0">
					<div class="form-group">
						<label class="col-xs-5 ">DATA FINE ASSOCIAZIONE<sup>*</sup>
							OFFERTA - CONTRATTO
						</label>
						<label class="col-xs-7">{{dataFineAssOff | date:'dd/MM/yyyy'}}</label>
					</div>
				</div>
			</div>


			<div class="row">
				<div
					class="col-xs-6 col-sm-6 col-md-6 col-lg-6 form-horizontal paddL0">
					<div class="form-group">
						<label class="col-xs-5 ">FLAG ABILITATO</label>
						<div class="col-xs-7">
							<input type="checkbox" ng-model="flag_abilitato" ng-true-value="'Y'" ng-false-value="'N'" disabled>
						</div>
					</div>
				</div>
				<div
					class="col-xs-6 col-sm-6 col-md-6 col-lg-6 form-horizontal paddL0">
					<div class="form-group">
						<label class="col-xs-5 ">FLAG VALIDO</label>
						<div class="col-xs-7">
							<input type="checkbox" ng-model="flag_valido" ng-true-value="'Y'" ng-false-value="'N'" disabled>
						</div>
					</div>
				</div>
			</div>

			<div class="row">
				<div
					class="col-xs-6 col-sm-6 col-md-6 col-lg-6 form-horizontal paddL0">
					<div class="form-group">
						<label class="col-xs-5 ">FLAG FILE NOTIFY</label>
						<div class="col-xs-7">
							<input type="checkbox" ng-model="flag_notify" ng-true-value="'Y'" ng-false-value="'N'" disabled>
						</div>
					</div>
				</div>				
			</div>
			
			<div class="row" ng-show="RU_1129 && showSezioneFwa">
				<div
					class="col-xs-6 col-sm-6 col-md-6 col-lg-6 form-horizontal paddL0">
					<div class="form-group">
						<label class="col-xs-5 ">CONTRATTO FWA INFRATEL</label>
						<div class="col-xs-7">
							<input type="checkbox" ng-model="contratto_fwa_infratel" disabled
								ng-true-value="'Y'" ng-false-value="'N'">
						</div>
					</div>
				</div>	
				<div
					class="col-xs-6 col-sm-6 col-md-6 col-lg-6 form-horizontal paddL0">
					<div class="form-group">
						<label class="col-xs-5 ">CONTRATTO FWA PLUS</label>
						<div class="col-xs-7">
							<input type="checkbox" ng-model="contratto_fwa_plus" disabled
								ng-true-value="'Y'" ng-false-value="'N'">
						</div>
					</div>
				</div>
			</div> 
			<div class="row" ng-show="RU_1129 && showSezioneFwa">
				<div
					class="col-xs-6 col-sm-6 col-md-6 col-lg-6 form-horizontal paddL0">
					<div class="form-group">
						<label class="col-xs-5">CONTRATTO FWA DECOMISSIONING</label>
						<div class="col-xs-7">
							<input type="checkbox" ng-model="contratto_fwa_decommissioning" disabled
								ng-true-value="'Y'" ng-false-value="'N'">
						</div>
					</div>
				</div>
			</div>
			
			<div class="row" ng-show="RU_1164 && showSezioneSemi">
				<div class="col-xs-6 col-sm-6 col-md-6 col-lg-6 form-horizontal paddL0">
					<div class="form-group" >
						<label class="col-xs-5 ">DATA INIZIO CONTRATTO COINVESTIMENTO</label>
						<label class="col-xs-7 ">{{$parent.dataInizioCoinvestimento | date:'dd/MM/yyyy'}}</label>
					</div>
				</div>
				<div
					class="col-xs-6 col-sm-6 col-md-6 col-lg-6 form-horizontal paddL0">
					<div class="form-group">
						<label class="col-xs-5 ">DATA FINE CONTRATTO COINVESTIMENTO</label>
						<label class="col-xs-7">{{$parent.dataFineCoinvestimento | date:'dd/MM/yyyy'}}</label>
					</div>
				</div>
			</div>
			
			<!-- RU_1180 -->
			<!-- RU_1210 -->
			<div ng-if="showSezioneMulticast">
				<sezione-multicast data="multicastData" file-naming-convention="fileNamePattern"></sezione-multicast>				
			</div>
			
			<!-- 9 -->
			<div class="row mandatory-row">
				<div
					class="col-xs-12 col-sm-12 col-md-12 col-lg-12 form-horizontal paddL0">
					<i>*Campo obbligatorio</i>
				</div>
			</div>

			<!-- 10 -->
			<div class="row">
				<div
					class="col-xs-12 col-sm-12 col-md-12 col-lg-12 form-horizontal paddL0">
					<!-- RU_1210 -->
					<section class="form-button" ng-if="showSezioneMulticast">
						<button class="btn blue-btn" type="submit">Conferma</button>
						<button class="btn btn-disabled" type="button"
							ng-click="annulla()">Annulla</button>
					</section>
					<section class="form-button" ng-if="!showSezioneMulticast">
						<button class="btn btn-disabled" type="button"
							ng-click="annulla()">Chiudi</button>
					</section>
				</div>
			</div>
		</section>
	</form>
</div>
