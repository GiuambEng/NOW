<!-- SM_10292 -->
<style>
.page-container .form-heading {
    margin-bottom: 23px;
    position: static;
}
</style>
<section class="form-heading">
	<h1>Disabilitazione Servizio</h1>
</section>
<section class="form-container form-process">
	<div class="row">
		<div class="form-group">
			<label class="col-xs-3 ">FLAG_EIPNGA_DISABIL</label>
			<div class="col-xs-3 ">
				<select								
					class="selectmenu SB-width form-control" name="flagDisabil" ng-change="onChangeFlagDisabilitazione()"
					ng-model="data.flagDisabil">
					<option value></option>
					<option value="Y">SI</option>
					<option value="N">NO</option>								
				</select>
			</div>
		</div>
	</div>
	<div class="row">
		<div class="form-group" ng-class="{ 'has-error' : (form.dataInizioDisabilitazione.$error.required || form.dataInizioDisabilitazione.$error.invalidDate)}">
			<label class="col-xs-3">FLAG_EIPNGA_DISABIL_DATA_INIZIO<sup ng-if="dataInizioDisabilRequired">*</sup></label>
			<div class="col-xs-5">
				<input type="text" ng-init="onChangeDataInizioDisabilitazione()"
					ng-required="dataInizioDisabilRequired"
					ng-change="onChangeDataInizioDisabilitazione()"
					name="dataInizioDisabilitazione"
					class="form-control SB-width selectDate"
					ng-click="dataInizioDisabilConfig.open()" uib-datepicker-popup="dd/MM/yyyy"
					ng-model="data.dataInizioDisabil" is-open="dataInizioDisabilConfig.popupOpened"
					datepicker-options="dataInizioDisabilConfig.dateOptions" close-text="Chiudi"		
					ng-disabled="dataInizioDisabilitazioneDisabled"			
					alt-input-formats="altInputFormats">
				<div role="alert">
					<span ng-if="form.dataInizioDisabilitazione.$error.required && form.$submitted" 
						class="help-block help-width">Compila questo campo</span>
					<span ng-if="form.dataInizioDisabilitazione.$error.invalidDate" 
						class="help-block help-width">{{message}}</span>
				</div>					
			</div>
		</div>	
	</div>
	
	<div class="row">
		<div class="form-group" ng-class="{ 'has-error' : (form.dataInizioDisabilitazione.$error.required || form.dataInizioDisabilitazione.$error.invalidDate)}">
			<label class="col-xs-3">FLAG_EIPNGA_DISABIL_DATA_FINE<sup ng-if="dataFineDisabilRequired">*</sup></label>
			<div class="col-xs-5">
				<input type="text" ng-init="onChangeDataInizioDisabilitazione()"
					ng-change="onChangeDataInizioDisabilitazione()"
					name="dataFineDisabilitazione"
					class="form-control SB-width selectDate"
					ng-click="dataFineDisabilConfig.open()" uib-datepicker-popup="dd/MM/yyyy"
					ng-model="data.dataFineDisabil" is-open="dataFineDisabilConfig.popupOpened"
					datepicker-options="dataFineDisabilConfig.dateOptions" close-text="Chiudi"
					alt-input-formats="altInputFormats"
					ng-disabled="dataFineDisabilitazioneDisabled"
					ng-required="dataFineDisabilRequired">
				<div role="alert">
					<span ng-if="form.dataFineDisabilitazione.$error.required && form.$submitted" 
						class="help-block help-width">Compila questo campo</span>
				</div>					
			</div>
		</div>	
	</div>
</section>
