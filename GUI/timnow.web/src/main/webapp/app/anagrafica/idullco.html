<!-------------------------        FORM HEADING SECTION       START ----------------------------- -->
<div class="content-section">
    <section class="form-heading">
        <h1>Lista Idullco</h1>
    </section>
    <div style="clear:both">
        <now-advanced-search
                dati-to-search="paramToSearch"
                title="ricerca avanzata"
                titolo="tipologia"
                always-open="enableRicercaIdullco"
                callback="getSearchAdvanced()"
                cod-funzione="tipologiaRicerca"
        ></now-advanced-search>
        <div  ng-if="!enableRicercaIdullco">
            <now-table
                    dati="idullco"
                    custom-header="headerList"
                    tipologia="tipologia"
                    show-spinner="idullcoLoaded"
                    >
            </now-table>
        </div>
        <div ng-if="enableRicercaIdullco">Si invita l'utente ad utilizzare la Ricerca Avanzata per recuperare gli Idullco di interesse.</div>
    </div>
</div>
