<div class="content-section">
	<section class="form-heading">
		<h1>Contratti</h1>
	</section>
	
	<!-- SM_8904 -->
    <now-export-file 
        ng-if="contracts.length>0"
        export-callback="iniziaExport"
        vista="$root.VIEW.CONTRATTO">
    </now-export-file>
	<div style="clear:both">
		 <now-advanced-search
			 dati-to-search="paramToSearch"
			 title="ricerca avanzata"
			 titolo="tipologia"
			 callback="getSearchAdvanced()"
			 cod-funzione="tipologiaRicerca"
			></now-advanced-search>
		<now-table 
		dati="contracts" 
		custom-header="headerList"
		tipologia="tipologia"					
		show-spinner="contractsLoaded"
		row-selection-callback="getDettaglioContratti"
		modify-contract-function="modifyContractFunction" 
		></now-table> 
		
		</div>
</div>
