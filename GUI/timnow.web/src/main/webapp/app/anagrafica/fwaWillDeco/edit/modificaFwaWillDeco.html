<style>
.page-container .form-container .form-process {
	border-top: 1px solid #ccc;
	border-bottom: none !important;
	padding: 53px 0 20px 0;
	float: left;
	width: 100%;
}

.now-custom-select-background {
	background-color: lightgrey;
	cursor: pointer;
}

.now-datepicker-disabled.form-control.SB-width.selectDate {
	background-color: #f0f0f0 !important;
	cursor: not-allowed !important;
}

.now-float-right {
	float: right;
}

.now-custom-options-list {
	height: 10rem;
	overflow-y: auto;
	margin-bottom: 5rem;
	margin-top: 0.5rem;
	background-color: rgb(240, 240, 240);
	padding-left: 10px;
	border-radius: 0.5rem;
}

.mandatory-row {
	border-top: 1px solid #ccc;
}

.no-selected-offers-true {
	border-color: #e8221a !important;
}

.pre {
	white-space: pre-line !important;
}
</style>

<section class="form-heading">
	<h1>Modifica Risorsa FWA WILL Deco</h1>
</section>
<div ng-if="loadDettaglio" class="spinner_container_direttiva">
	<span us-spinner="{radius:18, width:3, length: 14}"></span>
</div>
<div class="content-section">
	<form ng-submit="modificaRisorsaFwaForm.$valid && submit()"
		class="form-container" name="modificaRisorsaFwaForm" novalidate>
		<section class="form-process container-fluid" ng-if="!loadDettaglio">
			<div class="row">
				<div
					class="col-xs-6 col-sm-6 col-md-6 col-lg-6 form-horizontal paddL0">
					<div class="form-group"
						ng-class="{ 'has-error' : modificaRisorsaFwaForm.idRisorsa.$invalid && modificaRisorsaFwaForm.$submitted }">
						<label class="col-xs-5">ID Risorsa SwitchOff</label>
						<label class="col-xs-7">{{risorsa.idRisorsaSwitchOff}}</label>
					</div>
				</div>
				<div
					class="col-xs-6 col-sm-6 col-md-6 col-lg-6 form-horizontal paddL0">
					<div class="form-group"
						ng-class="{ 'has-error' : modificaRisorsaFwaForm.dataScadenzaSwitchoff.$invalid && modificaRisorsaFwaForm.$submitted }">
						<label class="col-xs-5 ">Data Scadenza Switch-Off<sup>*</sup></label>
						<div class="col-xs-7">
							<input type="text" name="dataScadenzaSwitchoff"
								class="form-control SB-width selectDate"
								alt-input-formats="altInputFormats"
								ng-click="dataScadenzaSwitchoffConfig.open()"
								uib-datepicker-popup="dd/MM/yyyy"
								ng-model="risorsa.dataScadenzaSwitchOff"
								is-open="dataScadenzaSwitchoffConfig.popupOpened"
								datepicker-options="dataScadenzaSwitchoffConfig.dateOptions"
								close-text="Chiudi"
								required>
						</div>
						<div class="col-xs-6 col-sm-6 col-md-6 col-lg-6 form-horizontal ">
							<div role="alert">
								<span
									ng-if="modificaRisorsaFwaForm.dataScadenzaSwitchoff.$invalid && modificaRisorsaFwaForm.$submitted"
									class="help-block help-width">Compila questo campo</span>
							</div>
						</div>
					</div>
				</div>
			</div>

			<div class="row">
				<div
					class="col-xs-6 col-sm-6 col-md-6 col-lg-6 form-horizontal paddL0">
					<div class="form-group">
						<label class="col-xs-5">Stato Migrato</label>
						<label class="col-xs-7">{{risorsa.statoMigrato}}</label>
					</div>
				</div>
				<div
					class="col-xs-6 col-sm-6 col-md-6 col-lg-6 form-horizontal paddL0">
					<div class="form-group">
						<label class="col-xs-5 ">Data Inserimento</label> 
						<label class="col-xs-7">{{risorsa.dataInserimento | date:'dd/MM/yyyy'}}</label>
					</div>
				</div>
			</div>
			<div clasS="row">
				<div
					class="col-xs-6 col-sm-6 col-md-6 col-lg-6 form-horizontal paddL0">
					<div class="form-group">
						<label class="col-xs-5">Data Ultima Modifica</label>
						<label class="col-xs-7">{{risorsa.dataUltimaModifica | date:'dd/MM/yyyy'}}</label>
					</div>
				</div>
			</div>
			
			<div class="row mandatory-row">
				<div
					class="col-xs-12 col-sm-12 col-md-12 col-lg-12 form-horizontal mandatory-field paddL0">
					<i>*Campo obbligatorio</i>
				</div>
			</div>
			
			<div class="row">
				<div
					class="col-xs-12 col-sm-12 col-md-12 col-lg-12 form-horizontal paddL0">
					<section class="form-button">
						<span ng-if="showLoader"><img src="assets/i/loading.gif" /></span>
						<button class="btn blue-btn" type="submit"
							ng-disabled="modificaRisorsaFwaForm.$invalid || showLoader">Salva</button>
						<button class="btn btn-disabled" type="button"
							ng-disabled="showLoader" ng-click="back()">Annulla</button>
					</section>
				</div>
			</div>
		</section>
	</form>
</div>
