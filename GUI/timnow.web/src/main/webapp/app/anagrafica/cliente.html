<div class="content-section">
	<section class="form-heading">
		<h1>Cliente</h1>
	</section> 
	
	<!-- SM_8904 -->
	<now-export-file 
		ng-if="clienti.length>0"
		export-callback="iniziaExport"		
		vista="$root.VIEW.CLIENTE">
	</now-export-file>
	
	<div style="clear:both">
		   <now-advanced-search
			 dati-to-search="paramToSearch"
			 title="ricerca avanzata"
			 titolo="tipologia"
			 callback="getSearchAdvanced()"
			 cod-funzione="tipologiaRicerca"
			></now-advanced-search>
		<now-table 
		dati="clienti" 
		custom-header="headerList"
		tipologia="tipologia"					
		show-spinner="clientiLoaded"
		row-selection-callback="getDettaglioCliente" 
		></now-table>
	</div>
</div>
