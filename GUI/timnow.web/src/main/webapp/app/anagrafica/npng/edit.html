<style>
.now-custom-select-background {
	background-color: lightgrey;
	cursor: pointer;
}

.now-datepicker-disabled.form-control.SB-width.selectDate {
	background-color: #f0f0f0 !important;
	cursor: not-allowed !important;
}

.now-float-right {
	float: right;
}

.now-custom-options-list {
	height: 10rem;
	overflow-y: auto;
	margin-bottom: 5rem;
	margin-top: 0.5rem;
	background-color: rgb(240, 240, 240);
    padding-left: 10px;
    border-radius: 0.5rem;
}

.mandatory-row {
    border-top: 1px solid #ccc;
}

.no-selected-offers-true {
	border-color: #e8221a !important;
}

</style>

<div class="content-section">
	<section class="form-heading">
		<h1>Modifica NPNG</h1>
	</section>
	<form ng-submit="editNpngForm.$valid && submit()" class="form-container" name="editNpngForm" novalidate>
		<section class="form-process container-fluid">
			<!-- 1 -->
			<div class="row">
				<div class="col-xs-6 col-sm-6 col-md-6 col-lg-6 form-horizontal paddL0">
					<div class="form-group">
						<label class="col-xs-5">DESCRIZIONE OPZIONE TRAFFICO<sup>*</sup></label>
						<label class="col-xs-7"> {{number.descrOpzTraffico}}</label>
					</div>
				</div>
				<div
					class="col-xs-6 col-sm-6 col-md-6 col-lg-6 form-horizontal paddL0">
					<div class="form-group">
						<label class="col-xs-5 control-label">OPZIONE TRAFFICO<sup>*</sup></label>
						<label class="col-xs-7">{{number.opzTraffico}}</label>
					</div>
				</div>
			</div>
			<div class="row">
				<div
					class="col-xs-6 col-sm-6 col-md-6 col-lg-6 form-horizontal paddL0">
					<div class="form-group">
						<label class="col-xs-5">PREFISSO NON GEOGRAFICO<sup>*</sup></label>
						<label class="col-xs-7">{{number.prefissoNPNG}}</label>
					</div>
				</div>
				<div
					class="col-xs-6 col-sm-6 col-md-6 col-lg-6 form-horizontal paddL0">
					<div class="form-group">
						<label class="col-xs-5">DATA INIZIO VALIDITA'<sup>*</sup></label>
						<label class="col-xs-7">{{number.dataInizioValidita | date:'dd/MM/yyyy'}}</label>
					</div>
				</div>
			</div>
			<div class="row">
				<div class="col-xs-6 col-sm-6 col-md-6 col-lg-6 form-horizontal paddL0">
					<div class="form-group" ng-class="{ 'has-error' : editNpngForm.dataFineValidita.$invalid && !editNpngForm.dataFineValidita.$pristine }">
						<label class="col-xs-5">DATA FINE VALIDITA'<sup>*</sup></label>
						
						<div class="col-xs-7">
							<input type="text" name="dataFineValidita"
							 	onkeydown="return false"
								class="selectDate form-control SB-width"
								ng-click="dataFineValiditaConfig.open()" uib-datepicker-popup="dd/MM/yyyy"
								ng-model="dataFine" is-open="dataFineValiditaConfig.popupOpened"
								datepicker-options="dataFineValiditaConfig.dateOptions" close-text="Chiudi"
								alt-input-formats="altInputFormats" required>
						</div>
						<div class="col-xs-6 col-sm-6 col-md-6 col-lg-6 form-horizontal ">
							<div role="alert">
								<span
									ng-if="editNpngForm.dataFineValidita.$invalid && !editNpngForm.dataFineValidita.$pristine"
									class="help-block help-width">Compila questo campo</span>
							</div>
						</div>
					</div>
				</div>
			</div>

			<div class="row mandatory-row">
				<div
					class="col-xs-12 col-sm-12 col-md-12 col-lg-12 form-horizontal paddL0">
					<i>*Campo obbligatorio</i>
				</div>
			</div>

			<div class="row">
				<div
					class="col-xs-12 col-sm-12 col-md-12 col-lg-12 form-horizontal paddL0">
					<section class="form-button">
						<button class="btn blue-btn" type="submit">Conferma</button>
						<button class="btn btn-disabled" type="button"
							ng-click="annulla()">Annulla</button>
					</section>
				</div>
			</div>
		</section>
	</form>
</div>
