<style>
.now-custom-select-background {
	background-color: lightgrey;
	cursor: pointer;
}

.now-datepicker-disabled.form-control.SB-width.selectDate {
	background-color: #f0f0f0 !important;
	cursor: not-allowed !important;
}

.now-float-right {
	float: right;
}

.now-custom-options-list {
	height: 10rem;
	overflow-y: auto;
	margin-bottom: 5rem;
	margin-top: 0.5rem;
	background-color: rgb(240, 240, 240);
    padding-left: 10px;
    border-radius: 0.5rem;
}

.mandatory-row {
    border-top: 1px solid #ccc;
}

.no-selected-offers-true {
	border-color: #e8221a !important;
}

.page-container .content-section {
    max-width: 90vw !important;
}

.pre {
	white-space: pre-line !important;
}

</style>

<!--RU_716 NUOVO CONTRATTO-->
<section class="form-heading">
	<h1>Modifica Contratto</h1>
</section>
<div ng-if="!datiRetrieved " class="spinner_container_direttiva">
	<span us-spinner="{radius:25, width:5, length: 18}"></span>
</div>
<div class="content-section" ng-if="datiRetrieved">
	<form ng-submit="modificaContrattoForm.$valid && submit()" class="form-container" name="modificaContrattoForm" novalidate>
		<section class="form-process container-fluid">
			<!-- 1 -->
			<div class="row">
				<div
					class="col-xs-6 col-sm-6 col-md-6 col-lg-6 form-horizontal paddL0">
					<div class="form-group">
						<label class="col-xs-5">OAO<sup>*</sup></label>
						<label class="col-xs-7">{{data.codificaOloAgcom}}</label>
					</div>
				</div>
				<div
					class="col-xs-6 col-sm-6 col-md-6 col-lg-6 form-horizontal paddL0">
					<div class="form-group">
						<label class="col-xs-5 control-label">CODICE OLO NUMERICO<sup>*</sup></label>						
						<label class="col-xs-7 control-label">{{data.codiceOloNumerico}}</label>
					</div>

				</div>
			</div>
			<!-- 2 -->
			<div class="row">
				<div
					class="col-xs-6 col-sm-6 col-md-6 col-lg-6 form-horizontal paddL0">
					<div class="form-group">
						<label class="col-xs-5">NOME CONTRATTO<sup>*</sup></label>
						<label class="col-xs-7">{{data.nomeContratto}}</label>
					</div>
				</div>
				<div
					class="col-xs-6 col-sm-6 col-md-6 col-lg-6 form-horizontal paddL0">
					<div class="form-group">
						<label class="col-xs-5">CODICE CONTRATTO<sup>*</sup></label>
						<label class="col-xs-7">{{data.codiceContratto}}</label>
					</div>
				</div>
			</div>
			<!-- 3 -->
			<div class="row">
				<div
					class="col-xs-6 col-sm-6 col-md-6 col-lg-6 form-horizontal paddL0">
					<div class="form-group">
						<label class="col-xs-5">TIPO SERVIZIO<sup>*</sup></label>
						<label class="col-xs-7">{{data.tipoServizio}}</label>
					</div>
				</div>
				<div
					class="col-xs-6 col-sm-6 col-md-6 col-lg-6 form-horizontal paddL0">
					<div class="form-group">
						<label class="col-xs-5">DATA INIZIO VALIDITA<sup>*</sup>
							CONTRATTO
						</label>
						<label class="col-xs-7">{{data.dataInizioValiditaContratto | date:'dd/MM/yyyy'}}</label>
					</div>
				</div>
			</div>
			<!-- 4 -->
			<div class="row">
				<div
					class="col-xs-6 col-sm-6 col-md-6 col-lg-6 form-horizontal paddL0">
					<div class="form-group">
						<label class="col-xs-5">TIPO PRODOTTI<sup>*</sup><span
							ng-if="loadTipoProdotti" us-spinner="{radius:5, width:1, length: 5}"></span></label>
						<label class="col-xs-7">{{data.tipoProdotti}}</label>
					</div>
				</div>
				<div
					class="col-xs-6 col-sm-6 col-md-6 col-lg-6 form-horizontal paddL0">
					<div class="form-group"
						ng-class="{ 'has-error' : modificaContrattoForm.dataFineVal.$invalid && modificaContrattoForm.$submitted }">
						<label class="col-xs-5">DATA FINE VALIDITA<sup>*</sup>
							CONTRATTO
						</label>
						<div class="col-xs-7 ">
							<input type="text"
								name="dataFineVal"
								alt-input-formats="altInputFormats"
								class="form-control SB-width selectDate"
								ng-change="dataFineValiditaContrattoConfig.onChange()"
								ng-class="{'now-datepicker-disabled' : !data.dataInizioValiditaContratto}"
								ng-click="dataFineValiditaContrattoConfig.open()" uib-datepicker-popup="dd/MM/yyyy"
								ng-model="data.dataFineValiditaContratto" is-open="dataFineValiditaContrattoConfig.popupOpened"
								datepicker-options="dataFineValiditaContrattoConfig.dateOptions" close-text="Chiudi" required>
						</div>
						<div class="col-xs-6 col-sm-6 col-md-6 col-lg-6 form-horizontal "> <!-- fix per campi non inseriti in rosso -->
							<div role="alert">
								<span
									ng-if="modificaContrattoForm.dataFineVal.$invalid && modificaContrattoForm.$submitted"
									class="help-block help-width">Compila questo campo</span>
							</div>
						</div>
					</div>
				</div>
			</div>
			<!-- 5 -->
			<div class="row">
				<div
					class="col-xs-6 col-sm-6 col-md-6 col-lg-6 form-horizontal paddL0">
					<div class="form-group">
						<label class="col-xs-5">OFFERTA<sup>*</sup><span
							ng-if="loadOAO" us-spinner="{radius:5, width:1, length: 5}"></span></label>
						<div class="col-xs-6">
							<div class="now-custom-options-list">
								<span
									ng-repeat="item in data.offerteSelected track by $index">
									<input type="checkbox" checked disabled />
										<label>{{item}}<br /></label>
									<br>
								</span>
							</div>
						</div>
					</div>
				</div>
				<div
					class="col-xs-6 col-sm-6 col-md-6 col-lg-6 form-horizontal paddL0">
					<div class="form-group">
						<label class="col-xs-5">TIPO CONTRATTO<sup>*</sup><span
							ng-if="loadTipoContratto" us-spinner="{radius:5, width:1, length: 5}"></span></label>
						<label class="col-xs-7">{{data.tipoContratto}}</label>
					</div>
				</div>
			</div>
			<!-- 6 -->
			<div class="row">
				<div
					class="col-xs-6 col-sm-6 col-md-6 col-lg-6 form-horizontal paddL0">
					<div class="form-group">
						<label class="col-xs-5 ">DATA INIZIO ASSOCIAZIONE<sup>*</sup>
							OFFERTA - CONTRATTO
						</label>
						<label class="col-xs-7 ">{{data.dataInizioAssociazioneOfferta | date:'dd/MM/yyyy'}}</label>
					</div>
				</div>
				<div
					class="col-xs-6 col-sm-6 col-md-6 col-lg-6 form-horizontal paddL0">
					<div class="form-group"
						ng-class="{ 'has-error' : modificaContrattoForm.dataFineAss.$invalid && modificaContrattoForm.$submitted }">
						<label class="col-xs-5 ">DATA FINE ASSOCIAZIONE<sup>*</sup>
							OFFERTA - CONTRATTO
						</label>
						<div class="col-xs-7">
							<input type="text"
								name="dataFineAss"
								alt-input-formats="altInputFormats"
								class="form-control SB-width selectDate"
								ng-click="dataFineAssociazioneOffertaConfig.open()"
								uib-datepicker-popup="dd/MM/yyyy"
								ng-model="data.dataFineAssociazioneOfferta" is-open="dataFineAssociazioneOffertaConfig.popupOpened"
								datepicker-options="dataFineAssociazioneOffertaConfig.dateOptions" close-text="Chiudi"
								ng-class="{'now-datepicker-disabled' : !data.dataInizioAssociazioneOfferta}" required>
						</div>
						<div class="col-xs-6 col-sm-6 col-md-6 col-lg-6 form-horizontal "> <!-- fix per campi non inseriti in rosso -->
							<div role="alert">
								<span
									ng-if="modificaContrattoForm.dataFineAss.$invalid && modificaContrattoForm.$submitted"
									class="help-block help-width">Compila questo campo</span>
							</div>
						</div>
					</div>
				</div>
			</div>

			<!-- 7 -->
			<div class="row">

				<div
					class="col-xs-6 col-sm-6 col-md-6 col-lg-6 form-horizontal paddL0">
					<div class="form-group">
						<label class="col-xs-5 ">FLAG ABILITATO</label>
						<div class="col-xs-7">
							<input type="checkbox" ng-model="data.flagAbilitato" ng-true-value="'Y'" ng-false-value="'N'">
						</div>
					</div>
				</div>
				<div
					class="col-xs-6 col-sm-6 col-md-6 col-lg-6 form-horizontal paddL0">
					<div class="form-group">
						<label class="col-xs-5 ">FLAG VALIDO</label>
						<div class="col-xs-7">
							<input type="checkbox" ng-model="data.flagValido" ng-true-value="'Y'" ng-false-value="'N'">
						</div>
					</div>
				</div>
			</div>
			
			<!-- 8 -->
			<div class="row">
				<!-- SM_10433 -->
				<div ng-if="showFlagMulticast"
					class="col-xs-6 col-sm-6 col-md-6 col-lg-6 form-horizontal paddL0">
					<div class="form-group">
						<label class="col-xs-5 ">FLAG MULTICAST</label>
						<div class="col-xs-7">
							<input type="checkbox" ng-model="data.flagMulticast" ng-true-value="'Y'" ng-false-value="'N'">
						</div>
					</div>
				</div>
				<div
					class="col-xs-6 col-sm-6 col-md-6 col-lg-6 form-horizontal paddL0">
					<div class="form-group">
						<label class="col-xs-5 ">FLAG FILE NOTIFY</label>
						<div class="col-xs-7">
							<input type="checkbox" ng-model="data.flagFileNotify" ng-true-value="'Y'" ng-false-value="'N'">
						</div>
					</div>
				</div>				
			</div>
			
			<!-- RU_1129 -->
			<div class="row" ng-show="RU_1129 && showSezioneFwa">
				<div
					class="col-xs-6 col-sm-6 col-md-6 col-lg-6 form-horizontal paddL0">
					<div class="form-group" ng-class="{ 'has-error' : fwaCheckboxRequired && modificaContrattoForm.$submitted }">
						<label class="col-xs-5 ">CONTRATTO FWA INFRATEL</label>
						<div class="col-xs-7">
							<input type="checkbox" name="contrattoFwaInfratel" ng-model="data.contrattoFwaInfratel" ng-disabled="fwaCheckboxDisabled"
								ng-true-value="'Y'" ng-false-value="'N'" ng-required="fwaCheckboxRequired && RU_1129 && showSezioneFwa" ng-change="onChangeFwaCheckbox()">
						</div>
					</div>
				</div>	
				<div
					class="col-xs-6 col-sm-6 col-md-6 col-lg-6 form-horizontal paddL0">
					<div class="form-group" ng-class="{ 'has-error' : fwaCheckboxRequired && modificaContrattoForm.$submitted }">
						<label class="col-xs-5 ">CONTRATTO FWA PLUS</label>
						<div class="col-xs-7">
							<input type="checkbox" name="contrattoFwaPlus" ng-model="data.contrattoFwaPlus" ng-disabled="fwaCheckboxDisabled"
								ng-true-value="'Y'" ng-false-value="'N'" ng-required="fwaCheckboxRequired && RU_1129 && showSezioneFwa" ng-change="onChangeFwaCheckbox()">
						</div>
					</div>
				</div>
			</div> 
			<div class="row" ng-show="RU_1129 && showSezioneFwa">
				<div
					class="col-xs-6 col-sm-6 col-md-6 col-lg-6 form-horizontal paddL0">
					<div class="form-group" ng-class="{ 'has-error' : fwaCheckboxRequired && modificaContrattoForm.$submitted }">
						<label class="col-xs-5">CONTRATTO FWA DECOMMISSIONING</label>
						<div class="col-xs-7">
							<input type="checkbox" ng-model="data.contrattoFwaDecommissioning" name="contrattoFwaDecommissioning" ng-disabled="fwaCheckboxDisabled"
								ng-true-value="'Y'" ng-false-value="'N'" ng-required="fwaCheckboxRequired && RU_1129 && showSezioneFwa" ng-change="onChangeFwaCheckbox()">
						</div>
						<div class="col-xs-6 col-sm-6 col-md-6 col-lg-6 form-horizontal ">
							<div role="alert">
								<span
									ng-if="fwaCheckboxRequired && modificaContrattoForm.$submitted"
									class="help-block help-width">Seleziona almeno un campo tra CONTRATTO FWA INFRATEL, CONTRATTO FWA PLUS, CONTRATTO FWA DECOMMISSIONING</span>
							</div>
						</div>
					</div>
				</div>
			</div>
			
			<!-- RU_1164 -->
			<div class="row" ng-show="RU_1164 && showSezioneSemi">
				<div class="col-xs-6 col-sm-6 col-md-6 col-lg-6 form-horizontal paddL0">
					<div class="form-group" 
						ng-class="{ 'has-error' : modificaContrattoForm.dataInizioCoinvestimento.$invalid && modificaContrattoForm.$submitted }">
						<label class="col-xs-5 ">DATA INIZIO CONTRATTO COINVESTIMENTO<sup>*</sup></label>
						<div class="col-xs-7 ">
							<input type="text" name="dataInizioCoinvestimento"
								class="selectDate form-control SB-width"
								ng-click="dataInizioContrattoCoinvestimentoConfig.open()" uib-datepicker-popup="dd/MM/yyyy"
								ng-model="data.dataInizioContrattoCoinvestimento" is-open="dataInizioContrattoCoinvestimentoConfig.popupOpened"
								datepicker-options="dataInizioContrattoCoinvestimentoConfig.dateOptions" close-text="Chiudi"
								ng-change="dataInizioContrattoCoinvestimentoConfig.onChange()" ng-required="RU_1164 && showSezioneSemi"
								alt-input-formats="altInputFormats">
						</div>
						<div class="col-xs-6 col-sm-6 col-md-6 col-lg-6 form-horizontal ">
							<div role="alert">
								<span
									ng-if="modificaContrattoForm.dataInizioCoinvestimento.$invalid && modificaContrattoForm.$submitted"
									class="help-block help-width">Compila questo campo</span>
							</div>
						</div>
					</div>
				</div>
				<div
					class="col-xs-6 col-sm-6 col-md-6 col-lg-6 form-horizontal paddL0">
					<div class="form-group">
						<label class="col-xs-5 ">DATA FINE CONTRATTO COINVESTIMENTO</label>
						<div class="col-xs-7">
							<input type="text"
								name="dataFineCoinvestimento"
								class="form-control SB-width selectDate"
								ng-click="dataFineContrattoCoinvestimentoConfig.open()" uib-datepicker-popup="dd/MM/yyyy"
								ng-model="data.dataFineContrattoCoinvestimento" is-open="dataFineContrattoCoinvestimentoConfig.popupOpened"
								alt-input-formats="altInputFormats"
								datepicker-options="dataFineContrattoCoinvestimentoConfig.dateOptions" close-text="Chiudi">
						</div>
					</div>
				</div>
			</div>
			
			<!-- SM_11396 -->
			<div class="row" ng-if="showEmailFwaEolo">
				<div class="col-xs-6 col-sm-6 col-md-6 col-lg-6 form-horizontal paddL0">
					<div class="form-group" 
						 ng-class="{ 'has-error' : modificaContrattoForm.emailOffertaFwa1GigaSardegna.$invalid && modificaContrattoForm.$submitted }">
						<label class="col-xs-5">EMAIL OFFERTA FWA 1 GIGA SARDEGNA<sup>*</sup></label>
						<div class="col-xs-7">
							<input class="form-control SB-width" name="emailOffertaFwa1GigaSardegna" type="email" ng-model="data.emailOffertaFwa1GigaSardegna" ng-required="showEmailFwaEolo">
						</div>
						<div class="col-xs-6 col-sm-6 col-md-6 col-lg-6 form-horizontal ">
							<div role="alert">
								<span
									ng-if="modificaContrattoForm.emailOffertaFwa1GigaSardegna.$invalid && modificaContrattoForm.$submitted"
									class="help-block help-width">Compila questo campo</span>
							</div>
						</div>
					</div>
				</div>	
			</div>
			
			<!-- SM_10292 -->
			<!-- Task #36345 -->
			<sezione-sospensione-servizio ng-if="showSezioneSospensioneServizio" form="modificaContrattoForm" 
				data="data.datiSospensioneServizio" is-edit="true"></sezione-sospensione-servizio>
			
			<!-- RU_1180 -->
			<!-- RU_1210 -->
			<div ng-if="showSezioneMulticast">
				<sezione-multicast data="multicastData" file-naming-convention="fileNamePattern"></sezione-multicast>				
			</div>
			
			<!-- RU_1276 -->
			<sezione-file-comuni-coinvestiti ng-if="showSezioneComuniCoinvestimento" is-edit="true" form="modificaContrattoForm" use-broadcast-for-upload="true"
				data="data.datiComuniCoinvestimento" file-to-upload="data.datiComuniCoinvestimento.fileToUpload" show-only-list="false"></sezione-file-comuni-coinvestiti>
			
			<!-- 9 -->
			<div class="row mandatory-row">
				<div
					class="col-xs-12 col-sm-12 col-md-12 col-lg-12 form-horizontal mandatory-field paddL0">
					<i>*Campo obbligatorio</i>
				</div>
			</div>

			<!-- 10 -->
			<div class="row">
				<div
					class="col-xs-12 col-sm-12 col-md-12 col-lg-12 form-horizontal paddL0">
					<section class="form-button">
						<span ng-if="showLoader"><img src="assets/i/loading.gif" /></span>
						<button class="btn blue-btn" type="submit" ng-disabled="showLoader">Conferma</button>
						<button class="btn btn-disabled" type="button" ng-disabled="showLoader" ng-click="annulla()">Annulla</button>
					</section>
				</div>
			</div>

		</section>
	</form>

</div>
