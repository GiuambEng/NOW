<!-- RU_1276 -->
<style>
.page-container .form-heading {
    margin-bottom: 23px;
    position: static;
}
</style>
<section class="form-heading">
	<h1>Lista File Comuni Coinvestimento</h1>
</section>
<section class="form-heading" ng-if="isEdit || showOnlyList">
	<div class="button-list">
		<button ng-click="aggiornaListaFileComuniCoinvestiti($event)">
			<span class="glyphicon glyphicon-refresh" aria-hidden="true"></span>
			Aggiorna Lista
		</button>
	</div>
</section>

<div style="clear: both" ng-if="isEdit || showOnlyList">
	<now-table dati="listaFiles" custom-header="headersListaFile"
		tipologia="'File Comuni Coinvestimento'"
		show-spinner="!loaderListaFiles" vista="$root.VIEW.CONTRATTO"> </now-table>
</div>

<section class="form-container form-process" ng-if="!showOnlyList">
	<div class="row">
		<div class="form-group" ng-class="{ 'has-error' : errorMsg }">
			<div class="col-xs-6">
				<div class="fileUpload btn btn-default">
					<span ng-if="!csvFile.name">Carica file CSV</span>
					<span ng-if="csvFile.name">{{csvFile.name}}</span> 
					<input type="file" ngf-select="onFileSelect($files, form)"	ng-change="onChangeFile(csvFile)" ng-model="csvFile" name="file" class="upload">
				</div>
				<div role="alert">	
					<span ng-if="form.file.$error.required" 
						class="help-block help-width">{{message}}</span>
				</div>
			</div>

			<div class="col-xs-5" ng-if="csvFile && !errorMsg && !useBroadcastForUpload">
				<button	ng-click="uploadFile(csvFile)" class="btn btn-disabled"
					ng-disabled="uploadingFile">Invia file</button>
			</div>
			<div class="col-xs-1">
				<img ng-if="uploadingFile" src="assets/i/loading.gif" />
			</div>
		</div>
	</div>
	<div class="row">
		<section class="form-heading exportTemplate col-xs-6"
			ng-if="csvFile && csvFile.progress >= 0 && csvFile.progress < 100 && !errorMsg">
			<div>
				<small><em>Invio del file in corso...</em></small>
				<uib-progressbar animate="true" value="csvFile.progress">
				<b>{{csvFile.progress | number:0}}%</b></uib-progressbar>
			</div>
		</section>
		<div class="upload_error" ng-if="errorMsg">ERRORE:
			{{errorMsg}}</div>
		<div class="upload_success"
			ng-if="csvFile && !errorMsg && csvFile.progress==100 && csvFile.result">Upload
			avvenuto con successo</div>
	</div>
</section>
