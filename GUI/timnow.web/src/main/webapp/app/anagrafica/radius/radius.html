<div class="content-section" ng-init="radiusLoaded">
	<section class="form-heading">
		<h1>Radius</h1>
	</section>
	
	<!-- SM_8904 -->
	<now-export-file 
		ng-if="radiusList.length>0"
		export-callback="iniziaExport"
		vista="$root.VIEW.RADIUS">
	</now-export-file>
	<div style="clear: both">
		<now-advanced-search 
			dati-to-search="paramToSearch"
			title="ricerca avanzata" 
			titolo="tipologia"
			callback="getSearchAdvanced()" 
			cod-funzione="tipologiaRicerca">
		</now-advanced-search>
		<now-table 
			dati="radiusList" 
			custom-header="headerList"
			tipologia="tipologia" 
			show-spinner="radiusLoaded">
		</now-table>
	</div>
</div>
