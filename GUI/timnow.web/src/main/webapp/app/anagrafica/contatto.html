<div class="content-section" ng-init="contactsLoaded">
	<section class="form-heading">
		<h1>Contatti</h1>
	</section>
	
	<!-- SM_8904 -->
	<now-export-file 
		ng-if="contacts.length>0"
		export-callback="iniziaExport"
		vista="$root.VIEW.CONTATTO">
	</now-export-file>
	<div style="clear:both">
			<now-advanced-search
			 dati-to-search="paramToSearch"
			 title="ricerca avanzata"
			 titolo="tipologia"
			 callback="getSearchAdvanced()"
			 cod-funzione="tipologiaRicerca"
			></now-advanced-search>
		<now-table 
		dati="contacts" 
		custom-header="headerList"
		tipologia="tipologia"					
		show-spinner="contactsLoaded"
		row-selection-callback="getDettaglioContatti" 
		></now-table>	
		</div>
</div>
