<div class="content-section">
	<section class="form-heading form-border">
		<a href="#" ui-sref="root.news({news:news})" class="nav-back">tutte	le News</a>
		<h1>News</h1>
	</section>
	<div ng-if="loadComplete" class="spinner_container_direttiva">
		<span us-spinner="{radius:18, width:3, length: 14}"></span>
	</div>
	<section class="user-content user-wrapper"
		ng-repeat="item in news | filter : {visible : true} as filteredItems"
		ng-show="$index == newsVisible">
		<div>
			<h4>{{item.title}}</h4>
			<span class="subtitle small detail">Data inserimento: {{item.insertDate}} - Data modifica: {{item.updateDate}}</span>
		</div>
		<div>{{item.content}}</div>
	</section>
	<section class="form-button">
		<button ng-disabled="newsVisible <= 0"
			ng-click="newsVisible = newsVisible - 1"
			class="btn btn-disabled btn-normal">NEWS PRECEDENTE</button>
		<button ng-disabled="newsVisible >= (filteredItems.length - 1)"
			ng-click="newsVisible = newsVisible + 1 "
			class="btn btn-disabled btn-normal">NEWS SUCCESSIVA</button>
	</section>
</div>
