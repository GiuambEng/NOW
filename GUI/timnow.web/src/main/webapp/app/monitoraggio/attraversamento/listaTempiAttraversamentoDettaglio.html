<!-------------------------        FORM HEADING SECTION       START ----------------------------- -->
<div class="content-section">
	<section class="form-heading">
		<h1>LISTA TEMPI ATTRAVERSAMENTO</h1>
	</section>
	<div class="form-heading">
		<button class="btn btn-disabled pull-left turn-back-detail" type="submit" ng-click="changeState()">&#60; indietro</button>
	</div>
	<!-- SM_8904 -->
	<now-export-file 
        ng-if="tempAttraversamento.length>0"
        export-callback="iniziaExport"
        vista="$root.VIEW.MONITORAGGIO_TEMPI_DETTAGLIO">
    </now-export-file>
	<section class="form-heading" style="margin-top:1px; clear: both;">
	<now-table
	dati="tempAttraversamento"
	tipologia="tipologia"	
	custom-header="headerList"
	show-spinner="tempAttraversamentoLoaded"
	is-large-with-h-scroll="true"
	></now-table>
	</section>
</div>
