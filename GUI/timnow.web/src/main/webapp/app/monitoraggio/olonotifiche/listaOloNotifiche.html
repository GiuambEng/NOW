<div class="content-section">
		<div class="alert alert-info text-center" role="alert">
			<strong>MONITORAGGIO NOTIFICHE OLO</strong>
		</div>
		<section class="user-content">
		<!-- SM_8904 -->
		<now-export-file 
			ng-if="listNotificheOlo.length>0"
			export-callback="iniziaExport"
			vista="$root.VIEW.MONITORAGGIO_NOTIFICHE_OLO">
		</now-export-file>
		</section>
		<section class="user-content">
		<now-advanced-search 
		dati-to-search="paramToSearch"
		title="ricerca avanzata"
		titolo="tipologia"
		callback="getSearchAdvanced()" 
		cod-funzione="tipologiaRicerca"
		always-open="true"
		save-disabled="true">
	</now-advanced-search>
		</section>		
	<section class="user-content" ng-show="showTable">
		<now-table 
			dati="listNotificheOlo" 
			custom-header="headerList"
			tipologia="tipologia"
			show-spinner="listLoaded"
			is-large-with-h-scroll="true"
			row-selection-callback="showRequestDetail">
		</now-table>
	</section>	
</div>
