<div class="content-section">
	<section class="form-heading">
		<h1>RIGENERAZIONE MAIL</h1>
	</section>
	<now-advanced-search 
		dati-to-search="paramToSearch"
		title="ricerca avanzata"
		titolo="tipologia"
		callback="getSearchAdvanced()" 
		cod-funzione="tipologiaRicerca"
		always-open="true"
		save-disabled="true">
	</now-advanced-search>
	<div ng-if="showSpinner"
			class="spinner_container_direttiva">
			<span us-spinner="{radius:18, width:3, length: 14}"></span>
	</div>
	<div ng-show="showTable">
		<edit-delete-now-table 
			dati="listaRichieste" 
			custom-header="headerList"
			tipologia="tipologia" 
			detail-arg="detailArg"
			abilita-custom-action="true"
			row-selection-callback="getListaNotifiche"
			is-large-with-h-scroll="true"
			show-spinner="listLoaded">
		</edit-delete-now-table>
	</div>
</div>
