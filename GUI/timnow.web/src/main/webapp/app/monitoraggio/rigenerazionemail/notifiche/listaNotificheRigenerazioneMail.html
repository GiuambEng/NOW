<div class="content-section">
	<section class="form-heading">
		<h1>RIGENERAZIONE MAIL - Lista Notifiche</h1>
	</section>
	<div ng-if="showSpinner"
			class="spinner_container_direttiva">
			<span us-spinner="{radius:18, width:3, length: 14}"></span>
	</div>
	<div ng-show="showTable">
		<edit-delete-now-table 
			dati="listaNotifiche" 
			custom-header="headerList"
			tipologia="tipologia" 
			detail-arg="detailArg"
			abilita-custom-action="true"
			custom-action-callback="rinviaNotifiche()"
			custom-action-label="Rinvia Notifiche"
			show-spinner="listLoaded">
		</edit-delete-now-table>
	</div>
	  <section class="form-button ">
   <button class="btn btn-disabled pull-left" type="submit" ng-click="changeState()">indietro</button>
  </section>
</div>
