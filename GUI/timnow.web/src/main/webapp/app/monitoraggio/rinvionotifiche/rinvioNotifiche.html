<div class="content-section">
	<section class="form-heading">
		<h1>RINVIO NOTIFICHE</h1>
	</section>
	<section>
		<now-table 
			dati="listaOlo" 
			custom-header="headersListaOlo"
			tipologia="tipologia"
			show-spinner="olosLoaded"
			row-selection-callback="selectOlo">
		</now-table>
	</section>
	<section ng-show="showResourcesTable" id="richiesteOLO">
		<div ng-if="invioResourcesSending" class="spinner_container_direttiva">
			<span us-spinner="{radius:18, width:3, length: 14}"></span>
		</div>
		<edit-delete-now-table 
			dati="listaRichiestePerOlo" 
			custom-header="headersListaRichieste"
			tipologia="tipologiaRichieste" 
			detail-arg="detailArgRichieste"
			abilita-custom-action="true"
			custom-action-callback="getNotifiche()"
			custom-action-label="Visualizza Notifiche"
			show-spinner="richiesteLoaded"
            is-large-with-h-scroll="true">
		</edit-delete-now-table>
	</section>
	<section ng-show="showNotificheTable" id="notificheOLO">
		<div ng-if="invioNotificheSending" class="spinner_container_direttiva">
			<span us-spinner="{radius:18, width:3, length: 14}"></span>
		</div>
		<edit-delete-now-table 
			dati="listaNotifiche" 
			custom-header="headersListaNotifiche"
			tipologia="tipologiaListaNotifiche" 
			detail-arg="detailArgNotifiche"
			abilita-custom-action="true"
			custom-action-callback="rinviaNotificheSelezionate()"
			custom-action-label="Rinvia Selezionati"
			show-spinner="notificheLoaded"
			is-large-with-h-scroll="true">
		</edit-delete-now-table>
	</section>
</div>
