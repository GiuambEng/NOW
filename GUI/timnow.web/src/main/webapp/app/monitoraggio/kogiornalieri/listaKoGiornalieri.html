<!-------------------------        FORM HEADING SECTION       START ----------------------------- -->

<div class="content-section">
	<section class="form-heading" >
	<div class="alert alert-info text-center" role="alert"><strong>Allarme Ko Giornalieri</strong> </div>	
	</section>
	<!-- SM_8904 -->
	<now-export-file 
			ng-if="koGiornal.length>0"
			export-callback="iniziaExport"
			vista="$root.VIEW.MONITORAGGIO_KO_GIORNALIERI">
		</now-export-file>
 <table class="monitTableSample">
 <thead>
  <tr>
    <th>Ambito</th>
    <th>Causale OLO</th>
    <th>Totale Odierno</th>
    <th>Soglia</th>
    <th>Media 5 gg lav</th>
    <th>Media 30 gg lav</th>
    <th></th>
  </tr>
 </thead>
 <tfoot ng-if="koGiornal.length > 0">
 <tr>	 
	<td></td>
	<td> </td>
	<td class="centerVal">{{tot}}</td>
	<td></td>
	<td></td>
	<td></td>
 </tr>
 </tfoot>
 <tbody>
  <tr ng-if="koGiornal.length > 0" ng-repeat="item in koGiornal" ng-init="totale(item.totaleOdierno)" ng-click="dettaglio(item.causaleOlo, item.ambito)" ng-class="{'warning-soglia':item.totaleOdierno>item.soglia}">
	  <td>{{item.ambito}}</td>
	  <td class="centerVal">{{item.causaleOlo}}</td>   
	  <td class="centerVal">{{item.totaleOdierno}}</td>
	  <td class="centerVal">{{item.soglia}}</td>   
	  <td class="centerVal">{{item.media5giorni}}</td>   
	  <td class="centerVal">{{item.media30giorni}}</td>   
	  <td><span class="glyphicon glyphicon-plus-sign" title="Dettaglio" aria-hidden="true"></span></td>   
  </tr>
 </tbody>
  
 
</table>
<div class="text-center"><span ng-show="loading"><img src="assets/i/loading.gif" /></span>{{ msg_err }}</div>
</div>
