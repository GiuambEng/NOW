<div class="content-section">
	<section class="form-heading">
		<h1>GENERAZIONE NOTIFICHE DA TEMPLATE</h1>
	</section>
	<div ng-if="!listaOlo" class="spinner_container_direttiva">
			<span us-spinner="{radius:18, width:3, length: 14}"></span>
	</div>
	<div ng-if="listaOlo" class="row page-container form-container" style="margin-bottom:15px;">
		<div  class="col-xs-12">
			<div ng-if="listaOlo" class="row form-process">
				<div  class="col-xs-6 form-horizontal">
					<div class="form-group">
		                    <label class="col-xs-4 control-label">Olo selezionato</label>
		                    <div class="col-xs-6">
		                    <input 
		                    	type="text" 
		                    	class="form-control SB-width" 
		                    	ng-model="oloSelezionato.olo"
		                    	disabled
		                    	placeholder="Seleziona..."
		                    	>
		                </div>
		                <div class="col-xs-2" style="padding-top: 7px;margin-bottom: 0;text-align: left;">
		              	  <a href="#" class="openpopup" ng-click="selezionataOlo($event)">
		                  	<img src="assets/css/i/form_arrow.png" alt="form">
		                  </a>
		                </div>
					</div>
				</div>
				<div class="col-xs-6 form-horizontal">
					<div class="form-group">
							<label class="col-xs-5 control-label">Data Richiesta</label>
							<div class="col-xs-7">
								<input type="text" name="dad"
									class="form-control SB-width selectDate" ng-click="openDP()" ng-change="selectDateOlo(dataRichiestaOlo)"
									uib-datepicker-popup="dd/MM/yyyy" ng-model="dataRichiestaOlo"
									is-open="popup_dp.opened" datepicker-options="dateOptions"
									close-text="Chiudi" alt-input-formats="altInputFormats"
									>
							</div>
		             </div>
				</div>
			</div>
		</div>
	</div>
	<div ng-show="showResourcesTable" id="richiesteOLO" class="row">
		<div  class="col-xs-12">
			<edit-delete-now-table 
				dati="listaRichiestePerOlo" 
				custom-header="headersListaRichieste"
				tipologia="tipologiaRichieste" 
				detail-arg="detailArgRichieste"
				abilita-custom-action="true"
				custom-action-callback="getNotificheAttese()"
				custom-action-label="Visualizza Notifiche Attese"
				show-spinner="richiesteLoading"
				is-large-with-h-scroll="true">
			</edit-delete-now-table>
		</div>
	</div>
	<section ng-show="showNotificheAtteseTable" id="notificheOLO">
		<edit-delete-now-table 
			dati="listaNotificheAttese" 
			custom-header="headersListaNotificheAttese"
			tipologia="tipologiaListaNotificheAttese" 
			detail-arg="detailArgNotificheAttese"
			abilita-custom-action="true"
			custom-action-callback="rigeneraNotificheSelezionate()"
			custom-action-label="Rigenera Selezionati"
			show-spinner="NotificheAtteseLoaded"
			is-large-with-h-scroll="true"
			>
		</edit-delete-now-table>
	</section>
</div>
