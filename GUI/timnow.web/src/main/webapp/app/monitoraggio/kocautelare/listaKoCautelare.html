<!-------------------------        FORM HEADING SECTION       START ----------------------------- -->

<div class="content-section">
	<section class="form-heading" >
	<div class="alert alert-info text-center" role="alert"><strong>MONITORAGGIO KO IN CAUTELARE</strong> </div>	
	</section>
	<!-- SM_8904 -->
	<now-export-file 
			ng-if="koCaut.length>0"
			export-callback="iniziaExport"
			vista="$root.VIEW.MONITORAGGIO_KO_CAUTELARE">
		</now-export-file>
 <table class="monitTableSample">
 <thead>
  <tr>
    <th>Causale Errore</th>
    <th>Offerta</th>
    <th>Totale</th>
    <th></th>
  </tr>
 </thead>
 <tfoot ng-if="koCaut.length > 0">
 <tr>
	 
	 <td ng-if="koCaut.length > 10" class="centerVal visTable">
			<label>Visualizza</label>
			<select class="selectmenu SB-width" name="Sec" ng-model="numList" ng-change="changeList(numList)">
				<option ng-repeat="item in pageSize.split(',')">{{item}}</option>
			</select>
	</td>
	<td ng-if="!koCaut || koCaut.length < 10">&nbsp;</td>
	<td>&nbsp;</td>
	<td class="centerVal">{{tot}}</td>
	<td>&nbsp;</td>
 </tr>
 </tfoot>
 <tbody>
  <tr ng-if="koCaut.length > 0" ng-repeat="item in koCaut" ng-click="dettaglio(item.servizio, item.causaleEsito)">
	  <td>{{item.causaleEsito}}</td>
	  <td>{{item.servizio}}</td>
	  <td class="centerVal" ng-init="totale(item.totale)">{{item.totale}}</td>   
	  <td><span class="glyphicon glyphicon-plus-sign" title="Dettaglio" aria-hidden="true"></span></td>   
  </tr>
 </tbody>
  
 
</table>
<div class="text-center"><span ng-show="loading"><img src="assets/i/loading.gif" /></span>{{ msg_err }}</div>
</div>
