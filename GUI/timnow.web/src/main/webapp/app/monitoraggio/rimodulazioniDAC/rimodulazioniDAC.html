<div class="page-container">
	<div class="content-section">
    <div class="alert alert-info text-center" role="alert"><strong>MONITORAGGIO RIMODULAZIONI DAC</strong> </div> 
 		<section class="order-summary">
        	<div id="tabs">
                  <h2 style="text-center">Operatore: {{operatore}}  - Data Estrazione: {{dataScadenza}}</h2>
                 <div class="button-list" >
                    <button class="ng-binding" ng-disabled="!refreshDisabilitato" ng-click="refresh();">
                        <span class="glyphicon glyphicon-refresh" aria-hidden="true"></span>
                        Refresh
                    </button>
                 </div>
				<table class="intoTable">
					<tbody>
						<tr>
							<td>Data Scadenza</td>
							<td>N&deg; Richieste in Scadenza</td>
							<td>Export Data</td>
						</tr>
						<tr>
                        <tr style="cursor: pointer;" ng-if="rimodulazioniDac.length > 0" ng-repeat="item in rimodulazioniDac">
							<td class="highlight">{{item.dataScadenza}}</td>
							<td class="highlight">{{item.richiesteInScadenza}}</td>
							<td class="highlight">							
								<!-- RU_935 -->
								<span ng-if="downloadFilePermission">
									<!-- SM_8906 -->
                                	<a ng-click="$event.stopPropagation();" href="rest/monitorings/rimodulazionidac/export/{{$index+1}}?vista={{vista}}" class="download-option-options">
                                		<img src="assets/i/download_file_a.png" alt="search" class="search">
                                	</a>
								</span>

                            </td>
						</tr>
					</tbody>
				</table>
			</div>
		</section>
	</div>
</div>
