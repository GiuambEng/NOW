<div class="content-section">
    <section class="form-heading">
        <h1>USER TASK</h1>
    </section>
    <div ng-if="showSpinner" class="spinner_container_direttiva">
        <span us-spinner="{radius:18, width:3, length: 14}"></span>
    </div>

    <div class="order-summary">

        <uib-tabset active="activeJustified" justified="true"> <uib-tab heading="Task per Scarto Improprio" id="tab-1">

        <div ng-show="showAction" class="form-group">
            <label class="col-xs-5 control-label">Azione</label>
            <div class="col-xs-7">
                <div class="selectParent">
                    <select class="selectmenu SB-width form-control" 
		                    ng-model="azioneSelezionata" 
		                    ng-change="setAzione(azioneSelezionata)" 
		                    ng-options="azione.value for azione in azioni"
		                    >
                        <option value="" selected="selected">Seleziona azione...</option>
                    </select>
                </div>
            </div>
        </div>

        <div ng-if="!showAction&&!showSpinner" class="form-group">
            <div class="col-xs-12">
                <label class="control-label">Non ci sono User Task per scarto Improprio</label>
            </div>
        </div>
        <span>&nbsp;</span>

        <div class="form-group" ng-if="azioneSelezionata && azioneSelezionata.key === 'SKIP_MOD' " style="height: 35px;">
            <label class="col-xs-5 control-label">Offerta</label>
            <div class="col-xs-7">
                <div class="selectParent">
                    <select class="selectmenu SB-width form-control" 
                    		ng-model="offertaImpropriaSelezionata" 
                    		ng-change="setOfferta(offertaImpropriaSelezionata,'improprio')"
                            ng-options="offertaImproprie.offerta for offertaImproprie in selectOffertaImproprie">
                        <option value="" selected="selected">Seleziona offerta...</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="form-group" ng-if="offertaImpropriaSelezionata && azioneSelezionata && azioneSelezionata.key === 'SKIP_MOD' " style="height: 35px;">
            <label class="col-xs-5 control-label">Tipologia Lavorazione</label>
            <div class="col-xs-7">
                <div class="selectParent">
                    <select class="selectmenu SB-width form-control" ng-model="tipoLavorazioneImpropriaSelezionata" ng-change="setTipologiaLavorazione(tipoLavorazioneImpropriaSelezionata,'improprio')"
                        ng-options="tipoLavorazioneImproprie.tipoLavorazione for tipoLavorazioneImproprie in selectTipoLavorazioneImproprie">
                        <option value="" selected="selected">Seleziona Tipologia Lavorazione...</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="form-group" ng-if="tipoLavorazioneImpropriaSelezionata && azioneSelezionata && azioneSelezionata.key === 'SKIP_MOD' " style="height: 35px;">

            <label class="col-xs-5 control-label">Scelta della Causale da Modificare</label>
            <div id="inputUsertaskModale" class="col-xs-6">
                <div class="selectParent">
                    <input type="text" class="form-control SB-width" readonly value="{{ causaleImpropriaSelezionata.idAnagraficaCausale }}"></input>
                    <button ng-if="causaleImpropriaSelezionata.idAnagraficaCausale" type="button" class="close buttonDeleteSelection" aria-label="Cancella Selezione"
                        ng-click="cancellaSelezioneCausale()">
                        <span aria-hidden="true"><img src="assets/css/i/close.png" alt="close"></span>
                    </button>

                    <a href="#" class="openpopup" ng-click="getCausali($event,'improprio')"> <img src="assets/css/i/form_arrow.png" alt="form"></a>
                </div>
            </div>

        </div>

        <div ng-if="causaleImpropriaSelezionata && azioneSelezionata && azioneSelezionata.key == 'SKIP_MOD'" style="clear: both; margin-top: 20px;">

            <edit-delete-now-table dati="userTaskCausaliImproprieFiltrate" custom-header="headerListImproprie" tipologia="tipologiaImpropria" detail-arg="detailArgImpropria"
                abilita-custom-action="true" custom-action-callback="rinviaUserTaskImproprie(detailArgImpropria)" custom-action-label="Scarto" show-spinner="listLoaded" is-large-with-h-scroll="true">
            </edit-delete-now-table>
        </div>

        <div ng-if="azioneSelezionata && azioneSelezionata.key == 'SKIP'" style="clear: both; margin-top: 20px;">
            <edit-delete-now-table dati="userTaskCausaliImproprieSkip" custom-header="headerListImproprie" tipologia="tipologiaImpropria" detail-arg="detailArgImpropriaSkip"
                abilita-custom-action="true" custom-action-callback="rinviaUserTaskImproprieSkip(detailArgImpropriaSkip)" custom-action-label="Scarto" show-spinner="listLoaded"
                is-large-with-h-scroll="true"> </edit-delete-now-table>
        </div>

        <div ng-if="azioneSelezionata && azioneSelezionata.key == 'RETRY'" style="clear: both; margin-top: 20px;">
            <edit-delete-now-table dati="userTaskCausaliImproprieRetry" custom-header="headerListImproprie" tipologia="tipologiaImpropria" detail-arg="detailArgImpropriaRetry"
                abilita-custom-action="true" custom-action-callback="rinviaUserTaskImproprieRetry(detailArgImpropriaRetry)" custom-action-label="Reinvio" show-spinner="listLoaded"
                is-large-with-h-scroll="true"> </edit-delete-now-table>
        </div>

        </uib-tab> <uib-tab heading="Task per NACK da DTU" id="tab-1">
        <div ng-if="showNack" style="clear: both">
            <edit-delete-now-table dati="userTaskCausaliSbagliate" custom-header="headerListSbagliate" tipologia="tipologiaSbagliata" detail-arg="detailArgSbagliata" abilita-custom-action="true"
                custom-action-callback="rinviaUserTaskSbagliate(detailArgSbagliata)" custom-action-label="Reinvio" show-spinner="listLoaded"> </edit-delete-now-table>
        </div>

        <div ng-if="!showNack" class="form-group">
            <div class="col-xs-12">
                <label class="control-label">Non ci sono Task per Nack da DTU</label>
            </div>
        </div>

        </uib-tab> <uib-tab heading="Task per Scarto Errato" id="tab-1">
        <div ng-if="showErrate" style="clear: both">
            <div class="form-group" style="height: 35px;">
                <label class="col-xs-5 control-label">Offerta</label>
                <div class="col-xs-7">
                    <div class="selectParent">
                        <select class="selectmenu SB-width form-control" ng-model="offertaErrataSelezionata" ng-change="setOfferta(offertaErrataSelezionata,'errata')"
                            ng-options="offertaErrate.offerta for offertaErrate in selectOffertaErrate">
                            <option value="" selected="selected">Seleziona offerta...</option>
                        </select>
                    </div>
                </div>
            </div>

            <div ng-show="offertaErrataSelezionata" class="form-group" style="height: 35px;">
                <label class="col-xs-5 control-label">Tipologia Lavorazione</label>
                <div class="col-xs-7">
                    <div class="selectParent">
                        <select class="selectmenu SB-width form-control" ng-model="tipoLavorazioneErrataSelezionata" ng-change="setTipologiaLavorazione(tipoLavorazioneErrataSelezionata,'errata')"
                            ng-options="tipoLavorazioneErrate.tipoLavorazione for tipoLavorazioneErrate in selectTipoLavorazioneErrate">
                            <option value="" selected="selected">Seleziona Tipologia Lavorazione...</option>
                        </select>
                    </div>
                </div>
            </div>
            <div ng-show="tipoLavorazioneErrataSelezionata" class="form-group" style="height: 35px;">

                <label class="col-xs-5 control-label">Scelta della Causale da Modificare</label>
                <div id="inputUsertaskModale" class="col-xs-6">
                    <div class="selectParent">
                        <input type="text" class="form-control SB-width" readonly value="{{ causaleErrataSelezionata.idAnagraficaCausale }}"></input>
                        <button ng-if="causaleErrataSelezionata.idAnagraficaCausale" type="button" class="close buttonDeleteSelection" aria-label="Cancella Selezione"
                            ng-click="cancellaSelezioneCausale()">
                            <span aria-hidden="true"><img src="assets/css/i/close.png" alt="close"></span>
                        </button>

                        <a href="#" class="openpopup" ng-click="getCausali($event,'errata')"> <img src="assets/css/i/form_arrow.png" alt="form"></a>
                    </div>
                </div>

            </div>
            <div ng-show="causaleErrataSelezionata" style="clear: both; margin-top: 20px;">

                <edit-delete-now-table dati="userTaskCausaliErrateFiltrate" custom-header="headerListErrate" tipologia="tipologiaErrata" detail-arg="detailArgErrata" abilita-custom-action="true"
                    custom-action-callback="rinviaUserTaskErrate(detailArgErrata)" custom-action-label="Scarto" show-spinner="listLoaded" is-large-with-h-scroll="true"> </edit-delete-now-table>
            </div>
        </div>
        <div ng-if="!showErrate" class="form-group">
            <div class="col-xs-12">
                <label class="control-label">Non ci sono Task per scarto Errato</label>
            </div>
        </div>

        </uib-tab> </uib-tabset>
    </div>
</div>
