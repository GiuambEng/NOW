<div class="modal-content code-block">
 <div class="modal-header">
  <button type="button" class="close" data-dismiss="modal" aria-label="Close" ng-click="modalOptions.close()"><span aria-hidden="true"><img src="assets/css/i/close.png" alt="close"></span></button>
  <h4>{{modalOptions.headerText}} </h4>
 </div>
 <div class="overflowauto">                               
 <table class="code-popup">
  <thead>
   <tr>
    <th ng-repeat="(key,value)  in modalOptions.dataHeader">{{value}}</th>
   </tr>
  </thead> 
  <tbody>  
   <tr ng-repeat="item in modalOptions.data" ng-click="modalOptions.selectionItem(item)" class="select-modal" ng-class="{'disable-select-modal':(item[modalOptions.disableAttributeKey])}">
    <td ng-repeat="(hkey,hvalue) in modalOptions.dataHeader"><span ng-if="!(modalOptions.disableAttributeKey==hkey)">{{item[hkey]}}</span></td>
   </tr>
  </tbody>
 </table>
 </div>
</div>
