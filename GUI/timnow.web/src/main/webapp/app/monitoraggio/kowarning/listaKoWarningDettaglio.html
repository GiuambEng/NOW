<!-------------------------        FORM HEADING SECTION       START ----------------------------- -->
<div class="content-section">
	<section class="form-heading">
		<h1>MONITORAGGIO KO DI TIPO WARNING</h1>
	</section>
	<!-- SM_8904 -->
	<now-export-file 
			ng-if="koData.length>0"
			export-callback="iniziaExport"
			vista="$root.VIEW.MONITORAGGIO_KO_WARNING_DETTAGLIO">
		</now-export-file>
	<section class="form-heading">
		<button class="btn btn-disabled pull-left turn-back-detail"	type="submit" ng-click="changeState()">&#60; indietro</button>
	</section>
	<now-table 
		dati="koData" 
		custom-header="headerList"
		tipologia="tipologia"	
		show-spinner="koDataLoaded"
		row-selection-callback="getDettaglio"		
		></now-table>
</div>
