<!-------------------------        FORM HEADING SECTION       START ----------------------------- -->

<div class="content-section">
	<section class="form-heading">
		<div class="alert alert-info text-center" role="alert">
			<strong>MONITORAGGIO KO DI TIPO WARNING</strong>
		</div>
	</section>
	<!-- SM_8904 -->
	<now-export-file 
			ng-if="koWarn.length>0"
			export-callback="iniziaExport"
			vista="$root.VIEW.MONITORAGGIO_KO_WARNING"> <!-- SM_8919 -->
		</now-export-file>
	<table class="monitTableSample">
		<thead>
			<tr>
				<th>Data Estrazione</th>
				<th>Causale Errore</th>
				<th>Totale</th>
				<th></th>
			</tr>
		</thead>
		<tfoot ng-if="koWarn.length > 0">
			<tr>
				<td></td>
				<td></td>
				<td class="centerVal">{{tot}}</td>
				<td></td>
			</tr>
		</tfoot>
		<tbody>
			<tr ng-if="koWarn.length > 0"
				ng-repeat="item in koWarn"
				ng-click="dettaglio(item.dataEstrazione, item.causaleErrore)">
				<td>{{item.dataEstrazione}}</td>
				<td class="centerVal">{{item.causaleErrore}}</td>
				<td class="centerVal" ng-init="totale(item.totale)">{{item.totale}}</td>
				<td><span class="glyphicon glyphicon-plus-sign"	title="Dettaglio" aria-hidden="true"></span></td>
			</tr>
		</tbody>
	</table>
	<div class="text-center">
		<span ng-show="loading"><img src="assets/i/loading.gif" /></span>{{	msg_err }}
	</div>
</div>
