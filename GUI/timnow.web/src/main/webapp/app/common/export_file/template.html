	<section class="form-heading exportTemplate" >
			<div ng-show="exporting">
				<small><em>Creazione del file in corso...</em></small>
   				<uib-progressbar animate="true" value="exportPercentage"><b>{{exportPercentage | number:0}}%</b></uib-progressbar>
			</div>
			<div class="button-list" ng-show="exporting">
				<button  class="ng-binding" ng-click="resetExport()"><span class="glyphicon glyphicon-remove" aria-hidden="true"></span> Interrompi</button>
			</div>
			<!-- SM_8899 -->
			<div class="button-list" ng-hide="exporting" ng-if="!$root.isOPCCUser() && fileType == null">
				<button  class="ng-binding" ng-click="iniziaExport()"><span class="glyphicon glyphicon-save" aria-hidden="true"></span> Export Dati</button>
			</div>
			<!--RU_716 NUOVO CONTRATTO-->
			<div class="button-list" ng-if="checkContrattoButton() "> 
				<button  class="ng-binding" ng-click="nuovoContratto()"><span class="glyphicon glyphicon-plus" aria-hidden="true"></span>Nuovo Contratto</button>
			</div>
			
			<!-- RU_963 -->
			<div class="button-list" ng-hide="exporting" ng-if="!$root.isOPCCUser() && fileType != null">
				<button class="ng-binding" ng-click="iniziaExport()"><span class="glyphicon glyphicon-save" aria-hidden="true"></span> Export Dati {{fileType.toUpperCase()}}</button>
			</div>
	</section>
