
<div class="page-container" style="padding: 15px;">
    <div class="content-section">
        <section class="order-summary">
            <div id="tabs">
                <h3>Ricerca Avanzata {{titolo}}</h3>

                <!-- Sezione Salvataggio Ricerca START -->
                <div ng-if="tipoDirettiva=='salva'">
                    <form class="form-container" ng-submit="salvaRicercaForm.$valid" name="salvaRicercaForm" novalidate>
                        <table class="table-detail">
                            <tbody>
                                <tr>
                                    <td>Nome Filtro:
                                    <td>
                                        <div class="form-group" ng-class="{ 'has-error' : ((salvaRicercaForm.nomeFiltro.$invalid && !salvaRicercaForm.nomeFiltro.$pristine) || ricercaEsistente) }">
                                            <input type="text" name="nomeFiltro" class="form-control SB-width" ng-model="nomeFiltro" required> <span
                                                ng-if="salvaRicercaForm.nomeFiltro.$invalid && !salvaRicercaForm.nomeFiltro.$pristine" class="help-block help-width">Campo Obbligatorio</span>
                                        </div>
                                    </td>
                                </tr>
                                <tr>
                                    <td>Descrizione:</td>
                                    <td>
                                        <div class="form-group" ng-class="{ 'has-error' : ( salvaRicercaForm.descrizione.$invalid && !salvaRicercaForm.descrizione.$pristine )}">
                                            <input type="text" name="descrizione" class="form-control SB-width" ng-model="descrizione" required> <span
                                                ng-if="salvaRicercaForm.descrizione.$invalid && !salvaRicercaForm.descrizione.$pristine" class="help-block help-width">Campo Obbligatorio</span>
                                        </div>
                                    </td>

                                </tr>
                                <tr ng-show="ricercaEsistente">
                                    <td colspan="2">
                                        <div class="form-group has-error">
                                            <div role="alert">
                                                <span class="help-block help-width">Esiste gi&agrave; una ricerca salvata con questo Nome Filtro</span>
                                            </div>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                        <div class="tab-bottom row">
                            <div class="col-xs-6">
                        <button class="btn btn-disabled" type="submit" ng-click="salva(salvaRicercaForm,nomeFiltro,descrizione)">Salva Ricerca</button>
                    </div>
                            <div class="col-xs-6">
                        <button class="btn btn-disabled" ng-click="close()">Chiudi</button>
                    </div>
                        </div>
                    </form>


                </div>
                <!-- Sezione Salvataggio Ricerca END -->
            </div>

            <!-- Sezione Cerca Ricerche START -->
            <div ng-if="tipoDirettiva=='cerca'">

                <table class="table-detail">
                    <tr>
                        <th>Nome</th>
                        <th>Descrizione</th>
                        <th>Seleziona</th>
                        <th>Elimina</th>
                    </tr>
                    <tbody>
                        <tr ng-if="ricerche.length>0" ng-repeat="ricerca in ricerche track by $index">
                            <td><span>{{ricerca.nomeFiltro}} </span></td>
                            <td><span>{{ricerca.description}}</span></td>
                            <td align="center"><span class="glyphicon glyphicon-ok-sign" ng-click="chooseRicerca($index)" style="color: #004388; cursor: pointer;"></span></td>
                            <td align="center"><span ng-show="!Quest$index" class="glyphicon glyphicon-trash" ng-click="Quest$index = true" style="color: #004388; cursor: pointer;"></span> <span
                                ng-show="Quest$index"> Sei Sicuro? <a ng-click="deleteRicerca(ricerca.nomeFiltro); Quest$index = false;"> Si </a> - <a ng-click="Quest$index = false"> No </a></span></td>
                        </tr>
                        <tr ng-if="ricerche.length<=0">
                            <td colspan="3" style="text-align: center;">Nessuna ricerca salvata precedentemente</td>
                        </tr>
                    </tbody>
                </table>
                <div ng-if="loadElimina" class="spinner_container_direttiva">
                    <span us-spinner="{radius:18, width:3, length: 14}"></span>
                </div>
                <hr>
                <div class="tab-bottom">
                    <button class="btn btn-disabled" ng-click="close()">Chiudi</button>
                </div>
            </div>
            <!-- Sezione Cerca Ricerche END -->
        </section>
    </div>
</div>

</body>
</html>
