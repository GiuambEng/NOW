<script type="text/ng-template" id="accordion-group-template.html">
    <div class="panel {{panelClass || 'panel-default'}} ">
        <div class="panel-heading">
            <h4 class="panel-title">
                <a href tabindex="0" ng-class="{'collapsed': !isOpen}" ng-click="toggleOpen()" uib-accordion-transclude="heading">{{heading}}</a>
            </h4>
        </div>
        <div class="panel-collapse " ng-class="{'in': !isOpen}" uib-collapse="!isOpen">
            <div class="panel-body" ng-transclude>&nbsp;</div>
        </div>
    </div>
</script>
