<div> 
	<section id="tableNowDirective"  > 
	<form ng-submit="addForm.$valid && addItem()" class="form-container" name="addForm" novalidate>
        <section class="form-process">
            <div class="col-xs-12 form-horizontal">
                <button class="btn btn-disabled pull-left turn-back-detail" type="submit" ng-click="changeState()">&#60; indietro</button>
  			</div>
  			<div class="col-xs-12 form-horizontal">
                <!--  ADD SECTION  -->
                <div ng-if="ctrlDirettiva.dati==''" ng-repeat="it in ctrlDirettiva.detailList" class="form-group" ng-class="{ 'has-error' :addForm[it.key].$invalid && !addForm[it.key].$pristine }">
                    <label class="col-xs-5 control-label">{{::it.value}}<sup ng-if="it.required">*</sup></label>
                    <div class="col-xs-7">
                        <input  ng-if="it.type=='text'" ng-required="it.required" type="text" name="{{it.key}}" class="form-control SB-width" ng-model="it.valore" >
                        <input ng-if="it.type=='checkbox'" type="checkbox" name="{{it.key}}"  ng-model="it.valore" ng-init="it.valore=it.default || false" >
                         <textarea ng-if="it.type=='textarea'" ng-required="it.required" name="{{it.key}}" id="" cols="30" rows="5" ng-model="it.valore" class="form-control text-area"  ></textarea>
                        <input ng-if="it.type=='date'" 
                                    type="text"
                                    name="{{it.key}}"
                                    class="form-control SB-width selectDate"
                                    uib-datepicker-popup="dd/MM/yyyy"
                                    ng-click="it.opened=true"
                                    is-open="it.opened"
                                    ng-model="it.valore"
                                    datepicker-options="option"
                                    ng-required="it.required"
                                    close-text="Chiudi"
                            />
                         <select class="selectmenu SB-width form-control" name="{{it.key}}" ng-required="it.required" ng-model="it.valore" ng-if="it.type=='select'"
							ng-options="item.value as item.label for item in it.valuesList">
						 </select>
                        <div role="alert">
                             <span ng-if="addForm[it.key].$error.required && !addForm[it.key].$pristine" class="help-block help-width">Compila questo campo</span>
                         </div>

                    </div>
                </div>
                
                <!--  EDIT SECTION  -->
                <div ng-init="init()">
                <div  ng-if="ctrlDirettiva.dati!=''" ng-repeat="it in ctrlDirettiva.detailList" class="form-group" ng-class="{ 'has-error' :addForm[it.key].$invalid && !addForm[it.key].$pristine }">
                    <label class="col-xs-5 control-label" ng-if="it.type!='none'">{{::it.value}}<sup ng-if="it.required">*</sup></label>
                    <div class="col-xs-7">
                     <input ng-if="it.type=='text'" ng-required="it.required" ng-value="ctrlDirettiva.dati[it.key]"  type="text" name="{{it.key}}" class="form-control SB-width" ng-model="it.valore" >
                     <input ng-if="it.type=='text_disabled'" ng-value="ctrlDirettiva.dati[it.key]"  type="text" name="{{it.key}}" class="form-control SB-width" disabled >
                     <input ng-if="it.type=='checkbox'" type="checkbox" name="{{it.key}}"  ng-model="it.valore" >
                     <span  ng-if="it.type=='checkbox_disabled' && !it.valore"
							class="glyphicon glyphicon-unchecked" aria-hidden="true"
							style="color: #004388"></span> 
					<span   ng-if="it.type=='checkbox_disabled' && it.valore"
							class="glyphicon glyphicon-check" aria-hidden="false"
							style="color: #004388"></span>
                    <textarea ng-if="it.type=='textarea'"  ng-required="it.required" name="{{it.key}}" id="" cols="30" rows="5" ng-model="it.valore" class="form-control text-area"  ></textarea>
                    <input ng-if="it.type=='date'" 
                                    type="text"
                                    ng-value="ctrlDirettiva.dati[it.key]"
                                    name="{{it.key}}"
                                    class="form-control SB-width selectDate"
                                    uib-datepicker-popup="dd/MM/yyyy"
                                    ng-click="it.opened=true"
                                    is-open="it.opened"
                                    ng-model="it.valore"
                                    datepicker-options="option"
                                    ng-required="it.required"
                                    close-text="Chiudi"
                            />
                    <select class="selectmenu SB-width form-control" name="{{it.key}}" ng-required="it.required" ng-value="ctrlDirettiva.dati[it.key]" ng-model="it.valore" ng-if="it.type=='select'"
						ng-options="item.value as item.label for item in it.valuesList" >
				 	</select>
                    <div role="alert">
                         <span ng-if="addForm[it.key].$error.required && !addForm[it.key].$pristine" class="help-block help-width">Compila questo campo</span>
                     </div>
                 </div>
             </div>
            </div>
        </div>
	    <div class="col-xs-12 madatory-field paddL0">
	        <i>*Campo obbligatorio</i>
	    </div>
	</section>
	<section class="form-button">
	 	<span ng-show="ctrlDirettiva.insertUpdate"><img src="assets/i/loading.gif" /></span>
	    <button ng-if="ctrlDirettiva.dati==''" class="btn blue-btn" ng-disabled="ctrlDirettiva.insertUpdate" type="submit" ng-click="addItem(addForm)">Crea</button>
	    <button ng-if="ctrlDirettiva.dati!='' && ctrlDirettiva.isAuthorized" class="btn blue-btn" ng-disabled="ctrlDirettiva.insertUpdate" type="submit" ng-click="addItem(addForm)">Salva</button>
	</section>
</form>
</section>
</div>
