<!-------------------------        FORM HEADING SECTION       START ----------------------------- -->
<div class="content-section">
	<section class="form-heading">
		<h1>Lista Asset Accesso</h1>
	</section>
	
	<!-- SM_8904 -->
	<now-export-file 
        ng-if="assets.length>0"
        export-callback="iniziaExport"
        vista="$root.VIEW.ASSET">
    </now-export-file>
	<div style="clear:both">
		   <now-advanced-search
			 dati-to-search="paramToSearch"
			 title="ricerca avanzata"
			 titolo="tipologia"
			 always-open="enableRicercaAsset"
			 callback="getSearchAdvanced()"
			 cod-funzione="tipologiaRicerca"
			></now-advanced-search>
	<div  ng-if="!enableRicercaAsset">
		<now-table 
		dati="assets" 
		custom-header="headerList"
		tipologia="tipologia"					
		show-spinner="assetsLoaded"
			row-selection-callback="getDettaglioAsset">
		</now-table>
	</div>
	<div ng-if="enableRicercaAsset">Si invita l'utente ad utilizzare la Ricerca Avanzata per recuperare gli Asset di interesse.</div>
	</div>
</div>
