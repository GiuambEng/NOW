<div class="content-section">
    <section class="form-heading">
        <h1>Lista Richiesta Ricariche</h1>
    </section>
    <section class="form-heading" ng-if="typeRecharged">
        <button class="btn btn-disabled pull-left turn-back-detail" type="submit" ng-click="changeState()">< indietro</button>
    </section>
    
    <!-- SM_8904 -->
    <now-export-file
            ng-if="(listarichieste.length>0) && !typeRecharged"
            export-callback="iniziaExport"
            vista="$root.VIEW.RICHIESTE_RICARICHE">
    </now-export-file>
    <div style="clear:both">
        <div  ng-show="!typeRecharged">
            <now-advanced-search
                    dati-to-search="paramToSearch"
                    title="ricerca avanzata"
                    titolo="tipologia"
                    always-open="enableRicercaRicariche"
                    callback="getSearchAdvanced()"
                    cod-funzione="tipologiaRicerca"
            ></now-advanced-search>
        </div>
        <div  ng-if="!enableRicercaRicariche">

            <now-table
                    dati="listarichieste"
                    custom-header="headerList"
                    tipologia="tipologia"
                    show-spinner="RicaricaLoaded"
                    is-large-with-h-scroll="true"
            ></now-table>
        </div>
        <div ng-if="enableRicercaRicariche && !typeRecharged">Si invita l'utente ad utilizzare la Ricerca Avanzata per recuperare le richieste ricarica di interesse.</div>
    </div>
</div>
