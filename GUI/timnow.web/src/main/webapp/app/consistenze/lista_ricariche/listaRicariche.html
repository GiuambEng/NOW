<div class="content-section">
    <section class="form-heading">
        <h1>Lista Ricariche</h1>
    </section>
    <section class="user-content">
        <form class="form-horizontal">

            <div class="ricercaAvanzataSection">
                <label class="control-label col-sm-4">ID Risorsa</label>
                <div class="col-sm-3">
                    <input type="text" class="form-control" name="id-risorsa" ng-model="idRisorsa" />
                </div>
                <div class="col-sm-5">
                    <button type="submit" class="btn btn-disabled" ng-disabled="!idRisorsa" ng-click="search()">Ricerca</button>
                </div>
            </div>

            <div class="form-group">

            </div>
        </form>
    </section>
    <div style="clear:both">
        <div ng-if="!RicaricaLoaded" class="spinner_container_direttiva">
            <span us-spinner="{radius:18, width:3, length: 14}"></span>
        </div>
        
        <!-- SM_8904 -->
        <now-export-file
                ng-if="ricariche.length>0"
                export-callback="iniziaExport"
                vista="$root.VIEW.RICARICHE">
        </now-export-file>
        <div class="button-list" ng-if="RicaricaLoaded && dettaglioAsset && !tastiAbilitati">
            <button ng-click="ricarica('schedulata')" ng-disabled="dettaglioAsset.statoAssetDinamico == 'CESSATO'">
                <span class="glyphicon glyphicon-plus" aria-hidden="true"></span>
                Nuova Ricarica Schedulata
            </button>
        </div>
        <div class="button-list" ng-if="RicaricaLoaded && dettaglioAsset && !tastiAbilitati">
            <button ng-click="ricarica('NRT')" ng-disabled="dettaglioAsset.statoAssetDinamico == 'CESSATO'">
                <span class="glyphicon glyphicon-plus" aria-hidden="true"></span>
                Nuova Ricarica Near Real Time
            </button>
        </div>
        <div  ng-if="RicaricaLoaded && dettaglioAsset">
            <now-table
                    dati="ricariche"
                    dati-option="dettaglioAsset"
                    custom-header="headerList"
                    tipologia="tipologia"
                    detail-list="detailList"
                    show-spinner="RicaricaLoaded"
            ></now-table>
        </div>


        <div>
            <div class="col-sm-2"></div>
            <div class="col-sm-8">
                <div ng-if="enableRicercaRicariche" style="text-align: center;">Si invita l'utente ad utilizzare la Ricerca Avanzata per recuperare le ricariche di interesse.</div>
            </div>
            <div class="col-sm-2"> </div>
        </div>

    </div>
</div>
