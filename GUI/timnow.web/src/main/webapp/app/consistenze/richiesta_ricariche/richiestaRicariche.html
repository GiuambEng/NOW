<div class="content-section" >
    <section class="form-heading">
        <h1>Richiesta {{typeRecharged}}</h1>
    </section>
    <section class="form-heading">
        <button class="btn btn-disabled pull-left turn-back-detail" type="submit" ng-click="changeState()">< indietro</button>
    </section>

    <form ng-submit="richiestaRicaricaForm.$valid && submit()" class="form-container" name="richiestaRicaricaForm" novalidate>
        <section class="form-process">
            <div class="col-xs-6 form-horizontal paddL0">
                <div class="form-group" >
                    <label class="col-xs-5 control-label">ID Risorsa</label>
                    <div class="col-xs-7">
                        <div class="selectParent">
                            <input type="text"
                                   class="form-control SB-width"
                                   name="idRisorsa"
                                   ng-model="ricarica.idRisorsa"
                                   disabled
                            />
                        </div>
                    </div>
                </div>
                <div class="form-group" >
                    <label class="col-xs-5 control-label">Offerta</label>
                    <div class="col-xs-7">
                        <div class="selectParent">
                            <input type="text"
                                   class="form-control SB-width"
                                   name="offerta"
                                   ng-model="ricarica.offerta"
                                   disabled
                            />
                        </div>
                    </div>
                </div>
                <div class="form-group" >
                    <label class="col-xs-5 control-label">Codice Ordine TI</label>
                    <div class="col-xs-7">
                        <div class="selectParent">
                            <input type="text"
                                   class="form-control SB-width"
                                   name="codiceOrdineTI"
                                   ng-model="ricarica.codiceOrdineTI"
                                   disabled
                            />
                        </div>
                    </div>
                </div>

                <div class="form-group" ng-if="ricarica.tipologiaAccensioneRicarica == 'NRT' || !ricarica.tipologiaAccensioneRicarica">
                    <label class="col-xs-5 control-label">Data Inizio Ricarica</label>
                    <div class="col-xs-7 selected-item"  id="data-creazione">
                        <span  >{{ricarica.DataInizioRicarica}}</span>

                    </div>
                </div>

                <div class="form-group" ng-if="(ricarica.tipologiaAccensioneRicarica == 'schedulata')" ng-class="{ 'has-error' : richiestaRicaricaForm.InizioRicaricaData.$invalid && !richiestaRicaricaForm.InizioRicaricaData.$pristine }">
                    <label class="col-xs-5 control-label">Data Inizio Ricarica<sup>*</sup></label>

                    <div class="col-xs-7" >
                        <input
                                type="text"
                                name="InizioRicaricaData"
                                class="form-control SB-width selectDate"
                                ng-click="openDP3()"
                                uib-datepicker-popup="{{format}}"
                                ng-model="ricarica.DataInizioRicarica"
                                is-open="popup_dp3.opened"
                                datepicker-options="dateOptions"
                                close-text="Chiudi"
                                alt-input-formats="altInputFormats"
                                ng-change="convertStringToDate()"
                                required
                        >

                        <div role="alert">
                            <span ng-if="richiestaRicaricaForm.InizioRicaricaData.$invalid && richiestaRicaricaForm.$submitted" class="help-block help-width">Compila questo campo</span>
                        </div>
                    </div>
                </div>
                <div class="form-group" ng-if="(ricarica.tipologiaAccensioneRicarica == 'schedulata') " ng-class="{ 'has-error' : richiestaRicaricaForm.InizioRicaricaOra.$invalid && !richiestaRicaricaForm.InizioRicaricaOra.$pristine }">
                    <label class="col-xs-5 control-label">Ora Inizio Ricarica<sup>*</sup></label>

                    <div class="col-xs-7" >
                        <select class="selectmenu SB-width form-control"
                                name="InizioRicaricaOra"
                                ng-model="ricarica.OraInizioRicarica"
                                required
                        >
                            <option ng-repeat="ore in time" value="{{ore}}">{{ore}}</option>
                        </select>
                        <div role="alert">
                            <span ng-if="richiestaRicaricaForm.InizioRicaricaOra.$invalid && richiestaRicaricaForm.$submitted" class="help-block help-width">Compila questo campo</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-xs-6 form-horizontal">
                <div class="form-group" >
                    <label class="col-xs-5 control-label">Tipo Lavorazione</label>
                    <div class="col-xs-7">
                        <div class="selectParent">
                            <input type="text"
                                   class="form-control SB-width"
                                   name="tipoLavorazione"
                                   ng-model="ricarica.tipoLavorazione"
                                   disabled
                            />
                        </div>
                    </div>
                </div>
                <div class="form-group" ng-class="{ 'has-error' : richiestaRicaricaForm.taglioRicaricaInGiorni.$invalid && !richiestaRicaricaForm.taglioRicaricaInGiorni.$pristine }">
                    <label class="col-xs-5 control-label">Taglio Ricarica in Giorni<sup>*</sup></label>
                    <div class="col-xs-7">
                        <div class="selectParent"
                        ng-if="ricarica.tipoLavorazione != 'ANNULLAMENTO'">
                            <select
                                    class="selectmenu SB-width form-control"
                                    name="taglioRicaricaInGiorni"
                                    ng-model="ricarica.taglioRicaricaInGiorni"
                                    ng-change="convertStringToDate()"
                                    required>
                                <option ng-repeat="item in taglioRicarica" >{{item.taglioRicarica}}</option>
                            </select>
                            <div role="alert">
                                <span ng-if="richiestaRicaricaForm.taglioRicaricaInGiorni.$invalid && !richiestaRicaricaForm.taglioRicaricaInGiorni.$pristine" class="help-block help-width">Seleziona un'opzione</span>
                            </div>
                        </div>
                        <div class="selectParent"
                             ng-if="ricarica.tipoLavorazione == 'ANNULLAMENTO'">
                            <input type="text"
                                   class="form-control SB-width"
                                   name="taglioRicaricaInGiorni"
                                   ng-model="ricarica.taglioRicaricaInGiorni"
                                   disabled
                            />
                        </div>
                    </div>
                </div>
                <div class="form-group" >
                    <label class="col-xs-5 control-label">Codice Ordine OAO</label>
                    <div class="col-xs-7">
                        <div class="selectParent">
                            <input type="text"
                                   class="form-control SB-width"
                                   name="codiceOrdineOao"
                                   ng-model="ricarica.codiceOrdineOao"
                                   disabled
                            />
                        </div>
                    </div>
                </div>
                <div class="form-group" ng-class="{ 'has-error' : richiestaRicaricaForm.dataFineRicarica.$invalid && !richiestaRicaricaForm.dataFineRicarica.$pristine }">
                    <label class="col-xs-5 control-label">Data Fine Ricarica<sup>*</sup></label>
                    <div class="col-xs-7 selected-item" >
                        <span >{{ricarica.dataFine}}</span>

                    </div>
                </div>
            </div>
            <div class="col-xs-12 form-horizontal">
                <div class="form-group" >
                    <div class="col-xs-3">
                        <label>Note</label>
                    </div>
                    <div class="col-xs-8">
                        <textarea
                                name="note_operatore"
                                id="noteDaOperatore"
                                cols="30"
                                rows="5"
                                class="form-control"
                                placeholder="Inserisci eventuali note"
                                ng-model="ricarica.noteDaOperatore"
                                ng-maxlength="255"
                        ></textarea>
                    </div>
                </div>
            </div>
            <div class="col-xs-12 madatory-field paddL0">
                <i>*Campo obbligatorio</i>
            </div>
        </section>
        <section class="form-button">
            <span ng-show="inCarica"><img src="assets/i/loading.gif" /></span>
            <button  class="btn btn-disabled" type="button" ng-click="confermaAnnulla()" ng-disabled="inCarica">Annulla</button>
            <button class="btn blue-btn"  type="submit" ng-click="valida(richiestaRicaricaForm)" ng-disabled="inCarica">avanti</button>
        </section>
    </form>
</div>
