<div class="content-section">
    <section class="form-heading">
        <h1>Cessazione asset n. {{assetId}}</h1>
    </section>
    <section class="process-steps-wrapper">
        <div class="process-steps-label">
            <span class="steps2">Intestazione<br>ordine</span>
            <span class="steps2"><strong>Dettaglio<br>ordine</strong></span>
            <span class="steps2"><strong>Dati<br>ordine Aggiuntivi</strong></span>
            <span class="steps2">Riepilogo<br>ordine</span>
        </div>
        <div class="process-steps step-4">
            <span><em class="active">1</em></span><span class="line grey">&nbsp;</span>
            <span><em class="inactive">2</em></span><span class="line grey">&nbsp;</span>
            <span><em class="inactive">3</em></span><span class="line grey">&nbsp;</span>
            <span><em class="inactive">4</em></span>
        </div>
    </section>
    <div class="tab-wrapper no-border">
        <button class="btn btn-disabled turn-back-2" ng-click="backState()">&#60; indietro</button>
    </div>

    <form ng-submit="cessazioneAssetForm.$valid && submit_1()" class="form-container" name="cessazioneAssetForm" novalidate>
        <section class="form-process sectionHeight346">
            <div class="col-xs-6 form-horizontal paddL0">
                <div class="form-group">
                    <label class="col-xs-5 control-label">Causale Ordine</label>
                    <div class="col-xs-7 selected-item">
                       <span
                               ng-bind="data.step1.causale_ordine"
                               ng-init="data.step1.causale_ordine = 'Cessazione'"
                       ></span>
                    </div>
                </div>
                <div class="form-group">
                    <label class="col-xs-5 control-label">OAO</label>
                    <div class="col-xs-7 selected-item">
                        <span>{{data.step1.codice_operatore.codiceOLO}}</span>
                    </div>
                </div>
            </div>
            <div class="col-xs-6 form-horizontal">
                <div class="form-group" ng-class="{ 'has-error' : cessazioneAssetForm.codice_ordine.$invalid && !cessazioneAssetForm.codice_ordine.$pristine }">
                    <label class="col-xs-5 control-label">Codice Ordine<sup>*</sup></label>
                    <div class="col-xs-7">
                        <input type="text" name="codice_ordine" class="form-control SB-width" ng-model="data.step1.codice_ordine" maxlength="{{codordpadlngt}}" ng-minlength="1" ng-maxlength="codordpadlngt" required>
                        <span ng-if="cessazioneAssetForm.codice_ordine.$invalid && !cessazioneAssetForm.codice_ordine.$pristine" class="help-block help-width">Compila questo campo</span>
						<span ng-if="cessazioneAssetForm.codice_ordine.$error.maxlength" class="help-block help-width">Inserire al massimo {{codordpadlngt}} caratteri</span>
                    </div>
                </div>
                <div class="form-group" ng-class="{ 'has-error' : cessazioneAssetForm.codice_ordine_padre.$invalid && !cessazioneAssetForm.codice_ordine_padre.$pristine }">
                    <label class="col-xs-5 control-label">Codice Ordine Padre </label>
                    <div class="col-xs-7">
                        <input type="text" 
                        	   name="codice_ordine_padre" 
                        	   class="form-control SB-width" 
                        	   ng-model="data.step1.codice_ordine_padre" 
                        	   maxlength="{{codordpadlngt}}" 
                        	   ng-minlength="1" 
                        	   ng-maxlength="codordpadlngt" >
                        <span ng-if="cessazioneAssetForm.codice_ordine_padre.$error.maxlength" class="help-block help-width">Inserire al massimo {{codordpadlngt}} caratteri</span>
                    </div>
                </div>
            </div>
        </section>
        <section class="form-button">
               <div class="col-xs-12 madatory-field paddL0 text-left">
                   <i>*Campo obbligatorio</i>
               </div>
            <button class="btn blue-btn" type="submit" ng-click="valida(cessazioneAssetForm)">avanti
            </button>
        </section>
    </form>
</div>
