<!-- RU_1301  -->
<style>
	.table tbody tr:nth-of-type(odd) td:last-child {
		padding-right: 30px !important;
	}
	
	.page-container .content-section {
		max-width: 75vw !important;
	}
	
	.pre {
		white-space: pre-line !important;
	}
</style>
<div class="content-section">
	<section class="form-heading">
		<h1>Gestione File Comuni Coinvestimento</h1>		
	</section>
	
	<section class="form-heading" ng-if="paramToSearch && paramToSearch.length > 0">
		<div class="button-list"> 
			<button  class="ng-binding" ng-click="getSearchAdvanced()"><span class="glyphicon glyphicon-refresh" aria-hidden="true"></span> Aggiorna Lista</button>
		</div>
	</section>
	
	<div style="clear:both">
		<now-advanced-search dati-to-search="paramToSearch"
			always-open="enableRicercaComuniCoinvestimento" title="ricerca avanzata"
			titolo="tipologia" callback="getSearchAdvanced()"
			cod-funzione="tipologiaRicerca"></now-advanced-search>
		<div ng-if="!enableRicercaComuniCoinvestimento">
			<now-table 
				dati="files" 
				custom-header="headerList"
				tipologia="tipologia"
				detail-list="detailList"
				show-spinner="filesLoaded"
				vista="$root.VIEW.COMUNI_COINVESTIMENTO">
			</now-table>	
		</div>
		
	</div>
</div>
