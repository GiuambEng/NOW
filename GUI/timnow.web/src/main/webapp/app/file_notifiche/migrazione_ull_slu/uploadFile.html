<div class="content-section">
    <section class="form-heading">
        <h1>Upload file</h1>
    </section>
    <form class="form-container" name="uploadForm">
        <section class="form-process">
            <p>Inserisci un file CSV per la migrazione degli accessi ULL/SLU</p>
            <br>
            <div class="fileUpload btn btn-default">
                <span ng-if="!fileName">Scegli file</span><span ng-if="fileName" style="text-transform: none">{{fileName}}</span>
                <input type="file" accept=".csv,text/csv" ngf-select="onFileSelect($files)" ng-model="csvFile" name="file" class="upload" required>
            </div>
            <div class="upload_error" ng-if="errorMsg">{{errorMsg}}</div>
            <div class="upload_success" ng-if="successMsg">{{successMsg}}</div>
        </section>
        <section class="form-button">
            <div id="spinner_migrazione_ull_slu" ng-if="uploadingFile" class="spinner_container_direttiva">
                <span us-spinner="{radius:8, width:1, length: 5}"></span>
            </div>
            <button class="btn blue-btn" ng-disabled="!uploadForm.$valid || uploadingFile" ng-click="uploadFile(csvFile)">Upload file</button>
        </section>
    </form>
</div>
