<div class="content-section" style="display: table;">
    <section class="form-heading">
        <h1>Monitoraggio - Stato upload</h1>
    </section>
    <section class="form-heading">
        <div class="button-list">
            <button class="ng-binding" ng-click="loadFileList()" ng-disabled="!filesLoaded">
                <span class="glyphicon glyphicon-refresh" aria-hidden="true"></span> Aggiorna lista
            </button>
        </div>
    </section>
    <div class="alert alert-danger" role="alert" ng-if="operationError">{{operationError}}</div>
    <now-table class="migrazione-ull-slu-file-table" 
        dati="files" 
        custom-header="headerList" 
        tipologia="'file caricati'" 
        show-spinner="filesLoaded" 
        vista="$root.VIEW.MIGRAZIONE_ULL_SLU" 
        file-actions="performFileAction(action, file)" 
        operation-in-progress-id="operationInProgressId">
    </now-table>
</div>
