<div class="content-section">
    <section class="form-heading">
        <h1>Dettaglio file</h1>
    </section>
    <section class="form-heading">
        <button class="btn btn-disabled pull-left turn-back-detail" type="button" ng-click="backToFileList()">&#60; indietro</button>
        <div class="button-list">
            <button class="ng-binding" ng-click="loadUploadStatus()"><span class="glyphicon glyphicon-refresh" aria-hidden="true"></span> Aggiorna lista</button>
        </div>
    </section>
    <div class="alert alert-danger" role="alert" ng-if="operationError">{{operationError}}</div>
    <div style="clear:both">
        <now-table dati="uploadStatuses" custom-header="headerList" tipologia="tipologia" show-spinner="statusesLoaded" vista="$root.VIEW.MIGRAZIONE_ULL_SLU"></now-table>
    </div>
</div>
