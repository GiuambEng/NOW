<div class="content-section">
	<section class="form-heading">
		<h1>File di Notifiche</h1>
	</section>
	<div style="clear:both">
		<!-- SM_8904 -->
		<now-export-file 
			ng-if="files.length>0"
			export-callback="iniziaExport"
			vista="$root.VIEW.NOTIFICHE">
		</now-export-file>
	</div>
	<div style="clear:both">
	<now-advanced-search
			 dati-to-search="paramToSearch"
			 title="ricerca avanzata"
			 titolo="tipologia"
			 callback="getSearchAdvanced()"
			 cod-funzione="tipologiaRicerca"
			>
	</now-advanced-search>
			
		<!-- SM_8904 -->
		<now-table 
		dati="files" 
		custom-header="headerList"
		tipologia="tipologia"
		detail-list="detailList"
		show-spinner="filesLoaded"
		vista="$root.VIEW.NOTIFICHE"></now-table>	
</div></div>
