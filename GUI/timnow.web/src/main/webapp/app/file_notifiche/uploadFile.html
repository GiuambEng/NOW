<div class="content-section">
	<section class="form-heading">
		<h1>Upload File</h1>
	</section>
	<form class="form-container" name="uploadForm">
		<section class="form-process">
			<p>Inserisci un file XML contenente gli ordini e le richieste</p>
			<br>
			<div class="form-group" ng-show="elencoCodiciAgcom.length>0"
				ng-class="{ 'has-error' : (oloNonUnivoco.$invalid && !oloNonUnivoco.$pristine )}">
				<select class="form-control selectmenu col-xs-3"
					style="width:200px"
					name="oloNonUnivoco" 
					ng-model="agcomSelezionato" 
					required>
					<option ng-repeat="codAgcom in elencoCodiciAgcom"
						value="{{codAgcom.codiceOLO}}">{{codAgcom.codiceOLO}}</option>
				</select>
			</div>
			<div ng-show="!elencoCodiciAgcom || elencoCodiciAgcom.length==0 || (elencoCodiciAgcom.length>0 && agcomSelezionato)" class="fileUpload btn btn-default">
				<span ng-if="!fileName">Scegli file</span><span ng-if="fileName">{{fileName}}</span>
				<input type="file" ngf-select="onFileSelect($files,uploadForm)" ngf-max-size="20MB"
					ng-model="xmlFile" name="file" class="upload" required>
			</div>
			<br>
			<section class="form-heading exportTemplate col-xs-6" ng-if="xmlFile && xmlFile.progress >= 0 && xmlFile.progress < 100 && !errorMsg">
				<div>
					<small><em>Invio del file in corso...</em></small>
							<uib-progressbar animate="true" value="xmlFile.progress"><b>{{xmlFile.progress | number:0}}%</b></uib-progressbar>
				</div>
			</section>
			<div class="upload_error" ng-if="uploadForm.file.$error.maxSize && uploadForm.file.$dirty">La dimensione massima di upload del file &eacute; 20MB</div>
			<div class="upload_error" ng-if="errorMsg">{{errorMsg}}</div>
			<div class="upload_success"
				ng-if="xmlFile && !errorMsg && xmlFile.progress==100 && xmlFile.result">Upload
				avvenuto con successo</div>
		</section>
		<section class="form-button">
			<div id="spinner_file_notifiche" ng-if="uploadingFile" class="spinner_container_direttiva">
				<span us-spinner="{radius:8, width:1, length: 5}"></span>
			</div>
			<button class="{{(!agcomSelezionato || ((!uploadForm.$valid && !checkOlo) || uploadForm.file.$error.maxSize || uploadingFile))?'btn btn-disabled':'btn blue-btn'}}" ng-disabled="(((!uploadForm.$valid && !checkOlo) || uploadForm.file.$error.maxSize || uploadingFile))"
				ng-click="uploadPic(xmlFile,agcomSelezionato)">Invia file</button>
		</section>
	</form>
</div>
