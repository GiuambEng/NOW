<div class="content-section">
	<section class="form-heading">
		<h1>Upload File Risorse FWA Decommissioning</h1>
	</section>
	<form class="form-container" name="uploadForm">
		<section class="form-process">
			<p>Inserisci un file CSV</p>
			<br>
			<div class="fileUpload btn btn-default">
				<span ng-if="!fileName">Scegli file</span><span ng-if="fileName" style="text-transform: none">{{fileName}}</span>
				<input type="file" ngf-select="onFileSelect($files)"
					ng-model="csvFile" name="file" class="upload" required>
			</div>
			<br>
			<section class="form-heading exportTemplate col-xs-6" ng-if="csvFile && csvFile.progress >= 0 && csvFile.progress < 100 && !errorMsg">
				<div>
					<small><em>Invio del file in corso...</em></small>
							<uib-progressbar animate="true" value="csvFile.progress"><b>{{csvFile.progress | number:0}}%</b></uib-progressbar>
				</div>
			</section>
			<div class="upload_error" ng-if="errorMsg">{{errorMsg}}</div>
			<div class="upload_success"
				ng-if="csvFile && !errorMsg && csvFile.progress==100 && csvFile.result">Upload avvenuto con successo</div>
		</section>
		<section class="form-button">
			<div id="spinner_file_notifiche" ng-if="uploadingFile" class="spinner_container_direttiva">
				<span us-spinner="{radius:8, width:1, length: 5}"></span>
			</div>
			<button ng-disabled="(!uploadForm.$valid || uploadingFile)"
				ng-click="uploadFile(csvFile)">Invia file</button>
		</section>
	</form>
</div>
