<div class="content-section">
	<section class="form-heading">
		<h1>Stato File Ordini e Richieste</h1>
	</section>
	<div style="clear:both">
		<section class="form-heading">
			<div class="form-group" ng-hide="isOLOUser">
				<label class="col-xs-3 control-label">OAO:<span spinner-on="olosLoading" us-spinner="{radius:5, width:2, length: 5}"></span></label>
				<select class="form-control selectmenu col-xs-3"
					style="width:200px"
					name="selectOLO" 
					ng-model="selectedOLO" 
					ng-change="loadStatoFile()"
					required>
					<option ng-repeat="olo in olos"
						value="{{olo.codiceOLO}}">{{olo.codiceOLO}}</option>
				</select>
			</div>
		</section>
	</div>
	<div style="clear:both">
		<!-- SM_8904 -->
		<now-export-file 
			ng-if="stato.length>0"
			area-funzione="STATOFILEORDINIRICHIESTE"
			export-callback="iniziaExport"
			vista="$root.VIEW.STATO_FILE">
		</now-export-file>
	</div>
		<div style="clear:both">
			<now-advanced-search
			 dati-to-search="paramToSearch"
			 title="ricerca avanzata"
			 titolo="tipologia"
			 callback="getSearchAdvanced()"
			 cod-funzione="tipologiaRicerca"
			></now-advanced-search>
			<!-- SM_8904 -->
			<now-table 
			dati="stato" 
			custom-header="headerList"
			tipologia="tipologia"
			detail-list="detailList"
			show-spinner="statoLoaded"	
			custom-action-callback="getSubmit" 	
			custom-action-label="Risottometti"
			vista="$root.VIEW.STATO_FILE"
			></now-table>		
		</div>
</div>
