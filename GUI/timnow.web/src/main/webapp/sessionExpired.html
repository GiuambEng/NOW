<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>:: NOW :: Home Page</title>

<!-- build:css assets/css/403.css -->
<link href="bower_components/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" type="text/css" href="bower_components/angular-ui/build/angular-ui.min.css" />
<link rel="stylesheet" type="text/css" href="assets/css/style.css" />
<link rel="stylesheet" type="text/css" href="assets/app/app.css" />
<!-- endbuild -->

<link rel="icon" type="image/png" href="img/favicon.png" />
</head>
<body class="exit">
    <script>
    clearCookie('TIMNOWSID');
		function clearCookie(name, domain, path){
		    var domain = domain || document.domain;
		    var path = path || "/";
		    document.cookie = name + "=; expires=" + +new Date + "; domain=" + domain + "; path=" + path;
		};
	</script>
    <div class="page-container">
        <!-------------------------        HEADER SECTION       START ----------------------------- -->
        <section class="headerbg">
            <div class="header-container">
                <div class="logo" style="height: 300px;">
                    <img src="img/logo.png" alt="logo">
                </div>
            </div>
        </section>
        <section class="help-container">
            <div class="help-section"></div>
        </section>
        <div class="ng-scope">
            <div class="banner-section ng-scope">
                <div class="banner-content">
                    <h1>Sessione scaduta</h1>
                    <p>Sei rimasto inattivo per troppo tempo.</p>
                    <p>Per tornare a NOW clicca sul bottone sotto:</p>
                    <a href="../now/#/homepage" ui-sref="root.homepage" id="buttonHome" title="Homepage" target="_parent"><button class="btn blue-btn">Vai alla Home Page</button></a>

                </div>
            </div>


            <section class="menu-container">
                <div class="row menu" style="height: 200px"></div>
            </section>
        </div>
    </div>

</body>
</html>
